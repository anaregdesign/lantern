syntax = "proto3";

package graph.v1;

import "google/protobuf/timestamp.proto";
import "graph/v1/graph.proto";

// HLCTimestamp is the wire form of core/hlc.Timestamp. All replicated
// mutations carry one of these as their causal coordinate.
//
//   wall_ns: physical wall-clock component, nanoseconds since Unix epoch.
//   logical: per-tick logical counter, incremented on collision.
//   node_id: non-zero 16-byte origin node identifier (matches core/hlc.NodeID).
//
// The triple (wall_ns, logical, node_id) gives a strict total order; see
// docs/replication.md §5 and core/hlc/hlc.go.
message HLCTimestamp {
  int64 wall_ns = 1;
  uint32 logical = 2;
  bytes node_id = 3;
}

// MutationOp is the discriminated payload of a single mutation. Each
// variant mirrors the request message of the corresponding write RPC so the
// existing server handlers can be reused verbatim when applying replicated
// mutations.
//
// Singular variants (PutVertex, AddEdge, ...) are retained as distinct
// arms — they are the wire form chosen by the client and round-tripping
// them faithfully simplifies CDC consumers that mirror RPC semantics.
message MutationOp {
  oneof op {
    PutVertexRequest put_vertex = 1;
    PutVerticesRequest put_vertices = 2;
    DeleteVertexRequest delete_vertex = 3;
    DeleteVerticesRequest delete_vertices = 4;
    DeleteVerticesByPrefixRequest delete_vertices_by_prefix = 5;
    AddEdgeRequest add_edge = 6;
    AddEdgesRequest add_edges = 7;
    PutEdgeRequest put_edge = 8;
    PutEdgesRequest put_edges = 9;
    DeleteEdgeRequest delete_edge = 10;
    DeleteEdgesRequest delete_edges = 11;
    DeleteEdgesByPrefixRequest delete_edges_by_prefix = 12;
    // Put batches accepted by the server use an ordered, outcome-bearing wire
    // form. Live payloads and causal barriers remain interleaved in original
    // request order, so duplicate identities replay exactly as committed even
    // when the receiver's wall clock differs from the origin's.
    ReplicatedPutVertices replicated_put_vertices = 13;
    ReplicatedPutEdges replicated_put_edges = 14;
    // Receipt-bearing exact Edge Delete. A new oneof arm is intentional:
    // peers unaware of this contract reject the unknown operation instead
    // of applying a graph-only Delete and advancing the origin watermark.
    ReplicatedReceiptEdgeDelete replicated_receipt_edge_delete = 15;
    // Private receipt-bearing Vertex Put/Delete envelopes retain each
    // original request position and the receiver-local graph projection.
    // Public write requests do not expose operation IDs yet.
    ReplicatedReceiptVertexPut replicated_receipt_vertex_put = 16;
    ReplicatedReceiptVertexDelete replicated_receipt_vertex_delete = 17;
  }
}

// One request-index-aligned item in a receipt-bearing Edge Delete. The
// receipt retains the original result even when a later mutation changes the
// graph. An accepted item may have existed=false yet create a causal floor.
message ReplicatedReceiptEdgeDeleteItem {
  EdgeKey key = 1;
  MutationReceipt receipt = 2;
  bool causally_accepted = 3;
}

// A complete, ordered logical call. Mutation.seq/origin/hlc outside this
// message are the sole causal coordinate. Receipt epoch and policy are kept
// alongside the graph transition; no-op calls still consume that sequence.
// This arm remains production-disabled until atomic follower replay,
// receipt-bearing Snapshot, and recovery are available.
message ReplicatedReceiptEdgeDelete {
  bytes deployment_epoch = 1;
  bytes policy_fingerprint = 2;
  google.protobuf.Timestamp tombstone_expiration = 3;
  repeated ReplicatedReceiptEdgeDeleteItem items = 4;
}

// One request-index-aligned item in a receipt-bearing Vertex Put. Original
// retains the complete semantic intent. Accepted is omitted when this receiver
// has no graph effect; when present it is either a live value or an explicit
// causal barrier and is never re-evaluated against if_absent.
message ReplicatedReceiptVertexPutItem {
  Vertex original = 1;
  MutationReceipt receipt = 2;
  ReplicatedPutVertex accepted = 3;
}

// A complete ordered conditional Vertex Put call. A call with no accepted
// graph effects still consumes Mutation.seq and persists every exact result.
message ReplicatedReceiptVertexPut {
  bytes deployment_epoch = 1;
  bytes policy_fingerprint = 2;
  bool if_absent = 3;
  repeated ReplicatedReceiptVertexPutItem items = 4;
}

// One request-index-aligned item in a receipt-bearing exact Vertex Delete.
// causally_accepted may be true when existed=false because the Delete still
// installs an identity floor.
message ReplicatedReceiptVertexDeleteItem {
  string key = 1;
  MutationReceipt receipt = 2;
  bool causally_accepted = 3;
}

// A complete ordered exact Vertex Delete call. Prefix Delete is deliberately
// excluded from the receipt-capable mutation families.
message ReplicatedReceiptVertexDelete {
  bytes deployment_epoch = 1;
  bytes policy_fingerprint = 2;
  google.protobuf.Timestamp tombstone_expiration = 3;
  repeated ReplicatedReceiptVertexDeleteItem items = 4;
}

message VertexCausalBarrier {
  string key = 1;
}

message ReplicatedPutVertex {
  oneof outcome {
    Vertex live = 1;
    VertexCausalBarrier causal_barrier = 2;
  }
}

message ReplicatedPutVertices {
  repeated ReplicatedPutVertex entries = 1;
}

message EdgeCausalBarrier {
  string tail = 1;
  string head = 2;
}

message ReplicatedPutEdge {
  oneof outcome {
    Edge live = 1;
    EdgeCausalBarrier causal_barrier = 2;
  }
}

message ReplicatedPutEdges {
  repeated ReplicatedPutEdge entries = 1;
}

// Mutation is the unit of replication: a sequenced, HLC-stamped,
// origin-tagged graph write. `seq` is an origin-local committed sequence,
// independent of the relay log's replica-local Entry.Seq, and is contiguous
// within a single origin.
//
//   seq:    per-origin contiguous sequence number, assigned at local commit.
//   hlc:    causal timestamp stamped at append time.
//   origin: 16-byte node identifier of the node that first accepted the
//           write; mirrors hlc.node_id but is kept as an explicit field so
//           anti-entropy can index by origin without inspecting the HLC.
//   op:     the actual write payload (see MutationOp).
message Mutation {
  uint64 seq = 1;
  HLCTimestamp hlc = 2;
  bytes origin = 3;
  MutationOp op = 4;
  // The origin's absolute D4 tombstone deadline for an exact-identity
  // DeleteVertex/Vertices or DeleteEdge/Edges. It is sampled once with the
  // graph effect and retained unchanged by relay and WAL replay. A receiver
  // with tombstone retention enabled must reject a Delete without it rather
  // than extend the deadline from its own wall clock. Other operations omit it.
  google.protobuf.Timestamp tombstone_expiration = 5;
}

// SubscribeRequest opens a stream of replicated mutations starting at
// the per-origin cursor in `from_seq_per_origin`.
//
// Under the leaderless Subscribe contract (#415, B-3), every replica's
// local mutation log carries entries from every cluster origin (each
// stamped with its writer's HLC NodeID). A consumer can therefore pick
// any one replica and see every committed cluster mutation; on failover
// to a different replica it resumes by passing the highest `seq` it
// has already observed FOR EACH origin.
//
// Semantics:
//
//   - Empty map (or unset field) requests every entry the server still
//     retains. This is the new-consumer / cold-start case.
//   - For each origin key present in the map, the server delivers only
//     entries with `seq >= from_seq_per_origin[origin]` for that
//     origin. Entries for origins NOT in the map are delivered from
//     the oldest retained entry; this lets a consumer that has only
//     ever talked to a subset of replicas naturally pick up entries
//     from a newly-joined origin.
//   - A truncated responder-local log returns FAILED_PRECONDITION; the
//     portable origin cursor cannot recover evicted entries. Identity-only
//     consumers use an explicit checkpoint to revalidate resident keys.
//
// Keys are 32-character lowercase hexadecimal encodings of the 16-byte
// HLC NodeID (matching `HLCTimestamp.node_id` and `Mutation.origin`).
// Hex was chosen over raw bytes because proto3 map keys forbid `bytes`
// and because the hex form already appears in `lantern_replication_*`
// Prometheus labels and in admin UI surfaces, keeping the consumer
// debug experience uniform across wire, metrics, and UI.
message SubscribeRequest {
  // Per-origin resume cursor. Keys are 32-char lowercase hex of the
  // 16-byte HLC NodeID; values are the next origin `seq` the consumer
  // expects from that origin.
  map<string, uint64> from_seq_per_origin = 1;
  // Next entry in this responder's replica-local mutation log. This is only
  // valid when resuming against the SAME responder that emitted
  // SnapshotHeader.cutoff_local_seq; zero uses the portable per-origin path.
  // Keeping the two sequence domains separate prevents a stale per-origin
  // cursor from bypassing ring-buffer gap detection.
  uint64 from_local_seq = 2;
  // The zero value preserves the full Mutation stream used by peers.
  SubscribeProjection projection = 3;
  // Identity-only cold start/recovery: atomically register the live tail and
  // send its contiguous per-origin checkpoint before any identity chunk.
  // Requires an empty cursor and from_local_seq == 0.
  bool bootstrap = 4;
  // Full-Mutation consumers must explicitly accept receipt-bearing oneof
  // arms before the server can send one. Old full-mutation peers/consumers
  // omit this field and fail closed instead of losing receipt metadata.
  bool accept_receipt_envelopes = 5;
}

enum SubscribeProjection {
  // Omitted projection preserves the historical full-Mutation stream.
  SUBSCRIBE_PROJECTION_UNSPECIFIED = 0;
  SUBSCRIBE_PROJECTION_FULL_MUTATION = 1;
  SUBSCRIBE_PROJECTION_IDENTITY_ONLY = 2;
}

// A bootstrap checkpoint is the responder's contiguous publication cut,
// not a cluster-wide consensus or freshness barrier.
message IdentityCheckpoint {
  map<string, uint64> last_seq_per_origin = 1;
}

enum IdentityOperation {
  IDENTITY_OPERATION_UNSPECIFIED = 0;
  IDENTITY_OPERATION_PUT_VERTEX = 1;
  IDENTITY_OPERATION_DELETE_VERTEX = 2;
  IDENTITY_OPERATION_ADD_EDGE = 3;
  IDENTITY_OPERATION_PUT_EDGE = 4;
  IDENTITY_OPERATION_DELETE_EDGE = 5;
  // A committed receipt envelope with no causally accepted graph identity.
  // It closes one origin sequence with a final, zero-key IdentityChunk.
  IDENTITY_OPERATION_RECEIPT_ONLY = 6;
}

// One bounded fragment of an origin mutation's exact graph identities.
// Final empty chunks are valid: they close a mutation with no identities.
// No graph value, edge weight, contribution ID, or auth metadata is present.
message IdentityChunk {
  bytes origin = 1;
  uint64 seq = 2;
  HLCTimestamp hlc = 3;
  IdentityOperation operation = 4;
  uint32 chunk_index = 5;
  bool is_last = 6;
  repeated string vertex_keys = 7;
  repeated EdgeKey edge_keys = 8;
  uint32 first_item_index = 9;
}

// Exactly one frame variant is set. Existing default full-Mutation peers
// receive the same field-1 payload as before.
message SubscribeResponse {
  oneof event {
    Mutation mutation = 1;
    IdentityCheckpoint checkpoint = 2;
    IdentityChunk identity_chunk = 3;
  }
}

// Snapshot format is an explicit compatibility boundary. A graph-only image
// cannot prove mutation-receipt continuity, even when its origin cutoffs are
// ahead of every retained log entry. RECEIPT_V2 carries one atomic graph,
// active receipt Store, retired receipt catalog, clock, and origin cut. A
// receiver that cannot install that complete format must reject its header
// before applying any body frame.
enum SnapshotFormat {
  SNAPSHOT_FORMAT_UNSPECIFIED = 0;
  SNAPSHOT_FORMAT_GRAPH_ONLY_V1 = 1;
  SNAPSHOT_FORMAT_RECEIPT_V2 = 2;
}

// SnapshotRequest opens a server-streaming snapshot at a single cutoff.
// Zero means graph-only while receipt writes are disabled. A durable receiver
// MUST request RECEIPT_V2 and check the first header's format before applying
// any body frame. The header check remains mandatory.
message SnapshotRequest {
  SnapshotFormat required_format = 1;
}

// Receipt metadata for one RECEIPT_V2 publication cut. This message is
// required exactly when an RPC Snapshot header's format is RECEIPT_V2 and is
// absent from GRAPH_ONLY_V1. active_policy names the writable Store epoch.
// retired_policies contains every represented read-only epoch, sorted strictly
// by raw deployment_epoch bytes; it cannot contain active_policy's epoch.
// Every retired policy has at least one row in the following receipt stream.
// origin_cutoffs is sorted by raw origin bytes and must exactly match
// cutoff_seq_per_origin; the full rows retain each origin's HLC as well as its
// sequence. clock_high_water_unix_ms is the active Store's sole clock
// authority, applies to every retired epoch, and must not exceed
// floor(SnapshotHeader.cutoff_hlc.wall_ns / 1ms).
message SnapshotReceiptMetadata {
  ReceiptPolicy active_policy = 1;
  uint64 clock_high_water_unix_ms = 2;
  repeated OriginState origin_cutoffs = 3;
  repeated ReceiptPolicy retired_policies = 4;
}

// SnapshotHeader is always the FIRST SnapshotResponse on the wire. It
// freezes the per-origin watermark and the snapshot-open HLC the server
// used to materialise the snapshot.
//
// A bootstrapping graph-only peer advances the cutoffs only after a verified
// footer. A RECEIPT_V2 receiver must stage and atomically install its graph,
// active Store, retired catalog, epoch policies, and clock image before
// advancing these cutoffs. It then resumes Subscribe against the SAME
// responder with both
// `from_seq_per_origin = {origin: seq+1 for each (origin, seq) in
// cutoff_seq_per_origin}` and `from_local_seq = cutoff_local_seq+1` so the
// snapshot and the live tail stitch without gap or overlap.
//
// Keys in `cutoff_seq_per_origin` are 32-char lowercase hex of the
// 16-byte HLC NodeID, matching `SubscribeRequest.from_seq_per_origin`.
// Values are the local seq of the last entry the server had applied
// from each origin when the snapshot started. An empty map indicates
// the server has not yet applied any origin (cold cluster) and the
// resume Subscribe should pass an empty cursor.
//
// RECEIPT_V2 is strict: every frame and recursively nested message must have
// no unknown protobuf fields or typed-nil oneof wrapper. Every nonzero graph
// HLC must be at or below cutoff_hlc and at or below the matching full origin
// row; a graph HLC whose origin is absent from that vector is invalid.
message SnapshotHeader {
  map<string, uint64> cutoff_seq_per_origin = 1;
  HLCTimestamp cutoff_hlc = 2;
  // Replica-local mutation-log position at snapshot open. It is deliberately
  // separate from the portable per-origin watermarks and only resumes a tail
  // against the same responder.
  uint64 cutoff_local_seq = 3;
  // Zero selects the graph-only default. A receipt-capable receiver must
  // reject zero or GRAPH_ONLY_V1 before changing any local state.
  SnapshotFormat format = 4;
  // Required and complete for RECEIPT_V2; absent for graph-only formats.
  // Deployment epochs and policy fingerprints are carried inside the active
  // and retired policies.
  SnapshotReceiptMetadata receipt_metadata = 5;
}

// SnapshotFooter is always the LAST SnapshotResponse on the wire. It carries
// the running counts the server actually streamed so receivers can detect
// truncation (channel-close, send-error mid-stream) without re-walking
// their freshly-imported state.
message SnapshotFooter {
  uint64 vertex_count = 1;
  uint64 edge_count = 2;
  uint64 vertex_causal_barrier_count = 3;
  uint64 edge_causal_barrier_count = 4;
  uint64 vertex_tombstone_count = 5;
  uint64 edge_tombstone_count = 6;
  uint64 active_receipt_count = 7;
  // Cross-checks receipt_metadata.origin_cutoffs and the graph cutoff map.
  uint64 origin_count = 8;
  // Independently cross-check the represented retired policy set and rows.
  uint64 retired_epoch_count = 9;
  uint64 retired_receipt_count = 10;
}

// SnapshotReceiptKind pins the Store mutation family independently of the
// result encoding. Prefix Delete is deliberately absent.
enum SnapshotReceiptKind {
  SNAPSHOT_RECEIPT_KIND_UNSPECIFIED = 0;
  SNAPSHOT_RECEIPT_KIND_PUT_VERTEX = 1;
  SNAPSHOT_RECEIPT_KIND_PUT_EDGE = 2;
  SNAPSHOT_RECEIPT_KIND_ADD_EDGE = 3;
  SNAPSHOT_RECEIPT_KIND_DELETE_VERTEX = 4;
  SNAPSHOT_RECEIPT_KIND_DELETE_EDGE = 5;
}

// Contribution metadata is present exactly for an AddEdge receipt. Keeping
// it in a message preserves presence and leaves room for later contribution
// metadata without changing the receipt row's identity fields.
message SnapshotReceiptContribution {
  bytes contribution_id = 1; // Nonzero 24-byte Add ContribID.
}

// One unexpired active or retired Store row in a RECEIPT_V2 image. The epoch is
// self-identifying inside operation_id. All rows are ordered strictly by raw
// operation_id bytes, which is canonical epoch+ID order for version-1 IDs.
// original_result is the exact opaque result bytes retained by the Store; it
// is not recomputed from the graph at snapshot time.
message SnapshotReceipt {
  bytes operation_id = 1; // Exactly 49 bytes.
  bytes logical_call_id = 2; // Exactly 16 nonzero bytes.
  uint32 item_index = 3;
  uint32 item_count = 4;
  SnapshotReceiptKind kind = 5;
  bytes intent_sha256 = 6; // Exactly 32 bytes.
  uint64 deadline_unix_ms = 7;
  bytes original_result = 8;
  SnapshotReceiptContribution contribution = 9;
}

// SnapshotVertex is the snapshot-time representation of a single live
// vertex. The HLC field carries the last LWW timestamp the source node
// recorded for the key (zero when the vertex has never been touched by a
// replicated Put, i.e. local-only writes); receivers feed it back through
// PutVertexWithExpirationHLC so subsequent older replays (#182) are
// correctly rejected.
message SnapshotVertex {
  Vertex vertex = 1;
  HLCTimestamp hlc = 2;
}

// SnapshotVertexCausalBarrier carries the retained LWW floor of a PutVertex
// that was accepted but already expired at its final application instant. It
// has no Vertex payload because the overwrite must remain absent; receivers
// record only (key, hlc) and reject later strictly-older live writes.
message SnapshotVertexCausalBarrier {
  string key = 1;
  HLCTimestamp hlc = 2;
}

// SnapshotEdgeContribution is one additive (or LWW-imported) entry inside
// an edge's weight bucket. Snapshot preserves the per-contribution
// decomposition so that the receiver's ContribID dedup (#182) keeps
// suppressing duplicates when peer-pump later re-delivers the same
// contribution from the live tail.
//
//   contrib_id: 24-byte ContribID for a replicated Add. Empty denotes the
//               single Put row, or a local-only legacy contribution with no
//               dedup identity.
message SnapshotEdgeContribution {
  float weight = 1;
  // Absolute expiration. An absent timestamp means a permanent contribution.
  google.protobuf.Timestamp expiration = 2;
  bytes contrib_id = 3;
  // Original Add causal position (required for nonzero contrib_id). A reset
  // delivered after this Add retains it iff this HLC is newer than the reset;
  // the enclosing edge's Put HLC cannot stand in for it.
  HLCTimestamp hlc = 4;
}

// SnapshotEdge is the snapshot-time representation of a single live edge.
// `hlc` carries the winning Put floor, including a retained causal barrier
// (zero when no Put has happened). Each Add carries its own original HLC.
message SnapshotEdge {
  string tail = 1;
  string head = 2;
  HLCTimestamp hlc = 3;
  repeated SnapshotEdgeContribution contributions = 4;
}

// SnapshotEdgeCausalBarrier is the edge sibling of
// SnapshotVertexCausalBarrier. It carries no contribution and must not create
// endpoint vertices or an edge bucket when replayed.
message SnapshotEdgeCausalBarrier {
  string tail = 1;
  string head = 2;
  HLCTimestamp hlc = 3;
}

// SnapshotVertexTombstone and SnapshotEdgeTombstone carry active Delete
// floors. Unlike causal Put barriers these have an absolute D4 deadline;
// receivers must preserve it rather than starting a fresh TTL at bootstrap.
message SnapshotVertexTombstone {
  string key = 1;
  HLCTimestamp hlc = 2;
  google.protobuf.Timestamp expiration = 3;
}

message SnapshotEdgeTombstone {
  string tail = 1;
  string head = 2;
  HLCTimestamp hlc = 3;
  google.protobuf.Timestamp expiration = 4;
}

// SnapshotResponse is the union type streamed from `rpc Snapshot`. The frame
// order is always: exactly one SnapshotHeader; for RECEIPT_V2, zero or more
// SnapshotReceipt frames; then zero or more SnapshotVertexCausalBarrier
// frames, zero or more SnapshotEdgeCausalBarrier frames, zero or more
// SnapshotVertexTombstone frames, zero or more SnapshotEdgeTombstone frames,
// zero or more SnapshotVertex frames, zero or more SnapshotEdge frames; then
// exactly one SnapshotFooter. Receivers MUST treat any other order as a
// protocol violation.
message SnapshotResponse {
  oneof entry {
    SnapshotHeader header = 1;
    SnapshotVertex vertex = 2;
    SnapshotEdge edge = 3;
    SnapshotFooter footer = 4;
    SnapshotVertexCausalBarrier vertex_causal_barrier = 5;
    SnapshotEdgeCausalBarrier edge_causal_barrier = 6;
    SnapshotVertexTombstone vertex_tombstone = 7;
    SnapshotEdgeTombstone edge_tombstone = 8;
    SnapshotReceipt receipt = 9;
  }
}

// LanternReplicationService carries the peer-to-peer (and CDC) replication
// surface. It is intentionally a separate service from LanternService so
// that operators can route, throttle, secure, or even disable replication
// independently of the public read/write API.
//
// NOTE — deviation from the original RFC: the Subscribe RPC was originally
// specified to live on LanternService. The realised proto split introduces
// a cyclic file import between graph.proto and replication.proto when both
// the request/response messages and the RPC live on opposite sides of the
// boundary. Hosting Subscribe on a dedicated service keeps the import
// graph one-way (replication.proto → graph.proto) and is documented as
// part of #178's implementation in docs/replication.md.
service LanternReplicationService {
  // Subscribe streams replicated mutations to a peer (or CDC consumer)
  // starting at the supplied per-origin cursor. A same-responder snapshot
  // resume also supplies `from_local_seq`; the server replays retained entries
  // from that local position first, then streams live mutations.
  //
  // If the requested replica-local replay window has been evicted, the call
  // fails with FAILED_PRECONDITION ("gapped") and the caller must
  // snapshot + resubscribe. Slow consumers whose channel backs up may
  // also have the stream terminated with FAILED_PRECONDITION — the
  // remedy is the same.
  //
  // No HTTP gateway annotation: replication is intentionally exposed
  // only as Connect server-streaming (consumed by replication pumps on
  // peer nodes, never directly from browsers).
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Snapshot streams a point-in-time, causally-consistent dump of every
  // live vertex and edge to a bootstrapping peer. RECEIPT_V2 additionally
  // carries the active receipt policy/rows, every bounded retired epoch policy
  // and row, the active Store clock high-water, and full origin cutoffs from
  // the same publication cut. The first frame is a SnapshotHeader; the last
  // frame is a counted SnapshotFooter.
  //
  // Bootstrap stitch contract: after receiving the SnapshotFooter the
  // peer MUST call `Subscribe(from_seq_per_origin = {origin: seq+1 for
  // each (origin, seq) in cutoff_seq_per_origin}, from_local_seq =
  // cutoff_local_seq+1)` against the same responder to pick up the live tail.
  // Without that the snapshot and live stream cannot be glued
  // together without gap or overlap.
  //
  // No HTTP gateway annotation (parity with Subscribe).
  rpc Snapshot(SnapshotRequest) returns (stream SnapshotResponse);

  // PeerStatus returns the responder's per-origin (last_applied_seq,
  // last_applied_hlc) map. Used by anti-entropy (#186) as the
  // convergence safety net for the Subscribe pump: a periodic
  // PeerStatus poll lets each node detect that the peer's view of
  // some origin is ahead of its own and request the missing tail
  // (via Subscribe(from_seq = local+1)) or — when that returns
  // FailedPrecondition — fall back to Snapshot.
  //
  // The reply set always includes the responder's OWN origin (taken
  // from its mutation log's last appended seq + hlc) plus every
  // remote origin whose mutation has ever been applied via
  // ApplyMutation since process start. Origins the responder has
  // never seen are simply absent from the map.
  //
  // The RPC is intentionally unary and stateless — callers can
  // multiplex it across many peers without holding any server-side
  // resources. Returns Unavailable when the mutation log is unset
  // (single-instance test path).
  rpc PeerStatus(PeerStatusRequest) returns (PeerStatusResponse);
}

// PeerStatusRequest is intentionally empty — the responder always
// returns its full per-origin map. Future revisions may add an
// optional origin filter without breaking the wire contract.
message PeerStatusRequest {}

// OriginState is the responder's last-applied position for a single
// origin. origin is the 16-byte HLC NodeID; last_seq is the highest
// per-origin seq ever passed through ApplyMutation (or appended to the
// local log for the responder's own origin); last_hlc is the HLC of
// that last-applied mutation.
message OriginState {
  bytes origin = 1;
  uint64 last_seq = 2;
  HLCTimestamp last_hlc = 3;
}

// PeerStatusResponse carries the responder's per-origin convergence
// map. Order is unspecified; callers index by origin.
//
// self_origin names the responder's OWN 16-byte HLC NodeID so that
// anti-entropy callers can pick out the row that represents this
// peer's own writes without having to pre-configure peer NodeIDs.
message PeerStatusResponse {
  bytes self_origin = 1;
  repeated OriginState origins = 2;
  // Fingerprint of every search setting that can change capabilities or
  // ordered results. Replicas compare this before declaring themselves ready;
  // empty means the responder cannot prove search-config compatibility.
  string search_config_fingerprint = 3;
  // The minimum Snapshot format needed to preserve the responder's durable
  // state. Snapshot rejects an unspecified or graph-only request when
  // RECEIPT_V2 is required.
  SnapshotFormat required_snapshot_format = 4;
}
