syntax = "proto3";

package graph.v1;

import "google/protobuf/timestamp.proto";

// Security is a separate control plane. Logical data RPCs cannot write sys:.
// User resources contain identity and Role membership, never direct grants.
service LanternSecurityService {
  rpc GetAuthCapabilities(GetAuthCapabilitiesRequest) returns (GetAuthCapabilitiesResponse);
  rpc GetCurrentPrincipal(GetCurrentPrincipalRequest) returns (GetCurrentPrincipalResponse);
  rpc ListIssuers(ListIssuersRequest) returns (ListIssuersResponse);
  rpc GetIssuer(GetIssuerRequest) returns (GetIssuerResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetRegistrationPolicy(GetRegistrationPolicyRequest) returns (GetRegistrationPolicyResponse);
  // Contacted-node application state; a committed policy is not all-node application.
  rpc GetLogSettings(GetLogSettingsRequest) returns (GetLogSettingsResponse);
  // Verified desired state and actual application of the eight closed groups.
  rpc GetOperationalSettings(GetOperationalSettingsRequest) returns (GetOperationalSettingsResponse);
  // Read-only dependency resolution before the existing authoritative review.
  rpc PreviewOperationalPolicy(PreviewOperationalPolicyRequest) returns (PreviewOperationalPolicyResponse);
  rpc ListRoleAssignments(ListRoleAssignmentsRequest) returns (ListRoleAssignmentsResponse);
  rpc ListSecurityAudit(ListSecurityAuditRequest) returns (ListSecurityAuditResponse);
  rpc GetRoleTemplates(GetRoleTemplatesRequest) returns (GetRoleTemplatesResponse);
  rpc ExplainAccess(ExplainAccessRequest) returns (ExplainAccessResponse);
  rpc ValidateIssuer(ValidateIssuerRequest) returns (ValidateIssuerResponse);
  // Nonmutating authoritative review; approval never rotates a session.
  rpc PrepareSecurityChanges(PrepareSecurityChangesRequest) returns (PrepareSecurityChangesResponse);
  rpc BeginSecurityChangeAuthorization(BeginSecurityChangeAuthorizationRequest) returns (BeginSecurityChangeAuthorizationResponse);
  rpc GetSecurityChangeAuthorization(GetSecurityChangeAuthorizationRequest) returns (GetSecurityChangeAuthorizationResponse);
  // Plural is canonical and atomic, with request-index-aligned outcomes.
  rpc ApplySecurityChanges(ApplySecurityChangesRequest) returns (ApplySecurityChangesResponse);
  rpc ApplySecurityChange(ApplySecurityChangeRequest) returns (ApplySecurityChangeResponse);
  // Retained commit proof only; item outcomes and replay acknowledgement belong to Apply.
  rpc GetSecurityChangeStatus(GetSecurityChangeStatusRequest) returns (GetSecurityChangeStatusResponse);
}

enum AuthMode {
  AUTH_MODE_UNSPECIFIED = 0;
  AUTH_MODE_OFF = 1;
  AUTH_MODE_OIDC = 2;
}

message GetAuthCapabilitiesRequest {}
message LoginIssuer {
  string issuer = 1;
  string label = 2;
}
message GetAuthCapabilitiesResponse {
  AuthMode mode = 1;
  repeated LoginIssuer login_issuers = 2;
  string login_path = 3;
  uint32 protocol_version = 4;
  // Explicit OFF is ready; OIDC readiness requires current serving authority.
  // False never implies OFF, and clients must reject unknown protocol versions.
  bool ready = 5;
  // Required when protocol_version=2. Configuration identity, never a lease.
  CurrentAuthorityProfile current_profile = 6;
  // Routing capability only: an eligible member without an owned origin may
  // read/complete original work, but cannot mint a new change or login session.
  bool current_origin_enabled = 7;
  uint32 current_member = 8;
}

enum SecurityPrincipalKind {
  SECURITY_PRINCIPAL_KIND_UNSPECIFIED = 0;
  SECURITY_PRINCIPAL_KIND_OIDC = 1;
  SECURITY_PRINCIPAL_KIND_MACHINE = 2;
}
message SecurityIdentity {
  SecurityPrincipalKind kind = 1;
  string issuer = 2;
  string subject = 3;
  string machine_name = 4;
}

enum SecurityPrincipalState {
  SECURITY_PRINCIPAL_STATE_UNSPECIFIED = 0;
  SECURITY_PRINCIPAL_STATE_ACTIVE = 1;
  SECURITY_PRINCIPAL_STATE_SUSPENDED = 2;
  SECURITY_PRINCIPAL_STATE_DELETED = 3;
}

enum SecurityAction {
  SECURITY_ACTION_UNSPECIFIED = 0;
  SECURITY_ACTION_VERTEX_READ = 1;
  SECURITY_ACTION_VERTEX_WRITE = 2;
  SECURITY_ACTION_VERTEX_DELETE = 3;
  SECURITY_ACTION_EDGE_READ = 4;
  SECURITY_ACTION_EDGE_ADD = 5;
  SECURITY_ACTION_EDGE_WRITE = 6;
  SECURITY_ACTION_EDGE_DELETE = 7;
  SECURITY_ACTION_QUERY = 8;
  SECURITY_ACTION_CDC_IDENTITY = 9;
  SECURITY_ACTION_CDC_VALUE = 10;
  SECURITY_ACTION_EXPORT = 11;
  SECURITY_ACTION_RECEIPT_READ = 12;
  SECURITY_ACTION_OPERATIONS_READ = 13;
  SECURITY_ACTION_SCHEMA_READ = 14;
  SECURITY_ACTION_MANAGE = 15;
  SECURITY_ACTION_EDGE_CREATE = 16;
}
enum SecurityEffect {
  SECURITY_EFFECT_UNSPECIFIED = 0;
  SECURITY_EFFECT_ALLOW = 1;
  SECURITY_EFFECT_DENY = 2;
}

// Selectors use literal logical-key prefixes. Empty prefix explicitly means
// all data. Pair is a retired diagnostic shape: Server rejects every pair
// selector and independent Edge action in a Role. Edge permissions are derived
// from Vertex grants; pair must never be interpreted as permission authority.
message SecurityPrefixPair {
  string tail_prefix = 1;
  string head_prefix = 2;
}

// Inserts the installed Principal's Server-owned UID between byte literals.
// Before must end with ':' and after must start with ':'. Neither is empty.
// This is one typed UID slot, not a template language or client-supplied UID.
message SecurityPrincipalUIDPrefix {
  string literal_before = 1;
  string literal_after = 2;
}
message SecurityRule {
  string id = 1;
  SecurityEffect effect = 2;
  SecurityAction action = 3;
  oneof resource {
    string prefix = 4;
    bool global = 5;
    SecurityPrefixPair pair = 6;
    SecurityPrincipalUIDPrefix principal_uid_prefix = 7;
  }
}
message SecurityRole {
  string id = 1;
  string name = 2;
  repeated SecurityRule rules = 3;
  // Read-only: an environment-owned membership protects this Role policy.
  bool env_owned = 4;
}
message SecurityRoleAssignment {
  SecurityIdentity identity = 1;
  string role_id = 2;
  bool env_owned = 3;
}
message SecurityUser {
  SecurityIdentity identity = 1;
  SecurityPrincipalState state = 2;
  repeated SecurityRoleAssignment assignments = 3;
  // Read-only, allocated once by explicit verified registration. Ordinary user
  // management never accepts this value as input; deleted tombstones retain it.
  optional string user_id = 4;
}
message SecurityIssuer {
  string issuer = 1;
  bool enabled = 2;
  string client_id = 3;
  string api_audience = 4;
  string redirect_uri = 5;
  repeated string algorithms = 6;
  // Write-only handle to an operator binding; reads never return the handle.
  optional string secret_ref = 7;
  uint64 config_revision = 8;
  bool env_owned = 9;
  bool deleted = 10;
  bool has_secret_binding = 11;
  // Trusted issuance contract: OAuth client subjects cannot collide with or
  // impersonate exact enrolled end-users. Qualify before enabling.
  bool human_subject_namespace_qualified = 12;
  // Canonically ordered by id; native-only Issuers omit browser/API fields.
  repeated SecurityNativeClient native_clients = 13;
}

enum NativeClientKind {
  NATIVE_CLIENT_KIND_UNSPECIFIED = 0;
  NATIVE_CLIENT_KIND_GOOGLE_ID_TOKEN = 1;
  NATIVE_CLIENT_KIND_APPLE_NATIVE = 2;
  NATIVE_CLIENT_KIND_APPLE_ANDROID_WEB = 3;
}
message SecurityNativeClient {
  string id = 1;
  NativeClientKind kind = 2;
  string client_id = 3;
  string service_origin = 4;
  repeated string presenters = 5;
  string redirect_uri = 6;
  string android_package = 7;
  // Write-only operator binding handle. Omission preserves the exact existing
  // profile's binding; a new Apple profile requires an explicit handle.
  optional string secret_ref = 8;
  bool has_secret_binding = 9;
}
message SecurityVersion {
  uint64 revision = 1;
  bytes digest = 2;
  bytes generation = 3;
  // Current protocol uses these fields and leaves the legacy scalar fields
  // above empty. Never compare cuts from different profiles by sequence.
  CurrentAuthorityProfile current_profile = 4;
  CurrentSemanticCut current_cut = 5;
  bytes admission_binding = 6;
}
message GetCurrentPrincipalRequest {}
message GetCurrentPrincipalResponse {
  SecurityIdentity identity = 1;
  repeated SecurityRole roles = 2;
  SecurityVersion version = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool recent_authentication = 5;
  // Opaque browser CSRF proof, returned only on the browser session surface.
  string csrf_token = 6;
  // Immutable Server-installed user ID; absent for UID-less or machine Principals.
  // This self metadata requires no additional Role and never grants data access.
  optional string user_id = 7;
}

// Same-origin /auth/session and /auth/logout HTTP responses. OIDC tokens never
// cross this boundary; principal is absent only when mode is explicitly OFF.
message BrowserSession {
  AuthMode mode = 1;
  GetCurrentPrincipalResponse principal = 2;
  CurrentAuthorityProfile current_profile = 3;
}
message SessionRevocation {
  SecurityVersion version = 1;
  SecurityEnforcementState enforcement = 2;
  CurrentSecurityChangeResult current_result = 3;
  // Local cookie removal is independent of durable cluster completion.
  bool local_cookie_cleared = 4;
  // First, retain this server-minted review before dispatching logout Apply.
  CurrentSessionRevocationReview current_review = 5;
}
message CurrentSessionRevocationReview {
  CurrentAuthorityProfile profile = 1;
  CurrentSemanticCut expected_cut = 2;
  CurrentSecurityChangeID change_id = 3;
  SecurityIdentity actor = 4;
  bytes intent_digest = 5;
  string session_digest = 6;
  uint64 session_lineage = 7;
}
message CurrentLogoutRequest {
  CurrentAuthorityProfile profile = 1;
  bool prepare_only = 2;
  CurrentSessionRevocationReview review = 3;
  // Same-origin local cookie deletion makes no cluster completion claim.
  bool local_only = 4;
}
message ListIssuersRequest {
  uint32 limit = 1;
  string cursor = 2;
  // Optional exact URL, Role ID or subject selector within the selected list.
  string exact = 3;
}
message ListRolesRequest {
  uint32 limit = 1;
  string cursor = 2;
  // Optional exact URL, Role ID or subject selector within the selected list.
  string exact = 3;
}
message ListUsersRequest {
  uint32 limit = 1;
  string cursor = 2;
  // Optional exact URL, Role ID or subject selector within the selected list.
  string exact = 3;
}
message ListSecurityAuditRequest {
  uint32 limit = 1;
  string cursor = 2;
  // Optional exact URL, Role ID or subject selector within the selected list.
  string exact = 3;
}
message GetIssuerRequest {
  string issuer = 1;
}
message GetIssuerResponse {
  SecurityIssuer issuer = 1;
  SecurityVersion version = 2;
}
message GetRoleRequest {
  string id = 1;
}
message GetRoleResponse {
  SecurityRole role = 1;
  SecurityVersion version = 2;
}
message GetUserRequest {
  SecurityIdentity identity = 1;
}
message GetUserResponse {
  SecurityUser user = 1;
  SecurityVersion version = 2;
}
message ListIssuersResponse {
  repeated SecurityIssuer issuers = 1;
  SecurityVersion version = 2;
  string next_cursor = 3;
}
message ListRolesResponse {
  repeated SecurityRole roles = 1;
  SecurityVersion version = 2;
  string next_cursor = 3;
}
message ListUsersResponse {
  repeated SecurityUser users = 1;
  SecurityVersion version = 2;
  string next_cursor = 3;
}
message ListRoleAssignmentsRequest {
  SecurityIdentity identity = 1;
}
message ListRoleAssignmentsResponse {
  repeated SecurityRoleAssignment assignments = 1;
  SecurityVersion version = 2;
}
message SecurityAuditRecord {
  uint64 revision = 1;
  string change_id = 2;
  string intent_digest = 3;
  string actor_digest = 4;
  google.protobuf.Timestamp occurred_at = 5;
  string operation = 6;
  repeated string target_digests = 7;
  uint32 additional_targets = 8;
  string outcome = 9;
}
message ListSecurityAuditResponse {
  repeated SecurityAuditRecord records = 1;
  SecurityVersion version = 2;
  string next_cursor = 3;
  repeated CurrentSecurityAuditRecord current_records = 4;
}
message GetRoleTemplatesRequest {
  string prefix = 1;
}
message GetRoleTemplatesResponse {
  repeated SecurityRole roles = 1;
  SecurityVersion version = 2;
}
message SecurityEdgeIdentity {
  string tail = 1;
  string head = 2;
}
message ExplainAccessRequest {
  SecurityIdentity identity = 1;
  SecurityAction action = 2;
  // Omit both selectors for a global capability. Supplying both is invalid.
  optional string logical_key = 3;
  SecurityEdgeIdentity edge = 4;
}
message SecurityRuleMatch {
  string role_id = 1;
  string rule_id = 2;
  SecurityEffect effect = 3;
  // Actual grantable capability required by this part of the operation.
  SecurityAction action = 4;
  // "tail" or "head" for a derived Edge check; empty for ordinary grants.
  string endpoint = 5;
}
message ExplainAccessResponse {
  bool allowed = 1;
  repeated SecurityRuleMatch matches = 2;
  SecurityVersion version = 3;
}
message ValidateIssuerRequest {
  SecurityIssuer issuer = 1;
}
message ValidateIssuerResponse {
  bool valid = 1;
}

message SecurityUserStateChange {
  SecurityIdentity identity = 1;
  SecurityPrincipalState state = 2;
}
message SecurityRegistrationProfile {
  string issuer = 1;
  string client_profile_id = 2;
}

// Default absent/disabled. Expansion requires operation-bound reauthentication.
message SecurityRegistrationPolicy {
  uint32 version = 1;
  bool enabled = 2;
  string role_id = 3;
  repeated SecurityRegistrationProfile profiles = 4;
}
message GetRegistrationPolicyRequest {}
message GetRegistrationPolicyResponse {
  SecurityRegistrationPolicy policy = 1;
  SecurityVersion version = 2;
}

enum ManagedLogLevel {
  MANAGED_LOG_LEVEL_UNSPECIFIED = 0;
  MANAGED_LOG_LEVEL_DEBUG = 1;
  MANAGED_LOG_LEVEL_INFO = 2;
  MANAGED_LOG_LEVEL_WARN = 3;
  MANAGED_LOG_LEVEL_ERROR = 4;
}

// Typed business intent only. The committed owner allocates the generation.
message ManagedLogPolicy {
  uint32 version = 1;
  ManagedLogLevel level = 2;
}
enum LogSettingsSource {
  LOG_SETTINGS_SOURCE_UNSPECIFIED = 0;
  LOG_SETTINGS_SOURCE_DEFAULT = 1;
  LOG_SETTINGS_SOURCE_ENVIRONMENT = 2;
  LOG_SETTINGS_SOURCE_MANAGED = 3;
}
enum LogPolicyAdoptionState {
  LOG_POLICY_ADOPTION_STATE_UNSPECIFIED = 0;
  LOG_POLICY_ADOPTION_STATE_UNADOPTED = 1;
  // No policy has committed, but this node has a durable format floor.
  LOG_POLICY_ADOPTION_STATE_FENCED_UNADOPTED = 2;
  LOG_POLICY_ADOPTION_STATE_MANAGED = 3;
}
enum LogSettingsApplicationState {
  LOG_SETTINGS_APPLICATION_STATE_UNSPECIFIED = 0;
  LOG_SETTINGS_APPLICATION_STATE_APPLIED = 1;
  LOG_SETTINGS_APPLICATION_STATE_PENDING = 2;
  LOG_SETTINGS_APPLICATION_STATE_ERROR = 3;
}
enum LogSettingsError {
  LOG_SETTINGS_ERROR_UNSPECIFIED = 0;
  LOG_SETTINGS_ERROR_NONE = 1;
  LOG_SETTINGS_ERROR_INVALID_POLICY = 2;
  LOG_SETTINGS_ERROR_OWNER_UNAVAILABLE = 3;
  LOG_SETTINGS_ERROR_APPLY_FAILED = 4;
}
message GetLogSettingsRequest {}

// Correlation with the exact retained signed adoption intent. This is not the
// signed proof, an authorization credential or an internal journal position.
message LogPolicyPreparationReference {
  CurrentSecurityChangeID change_id = 1;
  bytes intent_digest = 2;
  bytes actor_digest = 3;
}
message GetLogSettingsResponse {
  uint32 schema_version = 1;
  // Fixed configured member identity, never a private endpoint or listener.
  uint32 member = 2;
  ManagedLogLevel effective_level = 3;
  LogSettingsSource source = 4;
  // Absent only in verified unadopted state; never an unavailable-state fallback.
  ManagedLogPolicy desired = 5;
  uint64 desired_generation = 6;
  uint64 applied_generation = 7;
  LogPolicyAdoptionState adoption = 8;
  LogSettingsApplicationState application = 9;
  // Closed content-free diagnostics; raw provider errors and paths are private.
  LogSettingsError error = 10;
  bool restart_required = 11;
  SecurityVersion version = 12;
  // The exact cut successfully installed by this node, not a peer acknowledgement.
  CurrentSemanticCut applied_cut = 13;
  // Required for fenced-but-unadopted state; may remain after adoption.
  LogPolicyPreparationReference preparation = 14;
}

// Closed business values only. No arbitrary configuration keys or secret values.
enum OperationalGroup {
  OPERATIONAL_GROUP_UNSPECIFIED = 0;
  OPERATIONAL_GROUP_SLOW_RPC = 1;
  OPERATIONAL_GROUP_RATE = 2;
  OPERATIONAL_GROUP_REQUEST = 3;
  OPERATIONAL_GROUP_BACKUP = 4;
  OPERATIONAL_GROUP_CAPACITY = 5;
  OPERATIONAL_GROUP_LIFECYCLE = 6;
  OPERATIONAL_GROUP_SEARCH = 7;
  OPERATIONAL_GROUP_REPLICATION = 8;
}
enum OperationalSearchMode {
  OPERATIONAL_SEARCH_MODE_UNSPECIFIED = 0;
  OPERATIONAL_SEARCH_MODE_ANY = 1;
  OPERATIONAL_SEARCH_MODE_ALL = 2;
  OPERATIONAL_SEARCH_MODE_MIN_SHOULD = 3;
}
message OperationalSlowRPCValues {
  int64 threshold_ms = 1;
}
message OperationalRateValues {
  double rps = 1;
  int64 burst = 2;
}
message OperationalRequestValues {
  int64 delete_by_prefix_default_limit = 1;
  int64 delete_by_prefix_max_limit = 2;
  int64 illuminate_max_k = 3;
  int64 illuminate_max_step = 4;
  int64 max_batch_size = 5;
  int64 max_key_len = 6;
  int64 scan_default_limit = 7;
  int64 scan_max_limit = 8;
  int64 traversal_max_pushes = 9;
  int64 traversal_max_results = 10;
  int64 traversal_max_touched_edges = 11;
  int64 traversal_timeout_ms = 12;
}
message OperationalBackupValues {
  bool enabled = 1;
  int64 interval_nanos = 2;
  int64 retain = 3;
}
message OperationalCapacityValues {
  int64 gc_edge_budget = 1;
  int64 gc_interval_seconds = 2;
  int64 max_edges = 3;
  int64 max_edge_causal_entries = 4;
  int64 max_vertex_causal_entries = 5;
  int64 max_vertices = 6;
}
message OperationalLifecycleValues {
  int64 drain_delay_seconds = 1;
  uint64 max_replication_lag = 2;
  int64 shutdown_timeout_seconds = 3;
}
message OperationalSearchValues {
  int64 default_limit = 1;
  int64 max_limit = 2;
  OperationalSearchMode default_mode = 3;
  int64 default_min_should = 4;
  int64 timeout_ms = 5;
  int64 max_query_bytes = 6;
  int64 max_query_terms = 7;
  int64 max_dictionary_visits = 8;
  int64 max_posting_visits = 9;
  int64 max_position_visits = 10;
  int64 max_expiration_visits = 11;
}
message OperationalReplicationValues {
  int64 anti_entropy_gap_warn_threshold = 1;
  int64 anti_entropy_interval_ms = 2;
  int64 anti_entropy_subscribe_timeout_ms = 3;
  int64 pump_backoff_max_ms = 4;
  int64 pump_backoff_min_ms = 5;
}
message OperationalPolicyValues {
  oneof group {
    OperationalSlowRPCValues slow_rpc = 1;
    OperationalRateValues rate = 2;
    OperationalRequestValues request = 3;
    OperationalBackupValues backup = 4;
    OperationalCapacityValues capacity = 5;
    OperationalLifecycleValues lifecycle = 6;
    OperationalSearchValues search = 7;
    OperationalReplicationValues replication = 8;
  }
}

// The authority allocates generation; zero expected_generation means adoption.
message OperationalPolicyChange {
  uint32 version = 1;
  uint64 expected_generation = 2;
  OperationalPolicyValues values = 3;
  // Search engine compatibility metadata, resolved by Preview, never editable.
  string compatibility_fingerprint = 4;
  // Explicit acknowledgement, sealed in the exact immutable reviewed intent.
  bool retention_reduction_acknowledged = 5;
}
message ManagedOperationalPolicy {
  uint32 version = 1;
  uint64 generation = 2;
  OperationalPolicyValues values = 3;
  string compatibility_fingerprint = 4;
}

// Field identity is closed and carries provenance only, never arbitrary values.
enum OperationalSetting {
  OPERATIONAL_SETTING_UNSPECIFIED = 0;
  OPERATIONAL_SETTING_SLOW_RPC_THRESHOLD_MS = 1;
  OPERATIONAL_SETTING_RATE_RPS = 2;
  OPERATIONAL_SETTING_RATE_BURST = 3;
  OPERATIONAL_SETTING_REQUEST_DELETE_BY_PREFIX_DEFAULT_LIMIT = 4;
  OPERATIONAL_SETTING_REQUEST_DELETE_BY_PREFIX_MAX_LIMIT = 5;
  OPERATIONAL_SETTING_REQUEST_ILLUMINATE_MAX_K = 6;
  OPERATIONAL_SETTING_REQUEST_ILLUMINATE_MAX_STEP = 7;
  OPERATIONAL_SETTING_REQUEST_MAX_BATCH_SIZE = 8;
  OPERATIONAL_SETTING_REQUEST_MAX_KEY_LEN = 9;
  OPERATIONAL_SETTING_REQUEST_SCAN_DEFAULT_LIMIT = 10;
  OPERATIONAL_SETTING_REQUEST_SCAN_MAX_LIMIT = 11;
  OPERATIONAL_SETTING_REQUEST_TRAVERSAL_MAX_PUSHES = 12;
  OPERATIONAL_SETTING_REQUEST_TRAVERSAL_MAX_RESULTS = 13;
  OPERATIONAL_SETTING_REQUEST_TRAVERSAL_MAX_TOUCHED_EDGES = 14;
  OPERATIONAL_SETTING_REQUEST_TRAVERSAL_TIMEOUT_MS = 15;
  OPERATIONAL_SETTING_BACKUP_ENABLED = 16;
  OPERATIONAL_SETTING_BACKUP_INTERVAL_NANOS = 17;
  OPERATIONAL_SETTING_BACKUP_RETAIN = 18;
  OPERATIONAL_SETTING_CAPACITY_GC_EDGE_BUDGET = 19;
  OPERATIONAL_SETTING_CAPACITY_GC_INTERVAL_SECONDS = 20;
  OPERATIONAL_SETTING_CAPACITY_MAX_EDGES = 21;
  OPERATIONAL_SETTING_CAPACITY_MAX_EDGE_CAUSAL_ENTRIES = 22;
  OPERATIONAL_SETTING_CAPACITY_MAX_VERTEX_CAUSAL_ENTRIES = 23;
  OPERATIONAL_SETTING_CAPACITY_MAX_VERTICES = 24;
  OPERATIONAL_SETTING_LIFECYCLE_DRAIN_DELAY_SECONDS = 25;
  OPERATIONAL_SETTING_LIFECYCLE_MAX_REPLICATION_LAG = 26;
  OPERATIONAL_SETTING_LIFECYCLE_SHUTDOWN_TIMEOUT_SECONDS = 27;
  OPERATIONAL_SETTING_SEARCH_DEFAULT_LIMIT = 28;
  OPERATIONAL_SETTING_SEARCH_MAX_LIMIT = 29;
  OPERATIONAL_SETTING_SEARCH_DEFAULT_MODE = 30;
  OPERATIONAL_SETTING_SEARCH_DEFAULT_MIN_SHOULD = 31;
  OPERATIONAL_SETTING_SEARCH_TIMEOUT_MS = 32;
  OPERATIONAL_SETTING_SEARCH_MAX_QUERY_BYTES = 33;
  OPERATIONAL_SETTING_SEARCH_MAX_QUERY_TERMS = 34;
  OPERATIONAL_SETTING_SEARCH_MAX_DICTIONARY_VISITS = 35;
  OPERATIONAL_SETTING_SEARCH_MAX_POSTING_VISITS = 36;
  OPERATIONAL_SETTING_SEARCH_MAX_POSITION_VISITS = 37;
  OPERATIONAL_SETTING_SEARCH_MAX_EXPIRATION_VISITS = 38;
  OPERATIONAL_SETTING_REPLICATION_ANTI_ENTROPY_GAP_WARN_THRESHOLD = 39;
  OPERATIONAL_SETTING_REPLICATION_ANTI_ENTROPY_INTERVAL_MS = 40;
  OPERATIONAL_SETTING_REPLICATION_ANTI_ENTROPY_SUBSCRIBE_TIMEOUT_MS = 41;
  OPERATIONAL_SETTING_REPLICATION_PUMP_BACKOFF_MAX_MS = 42;
  OPERATIONAL_SETTING_REPLICATION_PUMP_BACKOFF_MIN_MS = 43;
}
enum OperationalSettingsSource {
  OPERATIONAL_SETTINGS_SOURCE_UNSPECIFIED = 0;
  OPERATIONAL_SETTINGS_SOURCE_DEFAULT = 1;
  OPERATIONAL_SETTINGS_SOURCE_ENVIRONMENT = 2;
  OPERATIONAL_SETTINGS_SOURCE_DERIVED = 3;
  OPERATIONAL_SETTINGS_SOURCE_MANAGED = 4;
}
enum OperationalSettingsChangeMode {
  OPERATIONAL_SETTINGS_CHANGE_MODE_UNSPECIFIED = 0;
  OPERATIONAL_SETTINGS_CHANGE_MODE_UNAVAILABLE = 1;
  OPERATIONAL_SETTINGS_CHANGE_MODE_HOT = 2;
  OPERATIONAL_SETTINGS_CHANGE_MODE_WORKER_RESTART = 3;
  OPERATIONAL_SETTINGS_CHANGE_MODE_PROCESS_RESTART = 4;
  OPERATIONAL_SETTINGS_CHANGE_MODE_COORDINATED_RESTART = 5;
}
enum OperationalSettingsApplicationState {
  OPERATIONAL_SETTINGS_APPLICATION_STATE_UNSPECIFIED = 0;
  OPERATIONAL_SETTINGS_APPLICATION_STATE_UNAVAILABLE = 1;
  OPERATIONAL_SETTINGS_APPLICATION_STATE_APPLIED = 2;
  OPERATIONAL_SETTINGS_APPLICATION_STATE_PENDING = 3;
  OPERATIONAL_SETTINGS_APPLICATION_STATE_ERROR = 4;
}
enum OperationalSettingsError {
  OPERATIONAL_SETTINGS_ERROR_UNSPECIFIED = 0;
  OPERATIONAL_SETTINGS_ERROR_NONE = 1;
  OPERATIONAL_SETTINGS_ERROR_INVALID_POLICY = 2;
  OPERATIONAL_SETTINGS_ERROR_OWNER_UNAVAILABLE = 3;
  OPERATIONAL_SETTINGS_ERROR_APPLY_FAILED = 4;
  OPERATIONAL_SETTINGS_ERROR_DEPENDENCY_UNAVAILABLE = 5;
  OPERATIONAL_SETTINGS_ERROR_COMPATIBILITY_MISMATCH = 6;
}
message OperationalSettingProvenance {
  OperationalSetting setting = 1;
  OperationalSettingsSource source = 2;
}
message OperationalGroupSettings {
  OperationalGroup group = 1;
  ManagedOperationalPolicy desired = 2;
  // Absent for an unavailable owner or explicitly invalid bootstrap values.
  // Invalid bootstrap keeps installed change mode and provenance, with ERROR.
  OperationalPolicyValues effective = 3;
  repeated OperationalSettingProvenance provenance = 4;
  uint64 applied_generation = 5;
  CurrentSemanticCut applied_cut = 6;
  OperationalSettingsChangeMode change_mode = 7;
  LogPolicyAdoptionState adoption = 8;
  OperationalSettingsApplicationState application = 9;
  OperationalSettingsError error = 10;
  bool restart_required = 11;
  LogPolicyPreparationReference preparation = 12;
  // Actual local Search engine fingerprint, including the excluded baseline.
  string effective_compatibility_fingerprint = 13;
}
message GetOperationalSettingsRequest {}
message GetOperationalSettingsResponse {
  uint32 schema_version = 1;
  uint32 member = 2;
  // Exactly eight groups in the stable OperationalGroup ordering.
  repeated OperationalGroupSettings groups = 3;
  SecurityVersion version = 4;
}

// Connected-node sample only; this does not predict cluster-wide deletions or
// freeze the catalog for future scheduled backup production.
message OperationalBackupRetentionPreview {
  uint64 valid_backups = 1;
  uint64 valid_bytes = 2;
  uint64 prune_backups = 3;
  uint64 prune_bytes = 4;
  bool complete = 5;
  string fingerprint = 6;
}
message PreviewOperationalPolicyRequest {
  OperationalPolicyValues values = 1;
}
message PreviewOperationalPolicyResponse {
  uint32 schema_version = 1;
  OperationalGroup group = 2;
  string compatibility_fingerprint = 3;
  SecurityVersion version = 4;
  OperationalBackupRetentionPreview backup_retention = 5;
  OperationalCapacityPreview capacity_usage = 6;
}

message SecurityChange {
  oneof operation {
    SecurityIssuer put_issuer = 1;
    string disable_issuer = 2;
    string delete_issuer = 3;
    SecurityRole put_role = 4;
    string delete_role = 5;
    SecurityUserStateChange put_user = 6;
    SecurityIdentity delete_user = 7;
    SecurityRoleAssignment put_assignment = 8;
    SecurityRoleAssignment delete_assignment = 9;
    SecurityIdentity revoke_user_sessions = 10;
    SecurityRegistrationPolicy put_registration_policy = 11;
    ManagedLogPolicy put_log_policy = 12;
    OperationalPolicyChange put_operational_policy = 13;
  }
}
enum SecurityEnforcementState {
  SECURITY_ENFORCEMENT_STATE_UNSPECIFIED = 0;
  SECURITY_ENFORCEMENT_STATE_COMMITTED_PENDING = 1;
  SECURITY_ENFORCEMENT_STATE_ENFORCED = 2;
}
message ApplySecurityChangesRequest {
  uint64 expected_revision = 1;
  bytes change_id = 2;
  repeated SecurityChange changes = 3;
  // Purpose proof is excluded from retained canonical business intent.
  bytes authorization_proof = 4;
  // Protocol 2: legacy expected_revision/change_id/changes must be absent.
  CurrentSecurityReview current_review = 5;
}
message ApplySecurityChangesResponse {
  SecurityVersion version = 1;
  repeated bool applied = 2;
  bool replayed = 3;
  SecurityEnforcementState enforcement = 4;
  CurrentSecurityChangeResult current_result = 5;
}
message ApplySecurityChangeRequest {
  uint64 expected_revision = 1;
  bytes change_id = 2;
  SecurityChange change = 3;
  bytes authorization_proof = 4;
  // Exactly one change; the same review/identity as the plural operation.
  CurrentSecurityReview current_review = 5;
}

message SecurityChangeReview {
  SecurityVersion expected_version = 1;
  bytes change_id = 2;
  repeated SecurityChange changes = 3;
}

// Apply error detail: this invocation was definitely refused before durable
// persistence because operation authorization was missing/invalid/expired.
// It does not settle any earlier invocation whose response was lost.
message SecurityOperationAuthorizationRequired {
  bytes change_id = 1;
  SecurityVersion expected_version = 2;
  bytes intent_digest = 3;
}

// Definitive refusal of this decoded Apply invocation before any persistence
// attempt. This never settles earlier invocations of the same change ID.
message SecurityChangePrecommitRejected {
  bytes change_id = 1;
  uint64 expected_revision = 2;
  SecurityChangeRejectionReason reason = 3;
}
enum SecurityChangeRejectionReason {
  SECURITY_CHANGE_REJECTION_REASON_UNSPECIFIED = 0;
  SECURITY_CHANGE_REJECTION_REASON_INVALID_CHANGES = 1;
  SECURITY_CHANGE_REJECTION_REASON_UNKNOWN_ROLE = 2;
  SECURITY_CHANGE_REJECTION_REASON_ISSUER_VALIDATION = 3;
  SECURITY_CHANGE_REJECTION_REASON_ENVIRONMENT_OWNED = 4;
  SECURITY_CHANGE_REJECTION_REASON_LAST_ADMINISTRATOR = 5;
  SECURITY_CHANGE_REJECTION_REASON_REVISION_CONFLICT = 6;
}
enum SecurityAuthorizationRequirement {
  SECURITY_AUTHORIZATION_REQUIREMENT_UNSPECIFIED = 0;
  SECURITY_AUTHORIZATION_REQUIREMENT_ORDINARY = 1;
  SECURITY_AUTHORIZATION_REQUIREMENT_REAUTHENTICATION = 2;
}
message PrepareSecurityChangesRequest {
  SecurityChangeReview review = 1;
  // First preparation supplies profile/cut/changes only. The enrolled origin
  // allocates the identity. A retained review resolves its original operation.
  CurrentSecurityReview current_review = 2;
}
message PrepareSecurityChangesResponse {
  SecurityVersion expected_version = 1;
  bytes change_id = 2;
  bytes intent_digest = 3;
  SecurityAuthorizationRequirement requirement = 4;
  // A known committed ID is recovered using its original retained proof.
  GetSecurityChangeStatusResponse retained_commit = 5;
  CurrentSecurityReview current_review = 6;
  CurrentSecurityChangeResult current_result = 7;
}
message BeginSecurityChangeAuthorizationRequest {
  SecurityChangeReview review = 1;
  CurrentSecurityReview current_review = 2;
}
message BeginSecurityChangeAuthorizationResponse {
  bytes authorization_id = 1;
  string start_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  CurrentAuthorityProfile current_profile = 4;
  // Opaque, process/attempt-bound routing hint, not authentication authority.
  string attempt_affinity = 5;
}
enum SecurityAuthorizationState {
  SECURITY_AUTHORIZATION_STATE_UNSPECIFIED = 0;
  SECURITY_AUTHORIZATION_STATE_PENDING = 1;
  SECURITY_AUTHORIZATION_STATE_APPROVED = 2;
  SECURITY_AUTHORIZATION_STATE_DENIED = 3;
}
message GetSecurityChangeAuthorizationRequest {
  bytes authorization_id = 1;
  CurrentAuthorityProfile current_profile = 2;
  string attempt_affinity = 3;
}
message GetSecurityChangeAuthorizationResponse {
  bytes authorization_id = 1;
  SecurityAuthorizationState state = 2;
  bytes authorization_proof = 3;
  google.protobuf.Timestamp expires_at = 4;
  CurrentAuthorityProfile current_profile = 5;
}
message ApplySecurityChangeResponse {
  SecurityVersion version = 1;
  bool applied = 2;
  bool replayed = 3;
  SecurityEnforcementState enforcement = 4;
  CurrentSecurityChangeResult current_result = 5;
}
message GetSecurityChangeStatusRequest {
  bytes change_id = 1;
  CurrentSecurityChangeID current_change_id = 2;
  CurrentAuthorityProfile current_profile = 3;
  bytes current_intent_digest = 4;
}

message GetSecurityChangeStatusResponse {
  // The original retained commit, not a snapshot of currently effective policy.
  SecurityVersion version = 1;
  // Echoes the exact requested immutable ID. Unknown or retired IDs are indeterminate.
  bytes change_id = 2;
  SecurityEnforcementState enforcement = 4;
  CurrentSecurityChangeResult current_result = 5;
}

// Public current authority protocol 2. These are identity/status data only;
// replay/current authority is always verified independently by the owner.
message CurrentAuthorityProfile {
  uint32 version = 1;
  bytes domain = 2;
  bytes cohort = 3;
  bytes generation = 4;
  bytes protocol = 5;
  bytes time_profile = 6;
  bytes membership = 7;
  bytes configuration = 8;
}
message CurrentSemanticCut {
  uint32 version = 1;
  bytes domain = 2;
  bytes cohort = 3;
  bytes generation = 4;
  uint64 sequence = 5;
  bytes previous = 6;
  bytes projection = 7;
  bytes frontier = 8;
  bytes fences = 9;
  bytes policy = 10;
}
message CurrentSecurityChangeID {
  uint32 version = 1;
  bytes domain = 2;
  bytes cohort = 3;
  uint64 namespace = 4;
  bytes nonce = 5;
}
message CurrentSecurityReview {
  CurrentAuthorityProfile profile = 1;
  CurrentSemanticCut expected_cut = 2;
  CurrentSecurityChangeID change_id = 3;
  SecurityIdentity actor = 4;
  bytes intent_digest = 5;
  repeated SecurityChange changes = 6;
}
message CurrentControlCommit {
  uint32 version = 1;
  bytes domain = 2;
  bytes cohort = 3;
  bytes membership = 4;
  bytes configuration = 5;
  uint64 slot = 6;
  bytes value = 7;
}
enum CurrentSecurityDisposition {
  CURRENT_SECURITY_DISPOSITION_UNSPECIFIED = 0;
  CURRENT_SECURITY_DISPOSITION_APPLIED = 1;
  CURRENT_SECURITY_DISPOSITION_REJECTED_CAS = 2;
  CURRENT_SECURITY_DISPOSITION_REJECTED_ADMIN = 3;
  CURRENT_SECURITY_DISPOSITION_REJECTED_AUTHORITY = 4;
  CURRENT_SECURITY_DISPOSITION_REJECTED_PURPOSE = 5;
  CURRENT_SECURITY_DISPOSITION_REJECTED_CAPACITY = 6;
  CURRENT_SECURITY_DISPOSITION_REJECTED_INVARIANT = 7;
}
message CurrentSecurityItemOutcome {
  uint32 index = 1;
  string kind = 2;
  CurrentSecurityDisposition disposition = 3;
}
message CurrentSecurityOriginalOutcome {
  CurrentSecurityChangeID change_id = 1;
  bytes intent_digest = 2;
  bytes handoff_digest = 3;
  CurrentControlCommit commit = 4;
  CurrentSecurityDisposition disposition = 5;
  repeated CurrentSecurityItemOutcome items = 6;
  CurrentSemanticCut observed_cut = 7;
  CurrentSemanticCut resulting_cut = 8;
}
enum CurrentSecurityProgress {
  CURRENT_SECURITY_PROGRESS_UNSPECIFIED = 0;
  // Local absence/timeout/retirement never proves safe nonexecution.
  CURRENT_SECURITY_PROGRESS_UNRESOLVED = 1;
  CURRENT_SECURITY_PROGRESS_ORIGIN_DURABLE = 2;
  CURRENT_SECURITY_PROGRESS_CHOSEN = 3;
  CURRENT_SECURITY_PROGRESS_APPLIED = 4;
}
enum CurrentAuthorizationStopObservation {
  CURRENT_AUTHORIZATION_STOP_OBSERVATION_UNSPECIFIED = 0;
  CURRENT_AUTHORIZATION_STOP_OBSERVATION_NOT_OBSERVED = 1;
  CURRENT_AUTHORIZATION_STOP_OBSERVATION_WAITING = 2;
  // New authorizations using old cuts have stopped under this profile. This
  // does not assert physical delivery or termination of an already authorized A.
  CURRENT_AUTHORIZATION_STOP_OBSERVATION_OLD_CUT_NEW_AUTHORIZATIONS_STOPPED = 3;
}
message CurrentSecurityChangeResult {
  CurrentAuthorityProfile profile = 1;
  CurrentSecurityChangeID change_id = 2;
  bytes intent_digest = 3;
  CurrentSecurityProgress progress = 4;
  CurrentSecurityOriginalOutcome original = 5;
  CurrentAuthorizationStopObservation stop_observation = 6;
}
message CurrentSecurityAuditRecord {
  CurrentSecurityChangeResult result = 1;
  bytes actor_digest = 2;
  string operation = 3;
}

// This invocation was refused before H, without settling any earlier
// ambiguous invocation. Preserve the original identity for status-first use.
message CurrentSecurityInvocationRejected {
  CurrentAuthorityProfile profile = 1;
  CurrentSecurityChangeID change_id = 2;
  bytes intent_digest = 3;
  bool purpose_required = 4;
}

// Connected-member local-admission guidance. Counters are sampled separately;
// footprints include retained Put barriers. This neither freezes usage nor
// predicts admission or cluster-wide capacity. Existing data is not evicted.
message OperationalCapacityPreview {
  uint32 member = 1;
  // Owner snapshot generation, not a native applied-cut certificate.
  uint64 effective_generation = 2;
  uint64 vertex_footprint = 3;
  uint64 edge_footprint = 4;
  uint64 vertex_causal_entries = 5;
  uint64 edge_causal_entries = 6;
  bool vertices_over_limit = 7;
  bool edges_over_limit = 8;
  bool vertex_causal_over_limit = 9;
  bool edge_causal_over_limit = 10;
}
