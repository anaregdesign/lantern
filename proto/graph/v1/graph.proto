syntax = "proto3";

package graph.v1;

import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message Vertex {
  string key = 1;
  google.protobuf.Timestamp expiration = 2;
  oneof value {
    double float64 = 10;
    float float32 = 11;
    int32 int32 = 12;
    int64 int64 = 13;
    uint32 uint32 = 14;
    uint64 uint64 = 15;
    bool bool = 16;
    string string = 17;
    bytes bytes = 18;
    google.protobuf.Timestamp timestamp = 19;
    google.protobuf.Duration duration = 20;

    // nil signals that the vertex carries no value (an "existence-only"
    // marker). The bool itself is always true when present; the variant
    // exists so the oneof can distinguish "explicitly nil" from "unset".
    bool nil = 30;
  }
}

message Edge {
  string tail = 1;
  string head = 2;
  float weight = 3;
  google.protobuf.Timestamp expiration = 4;
}

message Graph {
  repeated Vertex vertices = 1;
  repeated Edge edges = 2;
}

enum Optimization {
  OPTIMIZATION_UNSPECIFIED = 0;
  OPTIMIZATION_MINIMUM_SPANNING_TREE = 1;
  OPTIMIZATION_MAXIMUM_SPANNING_TREE = 2;
  OPTIMIZATION_SHORTEST_PATH_TREE = 3;
  OPTIMIZATION_SHORTEST_PATH_TREE_INVERSE = 4;
}

message IlluminateRequest {
  string seed = 1;
  uint32 step = 2;
  uint32 k = 3;
  bool tfidf = 4;
  Optimization optimization = 5;
}

message IlluminateResponse {
  Graph graph = 1;
}

message GetVertexRequest {
  string key = 1;
}

message GetVertexResponse {
  Vertex vertex = 1;
}

// GetVerticesRequest reads several vertices in one round trip. Subject to
// the same MaxBatchSize / MaxKeyLen guard rails as the write RPCs.
message GetVerticesRequest {
  repeated string keys = 1;
}

message GetVerticesResponse {
  // vertices contains every key that was present at the time of the call.
  // Order is unspecified; clients should match by Vertex.key.
  repeated Vertex vertices = 1;
  // missing lists the requested keys that did not exist (or had expired).
  repeated string missing = 2;
}

// PutVertexRequest writes a single vertex with upsert semantics. The
// Vertex.key field selects the target row and Vertex.expiration controls
// the TTL (absolute time). This is the singular convenience wrapper over
// PutVertices and shares its guard rails.
message PutVertexRequest {
  Vertex vertex = 1;
}

message PutVertexResponse {}

// PutVerticesRequest writes vertices with upsert semantics: each Vertex.key
// replaces any existing value at that key. Use the Vertex.expiration field
// (absolute time) to control TTL.
message PutVerticesRequest {
  repeated Vertex vertices = 1;
}

message PutVerticesResponse {
  // Number of vertices accepted by the server. Currently always equals the
  // request size on success; reserved for future per-item validation that may
  // report partial writes.
  int32 written = 1;
}

// DeleteVertexRequest removes the vertex at `key`. Edges incident to the
// removed vertex are NOT eagerly cascaded: the periodic GC loop reaps
// orphaned (tail, head) rows on its next tick, and reads against missing
// endpoints return NotFound in the meantime.
message DeleteVertexRequest {
  string key = 1;
}

message DeleteVertexResponse {
  // existed is true if the vertex was present and removed by this call.
  bool existed = 1;
}

// DeleteVerticesRequest removes several vertices in one round trip. Same
// cascade semantics as DeleteVertex (edges reaped lazily by the GC loop).
// Subject to the same MaxBatchSize / MaxKeyLen guard rails as the put RPCs.
message DeleteVerticesRequest {
  repeated string keys = 1;
}

message DeleteVerticesResponse {
  // Number of keys the server attempted to delete (equals len(keys) on success).
  int32 deleted = 1;
}

// ScanVerticesRequest streams vertices whose key starts with `prefix` in
// lexicographic order. `limit` caps the number returned in one call; the
// server enforces a default when `limit == 0` and a hard maximum (see
// RateLimitConfig / ScanConfig on the server). `cursor` MUST be treated as
// opaque bytes by clients — pass back exactly what the previous response
// returned in `next_cursor`. An empty `cursor` starts from the beginning.
message ScanVerticesRequest {
  string prefix = 1;
  uint32 limit = 2;
  bytes cursor = 3;
}

message ScanVerticesResponse {
  // vertices returned in ascending key order. May be shorter than `limit`
  // when the underlying range is exhausted.
  repeated Vertex vertices = 1;
  // next_cursor is non-empty when more results are available. An empty
  // value signals end of stream.
  bytes next_cursor = 2;
}

// CountVerticesByPrefixRequest returns the number of live vertex keys with
// the given prefix. Cheap (radix-only) and not subject to `limit`.
message CountVerticesByPrefixRequest {
  string prefix = 1;
}

message CountVerticesByPrefixResponse {
  uint64 count = 1;
}

// DeleteVerticesByPrefixRequest deletes up to `limit` vertices whose key
// starts with `prefix`. `limit == 0` lets the server apply its configured
// default (see RateLimitConfig / ScanConfig). When `dry_run` is true, no
// deletion is performed and the response reports the number that *would*
// be deleted.
message DeleteVerticesByPrefixRequest {
  string prefix = 1;
  uint32 limit = 2;
  bool dry_run = 3;
}

message DeleteVerticesByPrefixResponse {
  uint64 deleted = 1;
}

message GetEdgeRequest {
  string tail = 1;
  string head = 2;
}

message GetEdgeResponse {
  Edge edge = 1;
}

// GetEdgesRequest reads several edges in one round trip. Subject to the
// same MaxBatchSize / MaxKeyLen guard rails as the write RPCs.
message GetEdgesRequest {
  repeated EdgeKey edges = 1;
}

message GetEdgesResponse {
  // edges contains every (tail, head) pair that was present at the time of
  // the call. Order is unspecified; clients should match by (Edge.tail,
  // Edge.head).
  repeated Edge edges = 1;
  // missing lists the requested (tail, head) pairs that did not exist (or
  // had expired).
  repeated EdgeKey missing = 2;
}

message DeleteEdgeRequest {
  string tail = 1;
  string head = 2;
}

message DeleteEdgeResponse {
  // existed is true if the edge was present and removed by this call.
  bool existed = 1;
}

// EdgeKey identifies an edge by its (tail, head) pair without weight.
message EdgeKey {
  string tail = 1;
  string head = 2;
}

// ScanEdgesRequest streams edges whose tail key starts with `tail_prefix`
// AND whose head key starts with `head_prefix`, in ascending (tail, head)
// order. Either prefix may be empty to disable the corresponding filter
// (both empty scans every edge). `limit` caps the number returned in one
// call; the server enforces a default when `limit == 0` and a hard maximum
// (see ScanConfig on the server). `cursor` MUST be treated as opaque bytes
// by clients — pass back exactly what the previous response returned in
// `next_cursor`. An empty `cursor` starts from the beginning.
//
// Implementation note: v1 walks the tail-side prefix index and applies
// `head_prefix` as a post-filter; for highly selective `head_prefix`
// queries the server may visit many tails to fill one page. Latency is
// reported in the standard scan histogram so operators can spot
// pathological filters.
message ScanEdgesRequest {
  string tail_prefix = 1;
  string head_prefix = 2;
  uint32 limit = 3;
  bytes cursor = 4;
}

message ScanEdgesResponse {
  // edges returned in ascending (tail, head) order. May be shorter than
  // `limit` when the underlying range is exhausted.
  repeated Edge edges = 1;
  // next_cursor is non-empty when more results are available. An empty
  // value signals end of stream.
  bytes next_cursor = 2;
}

// DeleteEdgesRequest removes several edges in one round trip. Subject to the
// MaxBatchSize / MaxKeyLen guard rails.
message DeleteEdgesRequest {
  repeated EdgeKey edges = 1;
}

message DeleteEdgesResponse {
  // Number of edges the server attempted to delete (equals len(edges) on success).
  int32 deleted = 1;
}

// AddEdgeRequest accumulates weight onto a single (tail, head) pair: repeated
// calls with the same endpoints sum their weights. This is the singular
// convenience wrapper over AddEdges and shares its non-idempotent semantics.
message AddEdgeRequest {
  Edge edge = 1;
}

message AddEdgeResponse {}

// AddEdgesRequest accumulates weight onto each (tail, head) pair: repeated
// calls with the same endpoints sum their weights. This operation is
// non-idempotent.
message AddEdgesRequest {
  repeated Edge edges = 1;
}

message AddEdgesResponse {
  // Number of edges whose weight contributions were accepted.
  int32 written = 1;
}

// PutEdgeRequest overwrites a single (tail, head) pair, replacing any
// existing weight and expiration. This is the singular convenience wrapper
// over PutEdges and shares its idempotent semantics.
message PutEdgeRequest {
  Edge edge = 1;
}

message PutEdgeResponse {}

// PutEdgesRequest overwrites each (tail, head) pair, replacing any existing
// weight and expiration. This operation is idempotent.
message PutEdgesRequest {
  repeated Edge edges = 1;
}

message PutEdgesResponse {
  // Number of edges accepted (overwritten or created).
  int32 written = 1;
}

service LanternService {
  rpc Illuminate(IlluminateRequest) returns (IlluminateResponse) {
    option (google.api.http) = {get: "/v1/illuminate/{seed}"};
  }

  rpc GetVertex(GetVertexRequest) returns (GetVertexResponse) {
    option (google.api.http) = {get: "/v1/vertices/{key}"};
  }

  // GetVertices reads several vertices in one round trip.
  rpc GetVertices(GetVerticesRequest) returns (GetVerticesResponse) {
    option (google.api.http) = {
      post: "/v1/vertices/get"
      body: "*"
    };
  }

  // PutVertex writes a single vertex. Thin facade over PutVertices.
  rpc PutVertex(PutVertexRequest) returns (PutVertexResponse) {
    option (google.api.http) = {
      put: "/v1/vertices/{vertex.key}"
      body: "*"
    };
  }

  rpc PutVertices(PutVerticesRequest) returns (PutVerticesResponse) {
    option (google.api.http) = {
      put: "/v1/vertices"
      body: "*"
    };
  }

  rpc DeleteVertex(DeleteVertexRequest) returns (DeleteVertexResponse) {
    option (google.api.http) = {delete: "/v1/vertices/{key}"};
  }

  // DeleteVertices removes several vertices in one round trip.
  rpc DeleteVertices(DeleteVerticesRequest) returns (DeleteVerticesResponse) {
    option (google.api.http) = {
      post: "/v1/vertices/delete"
      body: "*"
    };
  }

  // ScanVertices streams vertices whose key starts with the given prefix in
  // ascending order, page by page. Plural-only — prefix scan is inherently
  // plural.
  rpc ScanVertices(ScanVerticesRequest) returns (ScanVerticesResponse) {
    option (google.api.http) = {
      post: "/v1/vertices/scan"
      body: "*"
    };
  }

  // CountVerticesByPrefix returns the number of live vertices whose key
  // starts with the given prefix.
  rpc CountVerticesByPrefix(CountVerticesByPrefixRequest) returns (CountVerticesByPrefixResponse) {
    option (google.api.http) = {get: "/v1/vertices/count/{prefix}"};
  }

  // DeleteVerticesByPrefix deletes up to `limit` vertices whose key starts
  // with the given prefix. Pass `dry_run = true` to preview the count
  // without mutating state.
  rpc DeleteVerticesByPrefix(DeleteVerticesByPrefixRequest) returns (DeleteVerticesByPrefixResponse) {
    option (google.api.http) = {
      post: "/v1/vertices/delete-by-prefix"
      body: "*"
    };
  }

  rpc GetEdge(GetEdgeRequest) returns (GetEdgeResponse) {
    option (google.api.http) = {get: "/v1/edges/{tail}/{head}"};
  }

  // GetEdges reads several edges in one round trip.
  rpc GetEdges(GetEdgesRequest) returns (GetEdgesResponse) {
    option (google.api.http) = {
      post: "/v1/edges/get"
      body: "*"
    };
  }

  // AddEdge is non-idempotent (accumulates weight). Thin facade over AddEdges.
  rpc AddEdge(AddEdgeRequest) returns (AddEdgeResponse) {
    option (google.api.http) = {
      post: "/v1/edges/{edge.tail}/{edge.head}/add"
      body: "*"
    };
  }

  // AddEdges is non-idempotent (accumulates weight). POST per REST conventions.
  rpc AddEdges(AddEdgesRequest) returns (AddEdgesResponse) {
    option (google.api.http) = {
      post: "/v1/edges/add"
      body: "*"
    };
  }

  // PutEdge is idempotent (replaces weight). Thin facade over PutEdges.
  rpc PutEdge(PutEdgeRequest) returns (PutEdgeResponse) {
    option (google.api.http) = {
      put: "/v1/edges/{edge.tail}/{edge.head}"
      body: "*"
    };
  }

  // PutEdges is idempotent (replaces weight). PUT per REST conventions.
  rpc PutEdges(PutEdgesRequest) returns (PutEdgesResponse) {
    option (google.api.http) = {
      put: "/v1/edges/put"
      body: "*"
    };
  }

  rpc DeleteEdge(DeleteEdgeRequest) returns (DeleteEdgeResponse) {
    option (google.api.http) = {delete: "/v1/edges/{tail}/{head}"};
  }

  // DeleteEdges removes several edges in one round trip.
  rpc DeleteEdges(DeleteEdgesRequest) returns (DeleteEdgesResponse) {
    option (google.api.http) = {
      post: "/v1/edges/delete"
      body: "*"
    };
  }

  // ScanEdges streams edges whose tail key starts with `tail_prefix` AND
  // whose head key starts with `head_prefix`, in ascending (tail, head)
  // order, page by page. Plural-only — prefix scan is inherently plural.
  rpc ScanEdges(ScanEdgesRequest) returns (ScanEdgesResponse) {
    option (google.api.http) = {
      post: "/v1/edges/scan"
      body: "*"
    };
  }
}
