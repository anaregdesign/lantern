syntax = "proto3";

package graph.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message Vertex {
  string key = 1;
  // Absolute expiration. An absent timestamp means permanent storage.
  google.protobuf.Timestamp expiration = 2;
  oneof value {
    double float64 = 10;
    float float32 = 11;
    int32 int32 = 12;
    int64 int64 = 13;
    uint32 uint32 = 14;
    uint64 uint64 = 15;
    bool bool = 16;
    string string = 17;
    bytes bytes = 18;
    google.protobuf.Timestamp timestamp = 19;
    google.protobuf.Duration duration = 20;

    // nil signals that the vertex carries no value (an "existence-only"
    // marker). The bool itself is always true when present; the variant
    // exists so the oneof can distinguish "explicitly nil" from "unset".
    bool nil = 30;
  }
}

message Edge {
  string tail = 1;
  string head = 2;
  float weight = 3;
  // Absolute expiration. An absent timestamp means permanent storage.
  google.protobuf.Timestamp expiration = 4;
}

message Graph {
  repeated Vertex vertices = 1;
  repeated Edge edges = 2;
}

// Reduction is the optional post-traversal tree view applied to a
// BFS-discovered neighbourhood (#846). UNSPECIFIED returns the raw
// discovered subgraph; MINIMUM_SPANNING_TREE / SHORTEST_PATH_TREE reduce it
// to a tree rooted at the seed. MINIMUM_SPANNING_TREE means a directed
// minimum/maximum rooted arborescence over Lantern's directed edges (not an
// undirected Prim projection); the MIN/MAX direction is carried by Objective.
// Reductions are a BfsParams knob — not sibling traversals — which is why the
// former Algorithm enum (which conflated the two; see #410/#801 history) left
// the request in the oneof redesign.
enum Reduction {
  REDUCTION_UNSPECIFIED = 0;
  REDUCTION_MINIMUM_SPANNING_TREE = 1;
  REDUCTION_SHORTEST_PATH_TREE = 2;
}

// Objective is the direction of the weight-sensitive optimisation. It
// governs BOTH the per-hop top-k pruning during the BFS walk AND the
// post-traversal Algorithm reduction (#560), so a cost-minimiser is never
// handed a candidate set already pruned to the costliest edges.
//
// UNSPECIFIED defaults to MAXIMIZE server-side. MINIMIZE treats edge
// weights as costs (keeps the k smallest-weight edges per hop; smallest
// tree wins); MAXIMIZE treats them as relevance (keeps the k largest-weight
// edges per hop; largest tree wins, equivalent to the historical
// "inverse-SPT" / "max-MST" variants and the default strongest-neighbour
// behaviour of an Objective-unspecified BFS request).
enum Objective {
  OBJECTIVE_UNSPECIFIED = 0;
  OBJECTIVE_MINIMIZE = 1;
  OBJECTIVE_MAXIMIZE = 2;
}

// Weighting is the edge-weight transform applied BEFORE the BFS walk
// (and therefore before any Algorithm-driven reduction).
//
// UNSPECIFIED defaults to RAW server-side. RAW uses the stored
// edge.weight verbatim. TFIDF re-scores edge weights using the crude
// hub-suppressor w / log2(1 + df(head)); cheap but corpus-size-blind.
// BM25 re-scores with Okapi BM25 over the per-vertex out-edge
// distribution (TF = edge weight, DF = distinct tails into head,
// N = #tails, DocLen = tail out-degree), adding TF saturation,
// document-length normalization, and a real N-aware IDF — a principled
// successor to TFIDF that is consistent with full-text SearchVertices.
enum Weighting {
  WEIGHTING_UNSPECIFIED = 0;
  WEIGHTING_RAW = 1;
  WEIGHTING_TFIDF = 2;
  WEIGHTING_BM25 = 3;
}

message IlluminateRequest {
  string seed = 1;
  // weighting and vertex_prefix are the axes genuinely shared by every
  // traversal family, so they stay top-level.
  Weighting weighting = 8;
  // vertex_prefix, when non-empty, restricts the traversal frontier to the
  // vertices whose key has this prefix. The seed is always retained as the
  // anchor even if it does not match. Empty = no filter. Applied BEFORE
  // per-hop top-k and BEFORE any reduction (induced-subgraph semantics:
  // non-matching vertices are not traversable bridges).
  string vertex_prefix = 9;
  // params selects the traversal family AND carries only the knobs that
  // family understands (#846) — cross-algorithm misconfiguration (PPR with
  // step, MST with epsilon, …) is structurally unrepresentable. A family arm
  // is REQUIRED; unset params is rejected with INVALID_ARGUMENT rather than
  // silently becoming an ambiguous zero-hop BFS request.
  oneof params {
    BfsParams bfs = 12;
    PprParams ppr = 13;
    LocalCommunityParams community = 14;
  }
  // Field numbers 4/5 ("tfidf", "optimization") were retired by the
  // orthogonal-axes redesign (#410); 2/3/6/7/10/11 ("step", "k",
  // "algorithm", "objective", "restart_prob", "epsilon") by the per-family
  // params redesign (#846). All stay reserved so a stale client whose
  // binary still emits the old flat field numbers cannot silently alias
  // newer fields — such a request decodes as params-unset and is rejected.
  reserved 2, 3, 4, 5, 6, 7, 10, 11;
  reserved "step", "k", "tfidf", "optimization", "algorithm", "objective", "restart_prob", "epsilon";
}

// BfsParams tunes the greedy per-hop top-k BFS walk and its optional
// post-traversal tree reduction.
message BfsParams {
  // step is the BFS depth and MUST be positive. 0 is INVALID_ARGUMENT.
  uint32 step = 1;
  // fan_out is the per-hop top-k prune: at each hop only the fan_out
  // strongest (or cheapest, under OBJECTIVE_MINIMIZE) edges survive.
  // It MUST be positive. 0 is INVALID_ARGUMENT. (Formerly the overloaded "k".)
  uint32 fan_out = 2;
  // objective governs BOTH the per-hop pruning and the reduction direction
  // (#560), so a cost-minimiser is never handed a candidate set already
  // pruned to the costliest edges. UNSPECIFIED = MAXIMIZE.
  Objective objective = 3;
  // reduction optionally reduces the discovered neighbourhood to a tree
  // rooted at the seed. UNSPECIFIED = no reduction (raw subgraph).
  Reduction reduction = 4;
}

// LocalCommunityParams extracts the conductance-optimal local community
// around the seed (#845): PageRank-Nibble — the same ACL forward-push the
// PPR family runs, followed by a sweep cut that orders touched vertices by
// p(v)/deg(v) and takes the prefix minimising directed weighted
// conductance. Unlike the PPR relevance star, the response preserves
// structure: it is the INDUCED SUBGRAPH on the selected members — the real
// live edges among them with their expirations and weighting-transformed
// weights (weighting RAW/UNSPECIFIED = the verbatim stored weight), in the
// same response shape as the BFS family. Because the returned weights carry
// the weighting transform, a reduction over the community honours weighting
// too.
message LocalCommunityParams {
  // max_size is an UPPER BOUND on community size — NOT an exact count. The
  // sweep stops at the conductance minimum, which may come before max_size.
  // 0 = unbounded (the sweep alone decides). (The PPR family's top_n by
  // contrast always returns exactly N regardless of the natural boundary.)
  uint32 max_size = 1;
  // restart_prob (α) — locality knob, same semantics and defaults as
  // PprParams.restart_prob: higher α → tighter, more seed-proximate
  // community. Honoured only in (0,1); unset falls back to 0.15.
  float restart_prob = 2;
  // epsilon (ε) — push accuracy / work budget, same semantics and defaults
  // as PprParams.epsilon: smaller ε → more accurate mass and a larger
  // touched set. Honoured only when > 0; unset falls back to 1e-4.
  float epsilon = 3;
  // reduction optionally reduces the community to a tree VIEW rooted at the
  // seed (for visualization, explanation paths, token-bounded consumption).
  // The induced subgraph stays the source of truth — density is exactly
  // what the sweep selected for. Sweep prefixes need not be connected, so
  // the tree spans only the seed's reachable component within the
  // community; unreachable members are still returned as ISOLATED vertices
  // (membership preserved, no edges fabricated). UNSPECIFIED = the full
  // induced subgraph (the default).
  Reduction reduction = 4;
  // objective sets the direction/cost mapping for the reduction ONLY
  // (membership is decided by PPR mass, not by this): MINIMIZE → identity
  // cost, MAXIMIZE/UNSPECIFIED → inverse cost, exactly as the BFS family.
  // Ignored when reduction is UNSPECIFIED.
  Objective objective = 5;
}

// PprParams runs seed-anchored Personalized PageRank (Random-Walk-with-
// Restart) by local forward-push (Andersen–Chung–Lang) instead of the BFS
// walk (#801). The result is a relevance star rooted at the seed — the
// seed→v edge weight is π[v], the PPR mass v accumulates for this seed.
// PPR is intrinsically a relevance maximiser and has no per-hop step
// semantics, which is why neither knob exists here.
message PprParams {
  // top_n caps the star to the top-N vertices by mass. 0 = every
  // positive-mass vertex. (Formerly the overloaded "k".)
  uint32 top_n = 1;
  // restart_prob (α) is the teleport-to-seed probability — the locality
  // knob: higher α (≈0.5) yields a tighter, seed-proximate set, lower α
  // (≈0.15) a broader one. Honoured only in (0,1); unset/out-of-range
  // falls back to the server default 0.15.
  float restart_prob = 2;
  // epsilon (ε) is the forward-push residual threshold: smaller ε is more
  // accurate but touches more vertices (work is O(1/(α·ε)), independent of
  // graph size). Honoured only when > 0; unset falls back to the server
  // default 1e-4.
  float epsilon = 3;
}

message IlluminateResponse {
  Graph graph = 1;
}

message GetVertexRequest {
  string key = 1;
}

message GetVertexResponse {
  Vertex vertex = 1;
}

// GetVerticesRequest reads several vertices in one round trip. Subject to
// the same MaxBatchSize / MaxKeyLen guard rails as the write RPCs.
message GetVerticesRequest {
  repeated string keys = 1;
}

message GetVerticesResponse {
  // vertices contains every key that was present at the time of the call.
  // Order is unspecified; clients should match by Vertex.key.
  repeated Vertex vertices = 1;
  // missing lists the requested keys that did not exist (or had expired).
  repeated string missing = 2;
}

// PutVertexRequest writes a single vertex with upsert semantics. The
// Vertex.key field selects the target row and Vertex.expiration controls
// the TTL (absolute time). This is the singular convenience wrapper over
// PutVertices and shares its guard rails.
message PutVertexRequest {
  Vertex vertex = 1;
  // When true, the write applies only if no live vertex exists at the key.
  // An existing live vertex leaves value and expiration untouched (SET NX).
  bool if_absent = 2;
}

// PutOutcome is the server-authoritative application result for one Put item.
// Clients must not infer application from their local clock: local expiration
// checks may only turn APPLIED_AND_LIVE into a fail-closed expired result.
enum PutOutcome {
  PUT_OUTCOME_UNSPECIFIED = 0;
  // The server accepted the write and the item was live at application time.
  PUT_OUTCOME_APPLIED_AND_LIVE = 1;
  // The supplied absolute expiration was not live at application time. It was
  // accepted as a delete-like overwrite, so no live item remains at that identity.
  PUT_OUTCOME_EXPIRED = 2;
  // The write did not apply because if_absent observed an existing live item
  // (including an earlier live write for the same key in the batch). Existing
  // state stays.
  PUT_OUTCOME_CONDITION_NOT_MET = 3;
  // A newer causal write or tombstone superseded this local write. Existing
  // state stays. This is distinct from a caller-requested condition failure.
  PUT_OUTCOME_SUPERSEDED = 4;
}

message PutVertexResponse {
  // Server-authoritative result for vertex in the request.
  PutOutcome outcome = 1;
}

// PutVerticesRequest writes vertices with upsert semantics: each Vertex.key
// replaces any existing value at that key. Use the Vertex.expiration field
// (absolute time) to control TTL.
message PutVerticesRequest {
  repeated Vertex vertices = 1;
  // When true, each write applies only if no live vertex exists at its key;
  // keys with a live vertex are left untouched and reported as
  // PUT_OUTCOME_CONDITION_NOT_MET at the matching response index.
  bool if_absent = 2;
}

message PutVerticesResponse {
  // Index-aligned with request.vertices and always the same length. This makes
  // mixed live/expired/conditional batches unambiguous even with duplicate
  // keys. An empty request returns an empty list.
  repeated PutOutcome outcomes = 1;
}

// DeleteVertexRequest removes the vertex at `key`. Edges incident to the
// removed vertex are NOT eagerly cascaded: the periodic GC loop reaps
// orphaned (tail, head) rows on its next tick, and reads against missing
// endpoints return NotFound in the meantime.
message DeleteVertexRequest {
  string key = 1;
}

message DeleteVertexResponse {
  // existed is true if the vertex was present and removed by this call.
  bool existed = 1;
}

// DeleteVerticesRequest removes several vertices in one round trip. Same
// cascade semantics as DeleteVertex (edges reaped lazily by the GC loop).
// Subject to the same MaxBatchSize / MaxKeyLen guard rails as the put RPCs.
message DeleteVerticesRequest {
  repeated string keys = 1;
}

message DeleteVerticesResponse {
  // Number of keys the server attempted to delete (equals len(keys) on success).
  int32 deleted = 1;
}

// ScanOrder selects the key order a ScanVertices / ScanVertexKeys page walks
// (#898). SCAN_ORDER_UNSPECIFIED preserves the historical behavior (ascending)
// so an unset field is a no-op. DESC walks the same prefix range from the high
// end, so "give me the newest N" on a timestamp-ordered keyspace is a single
// bounded page instead of a full-prefix scan-then-sort.
enum ScanOrder {
  SCAN_ORDER_UNSPECIFIED = 0; // = ASC (historical default)
  SCAN_ORDER_ASC = 1;
  SCAN_ORDER_DESC = 2;
}

// ScanVerticesRequest streams vertices whose key starts with `prefix` in
// lexicographic order. `limit` caps the number returned in one call; the
// server enforces a default when `limit == 0` and a hard maximum (see
// RateLimitConfig / ScanConfig on the server). `cursor` MUST be treated as
// opaque bytes by clients — pass back exactly what the previous response
// returned in `next_cursor`. An empty `cursor` starts from the beginning.
message ScanVerticesRequest {
  string prefix = 1;
  uint32 limit = 2;
  // NOTE: opaque to the caller; not interchangeable with cursors from
  // other Scan* RPCs (e.g. ScanEdges). Cross-feeding is rejected with
  // INVALID_ARGUMENT rather than silently restarting the scan.
  bytes cursor = 3;
  // order selects ascending (default) or descending key order. The cursor
  // is order-bound: a next_cursor minted by an ascending page is rejected
  // with INVALID_ARGUMENT if fed back into a descending scan (and vice
  // versa), matching the cross-RPC cursor-rejection precedent.
  ScanOrder order = 4;
}

message ScanVerticesResponse {
  // vertices returned in the requested key order (ascending by default,
  // descending when order = SCAN_ORDER_DESC). May be shorter than `limit`
  // when the underlying range is exhausted.
  repeated Vertex vertices = 1;
  // next_cursor is non-empty when more results are available. An empty
  // value signals end of stream.
  bytes next_cursor = 2;
}

// ScanVertexKeysRequest streams vertex KEYS (no values) whose key starts
// with `prefix`, in lexicographic order — the wire-efficient backbone of
// the Redis-familiar `keys` CLI verb. It reuses ScanVertices' limit clamp
// but carries its OWN opaque cursor kind, NOT interchangeable with any other
// Scan* cursor (cross-feeding is rejected with INVALID_ARGUMENT). Unlike
// ScanVertices, a non-empty `prefix` is REQUIRED: an empty prefix is
// rejected with INVALID_ARGUMENT, so there is no whole-keyspace dump.
// Plural-only.
message ScanVertexKeysRequest {
  // prefix is REQUIRED and must be non-empty; an empty prefix is rejected
  // with INVALID_ARGUMENT.
  string prefix = 1;
  // limit caps the number of keys returned in one call. Zero falls back to
  // the server's ScanDefaultLimit and the value is clamped to ScanMaxLimit
  // — the same knobs as ScanVertices.
  uint32 limit = 2;
  // NOTE: opaque to the caller; its own cursor kind, NOT interchangeable
  // with cursors from other Scan* RPCs (ScanVertices / ScanEdges).
  // Cross-feeding is rejected with INVALID_ARGUMENT. An empty cursor starts
  // from the beginning.
  bytes cursor = 3;
  // order selects ascending (default) or descending key order, with the
  // same order-bound cursor rule as ScanVertices.
  ScanOrder order = 4;
}

message ScanVertexKeysResponse {
  // keys returned in the requested order (ascending by default, descending
  // when order = SCAN_ORDER_DESC). May be shorter than `limit` when the
  // underlying range is exhausted.
  repeated string keys = 1;
  // next_cursor is non-empty when more results are available. An empty
  // value signals end of stream.
  bytes next_cursor = 2;
}

// MatchMode selects how a multi-word query's terms combine when choosing which
// vertices match (#890). It governs membership only; BM25 still ranks whatever
// matches. Coverage counts word-channel terms, so requiring "all" of a CJK run
// means all of its bigrams.
enum MatchMode {
  // MATCH_MODE_UNSPECIFIED always defers to LANTERN_SEARCH_DEFAULT_MODE,
  // including when other SearchOptions fields are present.
  MATCH_MODE_UNSPECIFIED = 0;
  // MATCH_MODE_ANY keeps every vertex sharing at least one query term (OR).
  MATCH_MODE_ANY = 1;
  // MATCH_MODE_ALL keeps only vertices carrying every query word term (AND).
  MATCH_MODE_ALL = 2;
  // MATCH_MODE_MIN_SHOULD keeps vertices carrying at least min_should_match
  // distinct query word terms.
  MATCH_MODE_MIN_SHOULD = 3;
}

// SearchOptions carries the optional relevance controls for SearchVertices
// (#892): match mode, phrase adjacency, and prefix/fuzzy term expansion. An
// omitted message and an all-zero message both defer match membership to the
// server default. The server rejects unknown enums, out-of-domain numeric
// values, and combinations whose fields would otherwise be ignored (#1055).
message SearchOptions {
  // match_mode selects AND / OR / minimum-should-match membership (#890), or
  // defers to the server default when unspecified.
  MatchMode match_mode = 1;
  // min_should_match is the minimum number of distinct query word terms a
  // vertex must carry. A non-zero value is valid only with an explicit
  // MATCH_MODE_MIN_SHOULD. Zero with that mode uses the server's configured
  // LANTERN_SEARCH_DEFAULT_MIN_SHOULD value.
  uint32 min_should_match = 2;
  // phrase requires the query's word terms to occur adjacently, in order
  // (#889). Until phrase composition is implemented, phrase=true requires
  // match_mode unspecified, min_should_match=0, fuzziness=0, and
  // prefix_terms=false; conflicting combinations return INVALID_ARGUMENT.
  bool phrase = 3;
  // fuzziness is the maximum edit distance (0, 1, or 2) at which a query word
  // also matches dictionary terms, so a typo still finds the term (#891). 0
  // disables fuzzy matching.
  uint32 fuzziness = 4;
  // prefix_terms also matches dictionary terms that extend a query word, so
  // "lan" finds "lantern" (#891).
  bool prefix_terms = 5;
}

// SearchProjection selects how much stored vertex data each ranked hit
// carries. The zero value deliberately preserves the historical lightweight
// key+score response.
enum SearchProjection {
  SEARCH_PROJECTION_UNSPECIFIED = 0;
  SEARCH_PROJECTION_KEY_SCORE = 1;
  SEARCH_PROJECTION_FULL_VERTEX = 2;
}

// SearchHitProjectionStatus makes FULL_VERTEX selection races explicit. The
// server normally returns SNAPSHOT because ranking and hydration share one
// search commit barrier. MISSING/REPLACED are reserved fail-closed states for
// a backend that cannot prove that invariant; such a hit never carries an
// unrelated vertex value.
enum SearchHitProjectionStatus {
  SEARCH_HIT_PROJECTION_STATUS_UNSPECIFIED = 0;
  SEARCH_HIT_PROJECTION_STATUS_KEY_SCORE = 1;
  SEARCH_HIT_PROJECTION_STATUS_SNAPSHOT = 2;
  SEARCH_HIT_PROJECTION_STATUS_MISSING = 3;
  SEARCH_HIT_PROJECTION_STATUS_REPLACED = 4;
}

// SearchVerticesRequest runs a relevance-ranked full-text search over vertex
// *content* (key + value), as opposed to ScanVertices' lexicographic
// key-prefix walk. `query` is analysed with the same pipeline used to build
// the server-side index; an empty or unanalysable query yields zero hits
// (not an error). `limit` caps the number of ranked hits returned; the
// server enforces a default when `limit == 0` and a hard maximum (see
// SearchConfig). `prefix`, when non-empty, restricts hits to vertices whose
// key carries that prefix, composing content relevance with a namespace
// scope.
//
// This RPC requires the server-side search index to be enabled
// (LANTERN_SEARCH_ENABLED, on by default). When the index is disabled the
// server returns FAILED_PRECONDITION rather than silently returning no
// hits. Plural-only — ranked search is inherently plural.
message SearchVerticesRequest {
  string query = 1;
  uint32 limit = 2;
  string prefix = 3;
  // options carries the optional match-mode / phrase / fuzzy controls (#892);
  // unset means the default OR-union search.
  SearchOptions options = 4;
  // cursor is the opaque endpoint-sticky continuation returned by the prior
  // page. It is bound to every request option and projection; changing any of
  // them returns INVALID_ARGUMENT. Empty starts a new bounded snapshot.
  bytes cursor = 5;
  // projection defaults to KEY_SCORE when unspecified.
  SearchProjection projection = 6;
}

message SearchVerticesResponse {
  // hits use the stable total order (score DESC, raw key ASC). May be shorter
  // than `limit` when fewer vertices match; empty when nothing matches.
  repeated SearchHit hits = 1;
  // next_cursor is non-empty while another retained snapshot page exists.
  bytes next_cursor = 2;
  // effective_limit is the server-clamped page size used for this response.
  uint32 effective_limit = 3;
  // truncated is true when the page does not contain every matching snapshot
  // hit, even when the caller chooses not to continue.
  bool truncated = 4;
  // continuation_limited means the bounded session hit/byte cap observed more
  // matches than it could retain. The final retained page has no next_cursor
  // while this remains true; iterators surface a typed terminal error instead
  // of pretending the bounded prefix was exhaustive.
  bool continuation_limited = 5;
}

// SearchHit pairs a matching vertex key with the relevance score the index
// assigned it (BM25; higher is more relevant). Equal scores are ordered by the
// raw, unnormalised key in ascending lexical order. KEY_SCORE omits the value
// and TTL; FULL_VERTEX carries an immutable selected snapshot.
message SearchHit {
  string key = 1;
  double score = 2;
  // vertex is populated only for FULL_VERTEX SNAPSHOT hits. It is the exact
  // immutable value/TTL selected under the same barrier as the score.
  Vertex vertex = 3;
  SearchHitProjectionStatus projection_status = 4;
}

// CountVerticesByPrefixRequest returns the number of live vertex keys with
// the given prefix. Cheap (radix-only) and not subject to `limit`.
message CountVerticesByPrefixRequest {
  string prefix = 1;
}

message CountVerticesByPrefixResponse {
  uint64 count = 1;
}

// DeleteVerticesByPrefixRequest deletes up to `limit` vertices whose key
// starts with `prefix`. `limit == 0` lets the server apply its configured
// default (see RateLimitConfig / ScanConfig). When `dry_run` is true, no
// deletion is performed and the response reports the number that *would*
// be deleted.
message DeleteVerticesByPrefixRequest {
  string prefix = 1;
  uint32 limit = 2;
  bool dry_run = 3;
}

message DeleteVerticesByPrefixResponse {
  uint64 deleted = 1;
}

// TopVerticesByDegreeRequest ranks the most-connected vertices under a key
// prefix by their (weighted) degree — the seed-selection question a cold-start
// visualization or recommendation front end hits when it has no better anchor
// (#900). It exposes the degree index the store already maintains for BM25
// edge weighting rather than shipping the whole subgraph over the wire.
message TopVerticesByDegreeRequest {
  // prefix is required and must be non-empty: there is no whole-graph ranking
  // (an empty prefix is rejected with INVALID_ARGUMENT). Only vertices whose
  // key starts with prefix are candidates.
  string prefix = 1;
  // k caps the number of ranked entries returned. 0 lets the server apply its
  // configured default; the server also clamps k to a hard cap (see
  // ScanConfig), mirroring the scan `limit` knobs.
  uint32 k = 2;

  // Direction selects which incident edges count toward a vertex's degree.
  enum Direction {
    // DIRECTION_UNSPECIFIED defaults to out-degree server-side.
    DIRECTION_UNSPECIFIED = 0;
    // DIRECTION_OUT counts edges leaving the vertex (the vertex as tail).
    DIRECTION_OUT = 1;
    // DIRECTION_IN counts edges entering the vertex (the vertex as head).
    DIRECTION_IN = 2;
    // DIRECTION_BOTH counts edges in either direction (out-degree +
    // in-degree; a self-loop counts twice).
    DIRECTION_BOTH = 3;
  }
  Direction direction = 3;

  // weighted ranks by the summed live edge weight in the chosen direction
  // instead of the raw live edge count.
  bool weighted = 4;
}

// TopVerticesByDegreeResponse lists the ranked vertices in descending order of
// the chosen metric (weighted_degree when the request set `weighted`, else
// degree). Counts follow the live-visibility rule (#750): expired vertices and
// fully decayed edges do not contribute. Results are point-in-time
// best-effort, like GetServerStatus counts; for DIRECTION_IN / DIRECTION_BOTH
// the edge scan reads weights outside the write-blocking lock (#920), so an
// edge added or deleted mid-scan may be only partially reflected.
message TopVerticesByDegreeResponse {
  message Entry {
    string key = 1;
    // degree is the live edge count in the chosen direction.
    uint64 degree = 2;
    // weighted_degree is the summed live edge weight in the chosen direction.
    double weighted_degree = 3;
  }
  repeated Entry entries = 1;
}

message GetEdgeRequest {
  string tail = 1;
  string head = 2;
}

message GetEdgeResponse {
  Edge edge = 1;
}

// GetEdgesRequest reads several edges in one round trip. Subject to the
// same MaxBatchSize / MaxKeyLen guard rails as the write RPCs.
message GetEdgesRequest {
  repeated EdgeKey edges = 1;
}

message GetEdgesResponse {
  // edges contains every (tail, head) pair that was present at the time of
  // the call. Order is unspecified; clients should match by (Edge.tail,
  // Edge.head).
  repeated Edge edges = 1;
  // missing lists the requested (tail, head) pairs that did not exist (or
  // had expired).
  repeated EdgeKey missing = 2;
}

message DeleteEdgeRequest {
  string tail = 1;
  string head = 2;
}

message DeleteEdgeResponse {
  // existed is true if the edge was present and removed by this call.
  bool existed = 1;
}

// EdgeKey identifies an edge by its (tail, head) pair without weight.
message EdgeKey {
  string tail = 1;
  string head = 2;
}

// ScanEdgesRequest streams edges whose tail key starts with `tail_prefix`
// AND whose head key starts with `head_prefix`, in ascending (tail, head)
// order. Either prefix may be empty to disable the corresponding filter
// (both empty scans every edge). `limit` caps the number returned in one
// call; the server enforces a default when `limit == 0` and a hard maximum
// (see ScanConfig on the server). `cursor` MUST be treated as opaque bytes
// by clients — pass back exactly what the previous response returned in
// `next_cursor`. An empty `cursor` starts from the beginning.
//
// Implementation note: v1 walks the tail-side prefix index and applies
// `head_prefix` as a post-filter; for highly selective `head_prefix`
// queries the server may visit many tails to fill one page. Latency is
// reported in the standard scan histogram so operators can spot
// pathological filters.
message ScanEdgesRequest {
  string tail_prefix = 1;
  string head_prefix = 2;
  uint32 limit = 3;
  // NOTE: opaque to the caller; not interchangeable with cursors from
  // other Scan* RPCs (e.g. ScanVertices). Cross-feeding is rejected with
  // INVALID_ARGUMENT rather than silently restarting the scan.
  bytes cursor = 4;
}

message ScanEdgesResponse {
  // edges returned in ascending (tail, head) order. May be shorter than
  // `limit` when the underlying range is exhausted.
  repeated Edge edges = 1;
  // next_cursor is non-empty when more results are available. An empty
  // value signals end of stream.
  bytes next_cursor = 2;
}

// DeleteEdgesRequest removes several edges in one round trip. Subject to the
// MaxBatchSize / MaxKeyLen guard rails.
message DeleteEdgesRequest {
  repeated EdgeKey edges = 1;
}

message DeleteEdgesResponse {
  // Number of edges the server attempted to delete (equals len(edges) on success).
  int32 deleted = 1;
}

// DeleteEdgesByPrefixRequest deletes up to `limit` live edges whose tail key
// starts with `tail_prefix` AND whose head key starts with `head_prefix`.
// Either prefix may be empty to disable the corresponding filter, but at
// least one MUST be non-empty — an all-empty request is rejected with
// INVALID_ARGUMENT so a bulk edge wipe is always explicitly scoped. `limit ==
// 0` lets the server apply its configured default (see ScanConfig); callers
// loop on the returned `deleted` count until it reaches zero to drain a large
// matching set. When `dry_run` is true, no deletion is performed and the
// response reports the number that *would* be deleted (capped at the same
// effective limit).
//
// Implementation note: like ScanEdges, v1 walks the tail-side prefix index
// and applies `head_prefix` as a post-filter; a highly selective
// `head_prefix` may visit many tails to reach `limit`. Latency is reported in
// the standard scan histogram so operators can spot pathological filters.
message DeleteEdgesByPrefixRequest {
  string tail_prefix = 1;
  string head_prefix = 2;
  uint32 limit = 3;
  bool dry_run = 4;
}

message DeleteEdgesByPrefixResponse {
  uint64 deleted = 1;
}

// AddEdgeRequest accumulates weight onto a single (tail, head) pair: repeated
// calls with the same endpoints sum their weights. This is the singular
// convenience wrapper over AddEdges and shares its semantics.
message AddEdgeRequest {
  Edge edge = 1;
  // contrib_id is an optional 24-byte idempotency key for the contribution.
  // When set (non-empty and not all-zero), the server records the weight at
  // most once per distinct id: re-sending the same request (e.g. a
  // transport-level retry) is an exact no-op instead of double-counting the
  // additive weight. An empty value preserves the legacy non-idempotent
  // additive behavior. The id is opaque to the server; the Go SDK derives it
  // from a per-client random nonce plus a monotonic call sequence when
  // idempotent adds are enabled. Forwarded into contrib_ids[0] of the
  // one-element AddEdges batch this wraps.
  bytes contrib_id = 2;
}

message AddEdgeResponse {
  // effective_weight is the sum of live contributions on (tail, head)
  // immediately after applying (or, when contrib_id dedupes a replay, after
  // observing) this request, as seen by the serving node. This turns AddEdge
  // into a race-free increment-then-check counter: a caller writing
  // weight=1 with a TTL reads back the rolling-window count in one round trip
  // and can enforce a cap without a separate GetEdge. When contrib_id makes
  // the add a no-op, this is the current live sum (the value a retry wants).
  // Note: with replication enabled the value is the serving node's local view
  // at apply time — the same async-replica caveat as a Redis INCR read.
  float effective_weight = 1;
}

// AddEdgesRequest accumulates weight onto each (tail, head) pair: repeated
// calls with the same endpoints sum their weights. Additive writes are
// non-idempotent unless an index-aligned contrib_ids entry is supplied.
message AddEdgesRequest {
  repeated Edge edges = 1;
  // contrib_ids is an optional index-aligned list of 24-byte idempotency
  // keys, one per entry in edges. When contrib_ids[i] is set (non-empty and
  // not all-zero) the server records edges[i] at most once per distinct id,
  // making a retried batch safe to replay without double-counting weight. A
  // shorter list, a missing entry, or an empty/zero value leaves the
  // corresponding edge on the legacy non-idempotent additive path. Each id is
  // opaque to the server.
  //
  // Canonical 24-byte layout (the one spec; drift breaks cross-SDK dedup):
  //   bytes [0:16] = client nonce / origin NodeID
  //   bytes [16:24] = big-endian uint64 (seq<<16)|idx
  // where seq is a per-client/per-mutation monotonic counter and idx is the
  // edge's position within its batch (folding idx into the low 16 bits lets
  // one batch carry up to 65 536 distinct ids under a single seq). Three
  // hand-written encoders must stay byte-identical: sdks/go/client.go
  // nextContribIDs, sdks/node/src/contrib.ts contribIdFrom, and
  // server/service/apply.go contribIDFor. Golden-vector tests in all three
  // suites (#922) fail CI on any unilateral change.
  repeated bytes contrib_ids = 2;
}

message AddEdgesResponse {
  // Number of edges whose weight contributions were accepted.
  int32 written = 1;
  // effective_weights is index-aligned with the request edges: entry i is the
  // sum of live contributions on edges[i]'s (tail, head) immediately after
  // applying (or deduping) it, as seen by the serving node. Empty only for an
  // empty request. See AddEdgeResponse.effective_weight for the counter
  // semantics and the replication caveat.
  repeated float effective_weights = 2;
}

// PutEdgeRequest overwrites a single (tail, head) pair, replacing any
// existing weight and expiration. This is the singular convenience wrapper
// over PutEdges and shares its idempotent semantics.
message PutEdgeRequest {
  Edge edge = 1;
}

message PutEdgeResponse {
  // Server-authoritative result for edge in the request.
  PutOutcome outcome = 1;
}

// PutEdgesRequest overwrites each (tail, head) pair, replacing any existing
// weight and expiration. This operation is idempotent.
message PutEdgesRequest {
  repeated Edge edges = 1;
}

message PutEdgesResponse {
  // Index-aligned with request.edges and always the same length. An empty
  // request returns an empty list.
  repeated PutOutcome outcomes = 1;
}

// GetServerStatusRequest carries no parameters — the response is a
// snapshot of the server's identity, build, configuration ceilings, and
// current live counts. Intended for the admin UI's "Ops" tab and any
// lightweight smoke-test tooling that just needs to confirm "the server
// is up and roughly configured as expected".
message GetServerStatusRequest {}

// SearchErrorReason is the bounded, machine-readable reason attached to
// SearchVertices failures and search-index write rejections. Clients must
// branch on this enum, never on the human-readable status message.
enum SearchErrorReason {
  SEARCH_ERROR_REASON_UNSPECIFIED = 0;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_DISABLED = 1;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_POSITIONS_DISABLED = 2;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_WORK_BUDGET_EXHAUSTED = 3;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_ADMISSION_SATURATED = 4;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_INDEX_INCOMPLETE = 5;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_INDEX_BUDGET_EXHAUSTED = 6;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_CURSOR_STALE = 7;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_CURSOR_INVALID = 8;
  // buf:lint:ignore ENUM_VALUE_PREFIX -- stable cross-SDK reason code.
  SEARCH_CONTINUATION_LIMITED = 9;
}

// SearchErrorDetail is carried as a Connect error detail when a search
// capability is unavailable or query/write containment rejects the attempt.
message SearchErrorDetail {
  SearchErrorReason reason = 1;
  // work_kind is one of query_bytes, query_terms, dictionary_visits,
  // posting_visits, position_visits, expiration_visits, or an index
  // analysis-limit kind; empty otherwise.
  string work_kind = 2;
}

// SearchCapabilities is the server's discoverable full-text-search contract.
// config_fingerprint changes whenever one of these capability-defining values
// changes, allowing operators to spot heterogeneous HA members cheaply.
message SearchCapabilities {
  bool enabled = 1;
  bool positions_enabled = 2;
  uint32 default_limit = 3;
  uint32 max_limit = 4;
  MatchMode default_match_mode = 5;
  uint32 default_min_should_match = 6;
  uint32 max_fuzziness = 7;
  string analyzer_version = 8;
  string projection_version = 9;
  string config_fingerprint = 10;
  uint32 timeout_ms = 11;
  uint32 max_query_bytes = 12;
  uint32 max_query_terms = 13;
  uint64 max_dictionary_visits = 14;
  uint64 max_posting_visits = 15;
  uint64 max_position_visits = 16;
  uint32 max_in_flight = 17;
  uint32 max_document_bytes = 18;
  uint32 max_document_tokens = 19;
  uint32 max_document_terms = 20;
  uint64 max_live_terms = 21;
  uint64 max_live_postings = 22;
  uint64 max_position_entries = 23;
  double compaction_ratio = 24;
  uint64 compaction_min_retired = 25;
  SearchIndexStats index_stats = 26;
  uint64 max_expiration_visits = 27;
  uint32 cursor_ttl_seconds = 28;
  uint32 max_sessions = 29;
  uint32 max_session_hits = 30;
  uint64 max_session_bytes = 31;
}

// SearchIndexStats exposes logical size, retained high-water storage, rebuild
// activity, and whether the index is safe to serve.
enum SearchIndexHealth {
  SEARCH_INDEX_HEALTH_UNSPECIFIED = 0;
  SEARCH_INDEX_HEALTH_DISABLED = 1;
  SEARCH_INDEX_HEALTH_HEALTHY = 2;
  SEARCH_INDEX_HEALTH_INCOMPLETE = 3;
}

message SearchIndexStats {
  SearchIndexHealth health = 1;
  // documents is the logical live document count at the status sample's now.
  uint64 documents = 2;
  // The following live cardinalities use the same sampled now as documents.
  uint64 live_terms = 3;
  uint64 retained_term_slots = 4;
  uint64 retained_ordinals = 5;
  uint64 postings = 6;
  uint64 position_entries = 7;
  uint64 estimated_live_bytes = 8;
  uint64 estimated_retained_bytes = 9;
  uint64 rebuild_count = 10;
  google.protobuf.Duration last_rebuild_duration = 11;
  // Physical documents include expired entries awaiting bounded query purge
  // or the cache's background GC hook.
  uint64 physical_documents = 12;
  uint64 expired_documents = 13;
  uint64 expiration_queue_entries = 14;
  uint64 expiration_purged = 15;
  google.protobuf.Duration last_expiration_purge_duration = 16;
  // generation advances on every committed search-visible mutation batch,
  // TTL purge, and rebuild. It is diagnostic only for bounded search
  // sessions; clients do not compare it themselves.
  uint64 generation = 17;
}

message GetServerStatusResponse {
  // Build/version stamp. Falls back to "dev" when the binary was built
  // without VCS info or without LANTERN_VERSION set.
  string version = 1;

  // Reports `runtime.Version()` (e.g. "go1.26.4").
  string go_version = 2;

  // Wall-clock instant the server process started serving requests.
  // Captured when the Connect listener starts accepting, not at process
  // start, so the value reflects "ready to serve" rather than "wire
  // init done".
  google.protobuf.Timestamp started_at = 3;

  // Convenience field: now - started_at on the server side, so clients
  // do not have to know the server's clock to display uptime.
  google.protobuf.Duration uptime = 4;

  // The default TTL applied to vertices/edges when the caller does not
  // specify Expiration (LANTERN_DEFAULT_TTL_SECONDS).
  google.protobuf.Duration default_ttl = 5;

  // Validation ceiling for batch RPCs (LANTERN_MAX_BATCH_SIZE).
  uint32 max_batch_size = 6;

  // Validation ceiling for vertex/edge keys (LANTERN_MAX_KEY_BYTES).
  uint32 max_key_bytes = 7;

  // Per-call defaults / hard caps for prefix-scan pagination
  // (LANTERN_SCAN_DEFAULT_LIMIT / LANTERN_SCAN_MAX_LIMIT).
  uint32 scan_default_limit = 8;
  uint32 scan_max_limit = 9;

  // True when the server is terminating TLS
  // (LANTERN_TLS_CERT_FILE + LANTERN_TLS_KEY_FILE both set).
  bool tls_enabled = 10;

  // True when this server is wired to a mutation log + HLC clock and is
  // therefore a member of a replication group. False on single-node
  // deployments.
  bool replication_enabled = 11;

  // Live counts pulled from the in-memory graph cache. Cheap to compute
  // (index sizes, no scan). Intended for at-a-glance dashboards — these
  // are not transactional snapshots and may include not-yet-collected
  // expired entries bounded by the GC tick.
  uint64 vertex_count = 12;
  uint64 edge_count = 13;

  // Full-text-search capability snapshot. Clients can use this to disable
  // controls that the selected server cannot satisfy before sending a query.
  SearchCapabilities search = 14;
}

// ReplicationPeer is one row of the GetReplicationStatus snapshot.
// Each row models the local node's view of a single outbound peer
// connection owned by the replication pump (#185). Fields are
// best-effort point-in-time samples; clients should treat consecutive
// snapshots as monotonically advancing rather than transactional.
message ReplicationPeer {
  // address is the dial target as configured in LANTERN_PEERS (or
  // resolved from DNS discovery). Stable across reconnects for a given
  // peer, so it doubles as the row identity for admin UI displays.
  string address = 1;

  enum State {
    STATE_UNSPECIFIED = 0;
    // Pump is dialing or has dialed but Subscribe has not yet
    // returned a frame.
    STATE_CONNECTING = 1;
    // Subscribe stream is open and frames have been received.
    STATE_STREAMING = 2;
    // Last session errored; the pump is sleeping before the next
    // reconnect attempt.
    STATE_BACKOFF = 3;
    // Per-peer goroutine has exited (typically because DNS discovery
    // removed the address). Reported transiently — the row drops out
    // of subsequent snapshots once the supervisor has reaped it.
    STATE_CLOSED = 4;
  }
  State state = 2;

  // last_event_at is the wall-clock instant the pump last received any
  // frame (Subscribe or Snapshot) from this peer. Unset when nothing
  // has been received yet. Combined with the response-level local_now
  // it yields the "how stale is this stream" diagnostic the admin UI
  // shows as a lag bar.
  google.protobuf.Timestamp last_event_at = 3;

  // applied_seq is the highest peer-local sequence number the pump has
  // successfully consumed from this peer. Zero on a fresh connection.
  uint64 applied_seq = 4;

  // error carries the last non-recoverable error message reported by
  // the per-peer session loop. Cleared on the next successful frame.
  string error = 5;
}

// GetReplicationStatusRequest carries no parameters. The response is a
// flat snapshot of the local node's view of every outbound peer.
message GetReplicationStatusRequest {}

message GetReplicationStatusResponse {
  // node_id is the local HLC NodeID rendered as lowercase hex (32 chars).
  // Stable for the lifetime of the process; either configured via
  // LANTERN_NODE_ID or randomly generated at startup.
  string node_id = 1;

  // local_now is the server's wall-clock at the moment the snapshot
  // was taken. Provided so clients can compute per-peer staleness
  // (local_now - last_event_at) without trusting their own clock.
  google.protobuf.Timestamp local_now = 2;

  // enabled is false on a single-instance deployment (no peers
  // configured AND no DNS discovery). When false, peers is empty but
  // the response is still well-formed — handlers never return
  // Unimplemented for this RPC.
  bool enabled = 3;

  // peers is the per-peer slice. Order is the supervisor's iteration
  // order and is intentionally unspecified; clients sort by address
  // for display.
  repeated ReplicationPeer peers = 10;
}

// BackupSnapshotRequest parameterises a whole-graph backup stream.
// vertex_prefix, when non-empty, restricts the backup to the induced
// subgraph over vertices whose key has this prefix (an edge is included
// only when BOTH endpoints match). Empty = the whole graph.
message BackupSnapshotRequest {
  string vertex_prefix = 1;
}

// BackupSnapshotResponse is one frame of the BackupSnapshot stream:
// either a live vertex or a folded live edge (weight summed across
// contributions, expiration = the furthest-future contribution). The two
// kinds are interleaved; consumers route on the oneof.
message BackupSnapshotResponse {
  oneof record {
    Vertex vertex = 1;
    Edge edge = 2;
  }
}

service LanternService {
  rpc Illuminate(IlluminateRequest) returns (IlluminateResponse);

  rpc GetVertex(GetVertexRequest) returns (GetVertexResponse);

  // GetVertices reads several vertices in one round trip.
  rpc GetVertices(GetVerticesRequest) returns (GetVerticesResponse);

  // PutVertex writes a single vertex. Thin facade over PutVertices.
  rpc PutVertex(PutVertexRequest) returns (PutVertexResponse);

  rpc PutVertices(PutVerticesRequest) returns (PutVerticesResponse);

  rpc DeleteVertex(DeleteVertexRequest) returns (DeleteVertexResponse);

  // DeleteVertices removes several vertices in one round trip.
  rpc DeleteVertices(DeleteVerticesRequest) returns (DeleteVerticesResponse);

  // ScanVertices streams vertices whose key starts with the given prefix in
  // ascending order, page by page. Plural-only — prefix scan is inherently
  // plural.
  rpc ScanVertices(ScanVerticesRequest) returns (ScanVerticesResponse);

  // ScanVertexKeys streams just the KEYS (no values) of vertices whose key
  // starts with the given prefix, page by page — the wire-efficient backing
  // RPC for the `keys` CLI verb. A non-empty prefix is REQUIRED. Plural-only.
  rpc ScanVertexKeys(ScanVertexKeysRequest) returns (ScanVertexKeysResponse);

  // SearchVertices returns vertices ranked by full-text relevance over their
  // content (key + value), optionally scoped to a key prefix, in stable
  // (score DESC, raw key ASC) order. Requires the server-side search index
  // (LANTERN_SEARCH_ENABLED, on by default); returns FAILED_PRECONDITION when
  // disabled. Plural-only — ranked search is inherently plural.
  rpc SearchVertices(SearchVerticesRequest) returns (SearchVerticesResponse);

  // CountVerticesByPrefix returns the number of live vertices whose key
  // starts with the given prefix.
  rpc CountVerticesByPrefix(CountVerticesByPrefixRequest) returns (CountVerticesByPrefixResponse);

  // DeleteVerticesByPrefix deletes up to `limit` vertices whose key starts
  // with the given prefix. Pass `dry_run = true` to preview the count
  // without mutating state.
  rpc DeleteVerticesByPrefix(DeleteVerticesByPrefixRequest) returns (DeleteVerticesByPrefixResponse);

  // TopVerticesByDegree ranks the most-connected live vertices under a key
  // prefix by their (weighted) out/in/both degree. Read-only aggregate; a
  // non-empty prefix is REQUIRED (empty → INVALID_ARGUMENT). Results are
  // point-in-time best-effort and honour the live-visibility rule (#750).
  //
  // Cost model (#920): OUT-degree is scoped to the candidates' own out-edges,
  // but IN and BOTH scan every edge bucket in the graph — O(E_total),
  // independent of prefix narrowness, because no reverse (head->tails) index
  // exists. That scan runs without holding the write-blocking aggregate lock
  // for its full duration, so an IN/BOTH result on a large, actively-written
  // graph is a best-effort snapshot rather than a single point-in-time view.
  rpc TopVerticesByDegree(TopVerticesByDegreeRequest) returns (TopVerticesByDegreeResponse);

  rpc GetEdge(GetEdgeRequest) returns (GetEdgeResponse);

  // GetEdges reads several edges in one round trip.
  rpc GetEdges(GetEdgesRequest) returns (GetEdgesResponse);

  // AddEdge is non-idempotent (accumulates weight). Thin facade over AddEdges.
  rpc AddEdge(AddEdgeRequest) returns (AddEdgeResponse);

  // AddEdges is non-idempotent (accumulates weight). POST per REST conventions.
  rpc AddEdges(AddEdgesRequest) returns (AddEdgesResponse);

  // PutEdge is idempotent (replaces weight). Thin facade over PutEdges.
  rpc PutEdge(PutEdgeRequest) returns (PutEdgeResponse);

  // PutEdges is idempotent (replaces weight). PUT per REST conventions.
  rpc PutEdges(PutEdgesRequest) returns (PutEdgesResponse);

  rpc DeleteEdge(DeleteEdgeRequest) returns (DeleteEdgeResponse);

  // DeleteEdges removes several edges in one round trip.
  rpc DeleteEdges(DeleteEdgesRequest) returns (DeleteEdgesResponse);

  // DeleteEdgesByPrefix deletes up to `limit` live edges whose tail key
  // starts with `tail_prefix` AND whose head key starts with `head_prefix`.
  // At least one prefix must be non-empty. Pass `dry_run = true` to preview
  // the count without mutating state. Plural-only — prefix delete is
  // inherently plural.
  rpc DeleteEdgesByPrefix(DeleteEdgesByPrefixRequest) returns (DeleteEdgesByPrefixResponse);

  // ScanEdges streams edges whose tail key starts with `tail_prefix` AND
  // whose head key starts with `head_prefix`, in ascending (tail, head)
  // order, page by page. Plural-only — prefix scan is inherently plural.
  rpc ScanEdges(ScanEdgesRequest) returns (ScanEdgesResponse);

  // GetServerStatus returns a flat snapshot of the server's identity,
  // build info, configuration ceilings, and current live vertex/edge
  // counts. Read-only and cheap — intended for the admin UI's "Ops"
  // tab and lightweight smoke-test tooling. Auth is the caller's
  // responsibility; no PII is returned.
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);

  // GetReplicationStatus returns a flat snapshot of the local node's
  // outbound peer-replication state. Read-only — no peer add/remove
  // surface is exposed (see #315 out-of-scope). Cheap to call from a
  // dashboard at any cadence the operator finds useful. On
  // single-instance deployments enabled=false and peers is empty.
  rpc GetReplicationStatus(GetReplicationStatusRequest) returns (GetReplicationStatusResponse);

  // BackupSnapshot streams a whole-graph, point-in-time backup: every
  // live vertex and folded edge as a BackupRecord, materialised under a
  // single GraphCache lock (SnapshotGraph). Unlike the replication
  // Snapshot RPC it has NO replication gate — it works on a single node.
  // vertex_prefix optionally scopes the backup to an induced subgraph.
  // The restore side replays records through PutVertices / PutEdges, so
  // there is no dedicated restore RPC.
  rpc BackupSnapshot(BackupSnapshotRequest) returns (stream BackupSnapshotResponse);
}
