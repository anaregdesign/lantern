# Single-node Tarp storage with private backups. Keep the graph volume across
# container recreation. The graph-only node can recover a missing database
# from its newest private recovery point under ./backups.
#
#   docker compose -f docker-compose.backup.yml up -d
#   go run ../../cli put vertex hello world
#   docker compose -f docker-compose.backup.yml down
#   docker compose -f docker-compose.backup.yml up -d
#   go run ../../cli get vertex hello
#
# See docs/backup.md for private recovery and receipt continuity.

services:
  lantern:
    image: ${LANTERN_IMAGE:-ghcr.io/anaregdesign/lantern:latest}
    ports:
      - "6380:6380"
      - "9090:9090"
    # Cover the drain (#768) + shutdown timeout on `down`.
    stop_grace_period: 45s
    environment:
      LANTERN_PORT: "6380"
      LANTERN_METRICS_ADDR: ":9090"
      LANTERN_LOG_FORMAT: "json"
      LANTERN_LOG_LEVEL: "info"
      # Reopening a database preserves its absolute expiration times.
      LANTERN_DEFAULT_TTL_SECONDS: "86400"
      LANTERN_DATA_DIR: "/state/graph"
      LANTERN_BACKUP_INSTANCE_ID: "standalone"
      LANTERN_BACKUP_ENABLED: "true"
      LANTERN_BACKUP_DIR: "/data"
      LANTERN_BACKUP_INTERVAL: "60s"
      LANTERN_BACKUP_RETAIN: "5"
      LANTERN_BACKUP_RESTORE_ON_START: "true"
      # Flip readiness before the listener closes on `down` (#768).
      LANTERN_DRAIN_DELAY_SECONDS: "5"
    volumes:
      - graph:/state
      - ./backups:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

volumes:
  graph:
