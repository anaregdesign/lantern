# Docker Compose: single-node lantern + lantern-mcp.
#
# Minimal local-dev topology for trying the MCP server against a fresh
# Lantern. Not for HA — see `docker-compose.yml` in this directory for
# the 3-replica peer-discovery cluster.
#
# Usage:
#   cd deploy/compose
#   docker compose -f docker-compose.mcp.yml up -d
#
# `lantern-mcp` is a long-lived Streamable-HTTP server, so `up -d` is the
# right verb (unlike the old stdio server, which the agent runtime
# spawned per-session). Once it is up, point your agent at:
#
#   http://localhost:6390/mcp
#
# The endpoint is unauthenticated; this compose file binds it to the host
# for local dev only. See deploy/helm for a cluster-internal deployment.
#
# Override the image tags:
#   LANTERN_IMAGE=ghcr.io/anaregdesign/lantern:v0.8.0 \
#   LANTERN_MCP_IMAGE=ghcr.io/anaregdesign/lantern-mcp:v0.4.0 \
#       docker compose -f docker-compose.mcp.yml up -d

services:
  lantern:
    image: ${LANTERN_IMAGE:-ghcr.io/anaregdesign/lantern:latest}
    ports:
      - "6380:6380"
      - "9090:9090"
    environment:
      LANTERN_PORT: "6380"
      LANTERN_METRICS_ADDR: ":9090"
      LANTERN_DEFAULT_TTL_SECONDS: "3600"
      LANTERN_LOG_FORMAT: "json"
      LANTERN_LOG_LEVEL: "info"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/readyz"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s

  lantern-mcp:
    image: ${LANTERN_MCP_IMAGE:-ghcr.io/anaregdesign/lantern-mcp:latest}
    ports:
      # The MCP endpoint, served at /mcp. Map a different host port with
      # e.g. "7000:6390" and connect to http://localhost:7000/mcp.
      - "6390:6390"
    environment:
      # Bind all interfaces inside the container so the published port is
      # reachable (the bare binary defaults to loopback only).
      LANTERN_MCP_HTTP_ADDR: "0.0.0.0:6390"
      # Use the Compose service DNS name so this works on Linux without
      # `host.docker.internal`.
      LANTERN_ADDR: "http://lantern:6380"
      LANTERN_MCP_PING_TIMEOUT: "5s"
      # Uncomment any of the 12 TTL buckets you want to override; values
      # must use Go time.ParseDuration syntax (no `d` suffix).
      # LANTERN_MCP_TTL_TURN: "15m"
      # LANTERN_MCP_TTL_CONVERSATION: "2h"
    # No container healthcheck: the distroless image has no shell or wget.
    # Probe GET http://localhost:6390/healthz from the host instead.
    depends_on:
      lantern:
        condition: service_healthy
