# Zero-config OFF quick start. HA uses the explicit signed-membership overlay.
x-lantern-common: &lantern-common
  image: ${LANTERN_IMAGE:-ghcr.io/anaregdesign/lantern:latest}
  stop_grace_period: 45s
  environment:
    LANTERN_PORT: "6380"
    LANTERN_METRICS_ADDR: ":9090"
    LANTERN_DEFAULT_TTL_SECONDS: "3600"
    LANTERN_LOG_FORMAT: "json"
    LANTERN_DRAIN_DELAY_SECONDS: "5"
    LANTERN_BACKUP_ENABLED: "true"
    LANTERN_BACKUP_DIR: /data
    LANTERN_BACKUP_INTERVAL: 5m
    LANTERN_BACKUP_RETAIN: "3"
    LANTERN_BACKUP_RESTORE_ON_START: "true"
  networks:
    default:
      aliases: [lantern]
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/readyz"]
    interval: 5s
    timeout: 2s
    retries: 12
    start_period: 10s

services:
  lantern-0:
    <<: *lantern-common
    hostname: lantern-0
    ports: ["127.0.0.1:6380:6380"]
    volumes: [lantern-backup-0:/data]
  admin:
    image: ${LANTERN_ADMIN_IMAGE:-ghcr.io/anaregdesign/lantern-admin:latest}
    ports: ["127.0.0.1:8080:8080"]
    environment:
      LANTERN_ADMIN_SERVER_UPSTREAM: h2c://lantern-0:6380
    depends_on:
      lantern-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
  lantern-mcp:
    profiles: [tools]
    image: ${LANTERN_MCP_IMAGE:-ghcr.io/anaregdesign/lantern-mcp:latest}
    ports: ["127.0.0.1:6390:6390"]
    environment:
      LANTERN_MCP_HTTP_ADDR: 0.0.0.0:6390
      LANTERN_ADDR: http://lantern-0:6380
    depends_on:
      lantern-0:
        condition: service_healthy
  prometheus:
    profiles: [diagnostics]
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9091:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1h"]
    depends_on:
      lantern-0:
        condition: service_healthy
volumes:
  lantern-backup-0:
