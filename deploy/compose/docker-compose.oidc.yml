# One-node fixed-topology OIDC Server, after explicit trust provisioning.
# Prepare the placeholder setup JSON privately; see README.md. The referenced
# directory must already exist. It is never generated during ordinary startup.
name: lantern-oidc

x-server: &server
  image: lantern:security-provisioning-local
  build:
    context: ../..
    dockerfile: Dockerfile
  hostname: lantern-0
  stop_grace_period: 45s
  environment:
    LANTERN_AUTH_MODE: oidc
    LANTERN_PORT: "6380"
    LANTERN_METRICS_ADDR: "127.0.0.1:9090"
    LANTERN_DRAIN_DELAY_SECONDS: "5"
    # Generated paths are absolute. The bind target below preserves them.
    # Only this reference enters the runtime environment, never setup secrets.
    LANTERN_SECURITY_CONFIG_JSON: '{"provisioned_file":"${LANTERN_PROVISIONING_DIRECTORY:-/FAKE_PRIVATE_PROVISIONING_DIRECTORY}/nodes/node-1/security.json"}'
  volumes:
    # This node alone: immutable trust/credentials and renewable signed inputs.
    # Directory mounting preserves atomic membership replacement by the operator.
    # The separate operator directory and signing keys are never mounted here.
    - type: bind
      source: ${LANTERN_PROVISIONING_DIRECTORY:-/FAKE_PRIVATE_PROVISIONING_DIRECTORY}/nodes/node-1
      target: ${LANTERN_PROVISIONING_DIRECTORY:-/FAKE_PRIVATE_PROVISIONING_DIRECTORY}/nodes/node-1
      read_only: true
      bind:
        create_host_path: false
    - lantern-security-state:/state
  configs:
    - source: native-time-source
      target: /etc/ntp.conf
      mode: 0444
  networks:
    default:
      aliases: [lantern-0]

services:
  init-security:
    <<: *server
    profiles: [init]
    command: [init-security]
    restart: "no"

  lantern-0:
    <<: *server
    ports: ["127.0.0.1:6380:6380"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 40s

# Nonsecret admitted native source input; does not alter host time services.
configs:
  native-time-source:
    content: "server time.asia.apple.com\n"

volumes:
  lantern-security-state:
