# One fixed OIDC node. Supply the SAME human JSON for init and every start.
# Provision its material_root once beforehand; material is not runtime config.
# Complete placeholders privately; never share rendered real configuration.
name: lantern-oidc

x-server: &server
  image: lantern:security-provisioning-local
  build:
    context: ../..
    dockerfile: Dockerfile
  hostname: lantern-0
  stop_grace_period: 45s
  environment:
    LANTERN_AUTH_MODE: oidc
    LANTERN_PORT: "6380"
    LANTERN_METRICS_ADDR: "127.0.0.1:9090"
    LANTERN_DRAIN_DELAY_SECONDS: "5"
    # Forward the complete current human input unchanged to both services.
    # Missing/empty JSON is rejected in OIDC; no generated-config fallback.
    LANTERN_SECURITY_CONFIG_JSON: '${LANTERN_SECURITY_CONFIG_JSON:-}'
  volumes:
    # This node alone: identity keys/historical trust and renewable signed inputs.
    # Directory mounting preserves atomic membership replacement by the operator.
    # The separate operator directory and signing keys are never mounted here.
    - type: bind
      source: ${LANTERN_MATERIAL_DIRECTORY:-/FAKE_PRIVATE_MATERIAL_DIRECTORY}/nodes/node-1
      target: ${LANTERN_MATERIAL_DIRECTORY:-/FAKE_PRIVATE_MATERIAL_DIRECTORY}/nodes/node-1
      read_only: true
      bind:
        create_host_path: false
    - lantern-security-state:/state
  configs:
    - source: native-time-source
      target: /etc/ntp.conf
      mode: 0444
  networks:
    default:
      aliases: [lantern-0]

services:
  init-security:
    <<: *server
    profiles: [init]
    command: [init-security]
    restart: "no"

  lantern-0:
    <<: *server
    ports: ["127.0.0.1:6380:6380"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/readyz"]
      interval: 5s
      timeout: 2s
      retries: 24
      start_period: 40s

# Nonsecret admitted native source input; does not alter host time services.
configs:
  native-time-source:
    content: "server time.asia.apple.com\n"

volumes:
  lantern-security-state:
