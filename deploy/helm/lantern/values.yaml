# Default values for lantern.
# Minimal, cost-optimised profile for GKE Autopilot: a 2-replica
# StatefulSet + headless Service (peer DNS) + ClusterIP Service (in-cluster
# clients) + PDB. Lantern is a full-replica store, so 2 replicas give
# rolling-update / single-node-drain survival at the lowest footprint.
# The Service is ClusterIP-only — Lantern is never exposed outside the
# cluster; reach it from other pods via its Service FQDN, or from a laptop
# with `kubectl port-forward` for verification. Admin, MCP and Prometheus
# are expected to run locally and are NOT deployed by this profile. Set
# replicaCount=1 to fall back to single-instance mode (no peer pump, no
# readiness gating).

image:
  repository: ghcr.io/anaregdesign/lantern
  tag: ""        # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Lantern discovers peers and sibling services through DNS, so Kubernetes
# ServiceLink environment variables are unnecessary. Keep them disabled to
# avoid namespace-dependent LANTERN_* variables colliding with the server's
# strict config validation. Set true only for a workload that explicitly
# depends on legacy ServiceLink discovery.
enableServiceLinks: false

nameOverride: ""
fullnameOverride: ""

# Number of lantern pods. 2 is the minimal HA default for this profile:
# a full-replica store means each pod holds the whole graph, so 2 replicas
# survive a rolling update / single-node drain at the lowest cost. Use 1
# for single-instance / dev (peer pump becomes a no-op when only the local
# pod resolves).
replicaCount: 2

# StatefulSet update strategy. RollingUpdate is required for the PDB
# minAvailable guarantee to hold during upgrades.
updateStrategy:
  type: RollingUpdate

# PodDisruptionBudget for voluntary disruption (node drains, upgrades).
# minAvailable: 1 keeps one replica serving while the other is drained —
# the correct setting for 2 replicas (minAvailable: 2 would deadlock every
# voluntary disruption). Set enabled: false for single-instance deployments.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Zero-drop rolling-update drain (#768). On SIGTERM the server flips
# readiness to NOT_SERVING immediately (overall "" gRPC health + /readyz
# return 503 so kube-proxy / load balancers deregister the pod) and then
# keeps the listener serving for `drain.delaySeconds` so in-flight and
# endpoint-propagation-window requests still complete — this is the primary
# mechanism and needs no shell in the image (it is server-side, via
# LANTERN_DRAIN_DELAY_SECONDS).
#
# `drain.preStop` is an OPTIONAL k8s-native belt: a `sleep delaySeconds`
# preStop hook for operators who also want kubelet to pause before SIGTERM
# (e.g. behind a mesh that drains on container lifecycle rather than
# readiness). It is OFF by default because the server-side hold already
# covers the propagation window, and it requires `/bin/sleep` in the image
# (present on the alpine-based server image, absent on distroless).
drain:
  delaySeconds: 5
  preStop: false

# Pod termination grace. Must exceed drain.delaySeconds + the server
# shutdown timeout (LANTERN_SHUTDOWN_TIMEOUT_SECONDS, default 30) so the
# drain window and the in-flight flush both fit before SIGKILL.
terminationGracePeriodSeconds: 45

# minReadySeconds gates the rollout: a freshly-restarted pod must stay
# Ready this long before the StatefulSet controller disrupts the next one,
# so a pod whose readiness flaps right after restart doesn't cascade.
minReadySeconds: 10

service:
  # ClusterIP service exposes the Lantern wire port to clients
  # (Connect / gRPC / gRPC-Web multiplexed on h2c).
  port: 6380
  # Headless service drives DNS-based peer discovery (#190).
  # No ClusterIP — DNS returns one A per ready pod.
  headlessName: ""   # default: <fullname>-headless
  type: ClusterIP
  annotations: {}

# Metrics endpoint (Prometheus /metrics + /healthz + /readyz).
metrics:
  port: 9090
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  # Google Cloud Managed Service for Prometheus (GMP) PodMonitoring. On GKE
  # (Autopilot has managed collection on by default) a PodMonitoring is the
  # supported way to ingest a pod's /metrics — the serviceMonitor above is
  # Prometheus-Operator-only and is IGNORED by GMP. Disabled by default; set
  # podMonitoring.enabled=true on a GKE/GMP cluster. Requires the
  # PodMonitoring CRD (monitoring.googleapis.com/v1), present by default on
  # GKE. Mutually independent from serviceMonitor — enable whichever your
  # monitoring backend consumes (or neither).
  podMonitoring:
    enabled: false
    interval: 60s
    labels: {}
    # GMP metricRelabeling applied to scraped samples (Prometheus
    # metric_relabel_configs semantics). GMP bills primarily per ingested
    # sample, so the default is a production allowlist: HA/readiness, backup,
    # capacity/resource, search-index health, validation, subscription, and
    # gRPC RED signals. It intentionally excludes the high-cardinality
    # lantern_illuminate_*, detailed lantern_search_* histograms, scan, and
    # batch families; gRPC RED metrics retain request rate/error/latency while
    # logs provide detailed RCA. The complete /metrics endpoint is unchanged.
    # Set to [] only when a full scrape is intentional and budgeted.
    metricRelabeling:
      - action: keep
        sourceLabels: [__name__]
        regex: up|go_goroutines|go_memstats_heap_inuse_bytes|process_resident_memory_bytes|process_cpu_seconds_total|grpc_server_.*|lantern_(anti_entropy_.*|auth_rejected_total|backup_.*|build_info|capacity_limit|edge_contrib_deduped_total|edges|get_(edge|vertex)_(hits|misses)_total|gc_duration_seconds_.*|mutation_log_.*|mutationlog_subscriber_dropped_total|origin_states_count|peer_connected|rate_limit_rejected_total|replication_.*|restore_.*|search_calls_total|search_config_.*|search_index_.*|search_rejections_total|snapshot_.*|subscribe_.*|subscription_.*|tombstone_clamp_rejected_total|ttl_expirations_total|validation_rejected_total|vertex_hlc_.*|vertices)

# Replication / peer discovery. See docs/replication.md §9.1.
replication:
  discovery:
    mode: dns                   # static | dns
    # DNS hostname the pump resolves to peer IPs. Empty => template
    # auto-fills with the headless Service FQDN.
    dnsName: ""
    defaultPort: "6380"         # appended to each resolved IP
    intervalMs: 10000           # 0 = resolve once at startup
  # Static fallback list, used when discovery.mode == "static".
  peers: []
  # Cap per-(peer,origin) replication lag before readiness flips false.
  maxLag: 10000

# Anti-entropy settings (background reconciliation). See #186.
antiEntropy:
  intervalMs: 30000
  subscribeTimeoutMs: 30000

# Graph cache TTL defaults (seconds).
cache:
  defaultTtlSeconds: 3600

# Snapshot durability (#770, #779): periodic whole-graph dumps to a mounted
# volume + restore-on-startup. ENABLED by default — the stable durability
# baseline. In this 2-replica profile restore runs on each pod as a BASELINE:
# peer bootstrap then overlays it via HLC (newer peer state wins per key, so
# replicas take priority), while a whole-cluster cold start recovers from the
# dumps instead of coming up empty. It is also the single-instance
# (replicaCount=1) rolling-update insurance, where restore-on-start re-seeds
# the graph on boot. Each pod writes its own dumps (LANTERN_BACKUP_INSTANCE_ID
# = pod name). persistence below renders a per-pod ReadWriteOnce PVC, which on
# GKE Autopilot binds the default `standard-rwo` StorageClass — cost-minimal
# and the recommended default. For a shared dump volume instead, point
# persistence.existingClaim at a pre-provisioned RWX claim; set enabled: false
# to opt out.
backup:
  enabled: true
  dir: /var/lib/lantern/backups
  interval: 5m
  retain: 3
  restoreOnStart: true
  restoreRequired: false
  persistence:
    # A real PVC is required for dumps to survive pod restarts (an emptyDir
    # would not). When enabled and no existingClaim is set, the chart renders
    # a per-pod volumeClaimTemplate mounted at `dir`.
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: ["ReadWriteOnce"]
    size: 1Gi

# Liveness/readiness probes.
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# Resource requests/limits. On GKE Autopilot you pay for requests and an
# unset limit is clamped to the request, so requests == limits here for
# Guaranteed QoS and predictable cost. 250m CPU is the Autopilot per-pod
# minimum; 512Mi memory is the server's working-set floor (the 250m:512Mi
# CPU:memory ratio sits inside Autopilot's allowed 1:1–1:6.5 band). Raise
# both together for larger graphs.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 250m
    memory: 512Mi

# Extra environment variables (raw env list, appended after the
# templated ones). Useful for TLS_* / RATE_LIMIT_* / LOG_* tweaks.
extraEnv: []

# Pod scheduling.
nodeSelector: {}
tolerations: []
affinity: {}

# Soft anti-affinity by default — schedule pods on different nodes
# when possible. Set to {} to disable.
defaultPodAntiAffinity: true

# Pod security.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# Logging.
log:
  level: info
  format: json

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Browser-facing admin SPA (lantern-admin). Disabled by default to
# preserve the existing install footprint; flip `admin.enabled=true`
# to render a Deployment + Service (and optionally an Ingress) for
# the SPA. The container is a pure Caddy SPA host — the browser
# calls the Lantern Service directly over Connect-Web, so the
# lantern server must allow the admin origin via
# `LANTERN_CORS_ALLOWED_ORIGINS` (set under `extraEnv` on the
# StatefulSet, or via the auto-derived value when
# `admin.ingress.enabled=true` — see admin-deployment.yaml).
#
# v1 ships **without** auth in front of the admin. Run it only on
# trusted networks or front it with your own ingress-level auth
# proxy.
admin:
  enabled: false

  image:
    repository: ghcr.io/anaregdesign/lantern-admin
    # Defaults to .Chart.AppVersion (same convention as the server
    # image); pin to a specific admin tag (e.g. "v0.1.1") in production.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    # When enabled, host MUST be set — the chart appends
    # `https://<host>` to LANTERN_CORS_ALLOWED_ORIGINS on the
    # StatefulSet so the browser preflight succeeds. Multiple hosts
    # are not supported in v1; copy admin-ingress.yaml if you need a
    # richer routing setup.
    host: ""
    tls: []
    #  - secretName: lantern-admin-tls
    #    hosts:
    #      - admin.example.com

  # Optional same-origin Prometheus reverse proxy for the admin Metrics
  # page. When `upstream` is non-empty, the admin container's entrypoint
  # writes a Caddy `handle_path /api/prom/* { reverse_proxy <upstream> }`
  # snippet, the SPA's default Prometheus URL (`/api/prom`) reaches
  # Prometheus without a cross-origin browser call, and the chart mounts
  # an emptyDir at /etc/caddy/conf.d so the non-root container can write
  # that snippet regardless of `securityContext.readOnlyRootFilesystem`.
  # Leave empty to disable (Metrics page degrades gracefully; operators
  # can still point it at any reachable Prometheus from the browser).
  prometheus:
    upstream: ""   # e.g. "http://prometheus-server.monitoring.svc:80"

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false

  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# lantern-mcp: the Model Context Protocol server, exposed over Streamable
# HTTP. When `enabled`, the chart renders a Deployment + Service (mirroring
# the admin pattern) so agent pods can reach it in-cluster at
# http://<release>-mcp.<namespace>.svc:6390/mcp. Disabled by default.
#
# The endpoint is unauthenticated — keep the Service ClusterIP-only and
# reach it from agent pods in the same cluster, or front it with your own
# auth proxy / ingress if you must expose it. See
# deploy/helm/lantern/README.md "MCP server" for the full walkthrough and
# mcp/examples/ for the agent-runtime client configs.
mcp:
  enabled: false

  image:
    repository: ghcr.io/anaregdesign/lantern-mcp
    tag: ""        # defaults to .Chart.AppVersion; pin to mcp/vX.Y.Z in prod
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 6390
    annotations: {}

  # Address the MCP container dials. Empty (default) falls back to the
  # chart's ClusterIP Service FQDN so the MCP server talks to the
  # in-cluster lantern automatically. Override only when it runs in a
  # different namespace / cluster.
  lanternAddr: ""

  # Startup health-check timeout for the MCP container's initial ping.
  pingTimeout: "5s"

  # Per-TTL-bucket override map. Each non-empty value is emitted as a
  # `LANTERN_MCP_TTL_<UPPER_BUCKET>` env var on the container. See
  # mcp/internal/ttl/ for the canonical bucket list + defaults.
  ttl: {}
    # turn: "15m"
    # conversation: "2h"

  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    # The MCP server is a static binary that never writes to disk.
    readOnlyRootFilesystem: true

  # Raw env list appended to the templated entries above. Useful for
  # LANTERN_MCP_LOG_LEVEL or any future knob.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
