# Default values for lantern.
# Tier-A HA topology: 3-replica StatefulSet + headless Service + PDB.
# Per RFC #175 D7. Set replicaCount=1 to fall back to single-instance
# mode (no peer pump, no readiness gating).

image:
  repository: ghcr.io/anaregdesign/lantern
  tag: ""        # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Number of lantern pods. 3 is the recommended Tier-A default.
# Use 1 for single-instance / dev (peer pump becomes a no-op when only
# the local pod resolves).
replicaCount: 3

# StatefulSet update strategy. RollingUpdate is required for the PDB
# minAvailable guarantee to hold during upgrades.
updateStrategy:
  type: RollingUpdate

# PodDisruptionBudget for voluntary disruption (node drains, upgrades).
# minAvailable: 2 keeps quorum-style availability with 3 replicas.
# Set enabled: false for single-instance deployments.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

service:
  # ClusterIP service exposes the Lantern wire port to clients
  # (Connect / gRPC / gRPC-Web multiplexed on h2c).
  port: 6380
  # Headless service drives DNS-based peer discovery (#190).
  # No ClusterIP — DNS returns one A per ready pod.
  headlessName: ""   # default: <fullname>-headless
  type: ClusterIP
  annotations: {}

# Metrics endpoint (Prometheus /metrics + /healthz + /readyz).
metrics:
  port: 9090
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Replication / peer discovery. See docs/replication.md §9.1.
replication:
  discovery:
    mode: dns                   # static | dns
    # DNS hostname the pump resolves to peer IPs. Empty => template
    # auto-fills with the headless Service FQDN.
    dnsName: ""
    defaultPort: "6380"         # appended to each resolved IP
    intervalMs: 10000           # 0 = resolve once at startup
  # Static fallback list, used when discovery.mode == "static".
  peers: []
  # Cap per-(peer,origin) replication lag before readiness flips false.
  maxLag: 10000

# Anti-entropy settings (background reconciliation). See #186.
antiEntropy:
  intervalMs: 30000
  subscribeTimeoutMs: 30000

# Graph cache TTL defaults (seconds).
cache:
  defaultTtlSeconds: 3600

# Liveness/readiness probes.
probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

# Resource requests/limits.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Extra environment variables (raw env list, appended after the
# templated ones). Useful for TLS_* / RATE_LIMIT_* / LOG_* tweaks.
extraEnv: []

# Pod scheduling.
nodeSelector: {}
tolerations: []
affinity: {}

# Soft anti-affinity by default — schedule pods on different nodes
# when possible. Set to {} to disable.
defaultPodAntiAffinity: true

# Pod security.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

# Logging.
log:
  level: info
  format: json

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# Browser-facing admin SPA (lantern-admin). Disabled by default to
# preserve the existing install footprint; flip `admin.enabled=true`
# to render a Deployment + Service (and optionally an Ingress) for
# the SPA. The container is a pure Caddy SPA host — the browser
# calls the Lantern Service directly over Connect-Web, so the
# lantern server must allow the admin origin via
# `LANTERN_CORS_ALLOWED_ORIGINS` (set under `extraEnv` on the
# StatefulSet, or via the auto-derived value when
# `admin.ingress.enabled=true` — see admin-deployment.yaml).
#
# v1 ships **without** auth in front of the admin. Run it only on
# trusted networks or front it with your own ingress-level auth
# proxy.
admin:
  enabled: false

  image:
    repository: ghcr.io/anaregdesign/lantern-admin
    # Defaults to .Chart.AppVersion (same convention as the server
    # image); pin to a specific admin tag (e.g. "v0.1.1") in production.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  service:
    type: ClusterIP
    port: 8080
    annotations: {}

  ingress:
    enabled: false
    className: ""
    annotations: {}
    # When enabled, host MUST be set — the chart appends
    # `https://<host>` to LANTERN_CORS_ALLOWED_ORIGINS on the
    # StatefulSet so the browser preflight succeeds. Multiple hosts
    # are not supported in v1; copy admin-ingress.yaml if you need a
    # richer routing setup.
    host: ""
    tls: []
    #  - secretName: lantern-admin-tls
    #    hosts:
    #      - admin.example.com

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 128Mi

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false

  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Bring-your-own MCP sidecar (lantern-mcp). The chart does NOT render
# a Pod / Deployment for lantern-mcp on its own — MCP is a stdio
# protocol, so the canonical deployment shape is a sidecar inside the
# agent runtime's pod (Claude Desktop / VS Code Server / a custom
# worker). This `mcp:` block configures the named template
# `lantern.mcpSidecar` defined in templates/_mcp-sidecar.tpl, which
# external charts / manifests splice into their own Pod spec via:
#
#   containers:
#     - name: agent
#       ...
#     {{- include "lantern.mcpSidecar" . | nindent 4 }}
#
# See deploy/helm/lantern/README.md "MCP sidecar" for the full
# walkthrough and mcp/examples/ for the agent-runtime configs that
# already wire lantern-mcp end-to-end.
mcp:
  image:
    repository: ghcr.io/anaregdesign/lantern-mcp
    tag: ""        # defaults to .Chart.AppVersion; pin to mcp/vX.Y.Z in prod
    pullPolicy: IfNotPresent

  # Address the MCP container dials. Empty (default) lets the sidecar
  # template fall back to the chart's ClusterIP Service FQDN so the
  # sidecar talks to the in-cluster lantern automatically. Override
  # only when the sidecar runs in a different namespace / cluster.
  lanternAddr: ""

  # Startup health-check timeout for the MCP container's initial ping.
  pingTimeout: "5s"

  # Per-TTL-bucket override map. Each non-empty value is emitted as a
  # `LANTERN_MCP_TTL_<UPPER_BUCKET>` env var on the sidecar. See
  # mcp/internal/ttl/ for the canonical bucket list + defaults.
  ttl: {}
    # turn: "15m"
    # conversation: "2h"

  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

  # Raw env list appended to the templated entries above. Useful for
  # LANTERN_MCP_LOG_LEVEL or any future knob the sidecar template
  # hasn't been updated for yet.
  extraEnv: []
