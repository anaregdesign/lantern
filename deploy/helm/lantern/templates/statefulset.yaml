apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lantern.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lantern.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  minReadySeconds: {{ .Values.minReadySeconds }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "lantern.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lantern.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lantern.serviceAccountName" . }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else if .Values.defaultPodAntiAffinity }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "lantern.selectorLabels" . | nindent 20 }}
        {{- end }}
      containers:
        - name: lantern
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.drain.preStop }}
          # Optional k8s-native drain belt (#768): pause before SIGTERM so
          # kubelet/mesh deregistration settles. The server ALSO drains
          # itself for LANTERN_DRAIN_DELAY_SECONDS on SIGTERM, so this is
          # usually unnecessary; it needs /bin/sleep (present on the
          # alpine-based server image).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "{{ .Values.drain.delaySeconds }}"]
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          env:
            - name: LANTERN_PORT
              value: {{ .Values.service.port | quote }}
            - name: LANTERN_METRICS_ADDR
              value: {{ printf ":%v" .Values.metrics.port | quote }}
            - name: LANTERN_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: LANTERN_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.runtime.goMemoryLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            - name: LANTERN_DEFAULT_TTL_SECONDS
              value: {{ .Values.cache.defaultTtlSeconds | quote }}
            - name: LANTERN_PEER_DISCOVERY
              value: {{ .Values.replication.discovery.mode | quote }}
            {{- if eq .Values.replication.discovery.mode "dns" }}
            - name: LANTERN_PEER_DNS_NAME
              value: {{ include "lantern.discoveryDNSName" . | quote }}
            - name: LANTERN_PEER_DEFAULT_PORT
              value: {{ .Values.replication.discovery.defaultPort | quote }}
            - name: LANTERN_PEER_DISCOVERY_INTERVAL_MS
              value: {{ .Values.replication.discovery.intervalMs | quote }}
            {{- end }}
            {{- if and (eq .Values.replication.discovery.mode "static") .Values.replication.peers }}
            - name: LANTERN_PEERS
              value: {{ join "," .Values.replication.peers | quote }}
            {{- end }}
            - name: LANTERN_MAX_REPLICATION_LAG
              value: {{ .Values.replication.maxLag | quote }}
            - name: LANTERN_ANTI_ENTROPY_INTERVAL_MS
              value: {{ .Values.antiEntropy.intervalMs | quote }}
            - name: LANTERN_ANTI_ENTROPY_SUBSCRIBE_TIMEOUT_MS
              value: {{ .Values.antiEntropy.subscribeTimeoutMs | quote }}
            - name: LANTERN_DRAIN_DELAY_SECONDS
              value: {{ .Values.drain.delaySeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.backup.enabled }}
            - name: LANTERN_BACKUP_ENABLED
              value: "true"
            - name: LANTERN_BACKUP_DIR
              value: {{ .Values.backup.dir | quote }}
            - name: LANTERN_BACKUP_INTERVAL
              value: {{ .Values.backup.interval | quote }}
            - name: LANTERN_BACKUP_RETAIN
              value: {{ .Values.backup.retain | quote }}
            - name: LANTERN_BACKUP_RESTORE_ON_START
              value: {{ .Values.backup.restoreOnStart | quote }}
            - name: LANTERN_BACKUP_RESTORE_REQUIRED
              value: {{ .Values.backup.restoreRequired | quote }}
            # Stable per-pod token so each replica's dumps are distinct on a
            # shared volume (StatefulSet pod names are stable).
            - name: LANTERN_BACKUP_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.backup.enabled }}
          volumeMounts:
            - name: backup
              mountPath: {{ .Values.backup.dir }}
          {{- end }}
      {{- if and .Values.backup.enabled .Values.backup.persistence.existingClaim }}
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.existingClaim }}
      {{- end }}
  {{- if and .Values.backup.enabled .Values.backup.persistence.enabled (not .Values.backup.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: backup
      spec:
        accessModes:
          {{- toYaml .Values.backup.persistence.accessModes | nindent 10 }}
        {{- with .Values.backup.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.backup.persistence.size | quote }}
  {{- end }}
