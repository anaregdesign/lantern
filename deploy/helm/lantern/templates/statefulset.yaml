{{- include "lantern.validateSecurity" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "lantern.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "lantern.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  minReadySeconds: {{ .Values.minReadySeconds }}
  updateStrategy:
    type: {{ .Values.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "lantern.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lantern.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "lantern.serviceAccountName" . }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else if .Values.defaultPodAntiAffinity }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "lantern.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- if or .Values.publicTLS.existingSecret .Values.peerPlane.enabled (eq .Values.auth.mode "oidc") }}
      # Raw Secret projections are visible only to this trusted setup step.
      # The Server receives regular, owner-only files for its own workload.
      initContainers:
        - name: provision-workload-files
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: EXPECTED_UID
              value: {{ include "lantern.workloadUID" . | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              {{- include "lantern.provisionWorkloadFiles" . | nindent 14 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workload-files
              mountPath: /run/lantern-private
            {{- if .Values.publicTLS.existingSecret }}
            - name: public-tls
              mountPath: /run/lantern-source/public
              readOnly: true
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: security-files
              mountPath: /run/lantern-source/security
              readOnly: true
            {{- end }}
            {{- if .Values.peerPlane.enabled }}
            - name: peer-identity
              mountPath: /run/lantern-source/peers
              readOnly: true
            - name: peer-operator
              mountPath: /run/lantern-source/operator
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: lantern
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.drain.preStop }}
          # Optional k8s-native drain belt (#768): pause before SIGTERM so
          # kubelet/mesh deregistration settles. The server ALSO drains
          # itself for LANTERN_DRAIN_DELAY_SECONDS on SIGTERM, so this is
          # usually unnecessary; it needs /bin/sleep (present on the
          # alpine-based server image).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "{{ .Values.drain.delaySeconds }}"]
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.expose }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.peerPlane.enabled }}
            - name: peer
              containerPort: {{ .Values.peerPlane.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: LANTERN_PORT
              value: {{ .Values.service.port | quote }}
            - name: LANTERN_METRICS_ADDR
              value: {{ .Values.metrics.address | quote }}
            - name: LANTERN_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: LANTERN_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.runtime.goMemoryLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            - name: LANTERN_DEFAULT_TTL_SECONDS
              value: {{ .Values.cache.defaultTtlSeconds | quote }}
            - name: LANTERN_MAX_REPLICATION_LAG
              value: {{ .Values.replication.maxLag | quote }}
            - name: LANTERN_ANTI_ENTROPY_INTERVAL_MS
              value: {{ .Values.antiEntropy.intervalMs | quote }}
            - name: LANTERN_ANTI_ENTROPY_SUBSCRIBE_TIMEOUT_MS
              value: {{ .Values.antiEntropy.subscribeTimeoutMs | quote }}
            - name: LANTERN_DRAIN_DELAY_SECONDS
              value: {{ .Values.drain.delaySeconds | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.publicTLS.existingSecret }}
            - name: LANTERN_TLS_CERT_FILE
              value: /run/lantern-public/$(POD_NAME).crt
            - name: LANTERN_TLS_KEY_FILE
              value: /run/lantern-public/$(POD_NAME).key
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: LANTERN_AUTH_MODE
              value: oidc
            - name: LANTERN_SECURITY_NODE_ROLE
              value: {{ .Values.auth.nodeRole | quote }}
            - name: LANTERN_SECURITY_STORE_MODE
              value: {{ .Values.auth.storeMode | quote }}
            - name: LANTERN_SECURITY_STORE_PATH
              value: {{ printf "%s/sys.wal" .Values.runtimeState.dir | quote }}
            {{- end }}
            {{- if .Values.peerPlane.enabled }}
            - name: LANTERN_PEER_LISTEN_ADDR
              value: {{ printf ":%v" .Values.peerPlane.port | quote }}
            - name: LANTERN_PEER_DEPLOYMENT
              value: {{ .Values.peerPlane.deployment | quote }}
            - name: LANTERN_PEER_MEMBERSHIP_MODE
              value: {{ .Values.peerPlane.mode | quote }}
            - name: LANTERN_PEER_MEMBERSHIP_FILE
              value: /run/lantern-membership/manifest.json
            - name: LANTERN_PEER_MEMBERSHIP_STATE_FILE
              value: {{ printf "%s/membership.state" .Values.runtimeState.dir | quote }}
            - name: LANTERN_PEER_OPERATOR_PUBLIC_KEY_FILE
              value: /run/lantern-operator/operator.pub
            - name: LANTERN_PEER_WORKLOAD_ID
              value: {{ printf "%s/$(POD_NAME)" .Values.peerPlane.workloadIDPrefix | quote }}
            - name: LANTERN_PEER_CERT_FILE
              value: /run/lantern-peers/$(POD_NAME).crt
            - name: LANTERN_PEER_KEY_FILE
              value: /run/lantern-peers/$(POD_NAME).key
            - name: LANTERN_PEER_TRUST_CA_FILE
              value: /run/lantern-peers/ca.pem
            {{- end }}
            {{- if .Values.backup.enabled }}
            - name: LANTERN_BACKUP_ENABLED
              value: "true"
            - name: LANTERN_BACKUP_DIR
              value: {{ .Values.backup.dir | quote }}
            - name: LANTERN_BACKUP_INTERVAL
              value: {{ .Values.backup.interval | quote }}
            - name: LANTERN_BACKUP_RETAIN
              value: {{ .Values.backup.retain | quote }}
            - name: LANTERN_BACKUP_RESTORE_ON_START
              value: {{ .Values.backup.restoreOnStart | quote }}
            - name: LANTERN_BACKUP_RESTORE_REQUIRED
              value: {{ .Values.backup.restoreRequired | quote }}
            # Stable per-pod token so each replica's dumps are distinct on a
            # shared volume (StatefulSet pod names are stable).
            - name: LANTERN_BACKUP_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq .Values.auth.mode "oidc" }}
          envFrom:
            - configMapRef:
                name: {{ .Values.auth.configMap | quote }}
          {{- end }}
          startupProbe:
            exec:
              command: ["/usr/bin/wget", "-qO-", {{ printf "http://127.0.0.1:%v/healthz" .Values.metrics.port | quote }}]
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            exec:
              command: ["/usr/bin/wget", "-qO-", {{ printf "http://127.0.0.1:%v/healthz" .Values.metrics.port | quote }}]
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/usr/bin/wget", "-qO-", {{ printf "http://127.0.0.1:%v/readyz" .Values.metrics.port | quote }}]
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.probes.readiness.successThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.backup.enabled .Values.publicTLS.existingSecret .Values.peerPlane.enabled (eq .Values.auth.mode "oidc") }}
          volumeMounts:
            {{- if .Values.backup.enabled }}
            - name: backup
              mountPath: {{ .Values.backup.dir }}
            {{- end }}
            {{- if .Values.publicTLS.existingSecret }}
            - name: workload-files
              mountPath: /run/lantern-public
              subPath: public
              readOnly: true
            {{- end }}
            {{- if or .Values.peerPlane.enabled (eq .Values.auth.mode "oidc") }}
            - name: runtime-state
              mountPath: {{ .Values.runtimeState.dir }}
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: workload-files
              mountPath: /run/lantern-security
              subPath: security
              readOnly: true
            {{- end }}
            {{- if .Values.peerPlane.enabled }}
            - name: workload-files
              mountPath: /run/lantern-peers
              subPath: peers
              readOnly: true
            - name: peer-membership
              mountPath: /run/lantern-membership
              readOnly: true
            - name: workload-files
              mountPath: /run/lantern-operator
              subPath: operator
              readOnly: true
            {{- end }}
          {{- end }}
      volumes:
        {{- if or .Values.publicTLS.existingSecret .Values.peerPlane.enabled (eq .Values.auth.mode "oidc") }}
        - name: workload-files
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- if and .Values.backup.enabled .Values.backup.persistence.existingClaim }}
        - name: backup
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.publicTLS.existingSecret }}
        - name: public-tls
          secret:
            secretName: {{ .Values.publicTLS.existingSecret | quote }}
        {{- end }}
        {{- if eq .Values.auth.mode "oidc" }}
        - name: security-files
          secret:
            secretName: {{ .Values.auth.existingSecret | quote }}
        {{- end }}
        {{- if .Values.peerPlane.enabled }}
        - name: peer-identity
          secret:
            secretName: {{ .Values.peerPlane.identitySecret | quote }}
        - name: peer-membership
          configMap:
            name: {{ .Values.peerPlane.membershipConfigMap | quote }}
        - name: peer-operator
          secret:
            secretName: {{ .Values.peerPlane.operatorKeySecret | quote }}
        {{- end }}
        {{- if and (or .Values.peerPlane.enabled (eq .Values.auth.mode "oidc")) .Values.runtimeState.persistence.existingClaim }}
        - name: runtime-state
          persistentVolumeClaim:
            claimName: {{ .Values.runtimeState.persistence.existingClaim | quote }}
        {{- end }}
  {{- if or (and .Values.backup.enabled .Values.backup.persistence.enabled (not .Values.backup.persistence.existingClaim)) (and (or .Values.peerPlane.enabled (eq .Values.auth.mode "oidc")) (not .Values.runtimeState.persistence.existingClaim)) }}
  volumeClaimTemplates:
    {{- if and .Values.backup.enabled .Values.backup.persistence.enabled (not .Values.backup.persistence.existingClaim) }}
    - metadata:
        name: backup
      spec:
        accessModes:
          {{- toYaml .Values.backup.persistence.accessModes | nindent 10 }}
        {{- with .Values.backup.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.backup.persistence.size | quote }}
  {{- end }}
    {{- if and (or .Values.peerPlane.enabled (eq .Values.auth.mode "oidc")) (not .Values.runtimeState.persistence.existingClaim) }}
    - metadata:
        name: runtime-state
      spec:
        accessModes:
          {{- toYaml .Values.runtimeState.persistence.accessModes | nindent 10 }}
        {{- with .Values.runtimeState.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.runtimeState.persistence.size | quote }}
    {{- end }}
  {{- end }}
