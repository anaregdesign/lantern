apiVersion: v1
kind: Service
metadata:
  name: {{ include "lantern.headlessName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
    lantern.anaregdesign.io/role: peer-discovery
spec:
  clusterIP: None
  # Stable names locate signed private origins, including bootstrapping pods.
  # Discovery never grants admission; the public Service remains readiness gated.
  publishNotReadyAddresses: true
  selector:
    {{- include "lantern.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.peerPlane.enabled }}
    - name: peer
      port: {{ .Values.peerPlane.port }}
      targetPort: peer
      protocol: TCP
    {{- else }}
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lantern.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lantern.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "lantern.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
    {{- if .Values.metrics.expose }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
