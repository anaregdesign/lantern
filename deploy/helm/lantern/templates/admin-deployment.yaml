{{- if .Values.admin.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lantern.adminFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lantern.adminLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.admin.replicaCount }}
  selector:
    matchLabels:
      {{- include "lantern.adminSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lantern.adminSelectorLabels" . | nindent 8 }}
        {{- with .Values.admin.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.admin.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.admin.podSecurityContext | nindent 8 }}
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: "{{ .Values.admin.image.repository }}:{{ .Values.admin.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.admin.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.admin.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          {{- if or .Values.admin.prometheus.upstream .Values.admin.extraEnv }}
          env:
            {{- if .Values.admin.prometheus.upstream }}
            # Enables the same-origin Prometheus reverse proxy. The
            # container entrypoint turns this into a Caddy
            # `handle_path /api/prom/*` reverse_proxy snippet.
            - name: LANTERN_ADMIN_PROMETHEUS_UPSTREAM
              value: {{ .Values.admin.prometheus.upstream | quote }}
            {{- end }}
            {{- with .Values.admin.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.admin.prometheus.upstream }}
          # Writable conf.d so the non-root container can drop the
          # generated Prometheus proxy snippet even when the root
          # filesystem is read-only.
          volumeMounts:
            - name: caddy-conf-d
              mountPath: /etc/caddy/conf.d
          {{- end }}
      {{- if .Values.admin.prometheus.upstream }}
      volumes:
        - name: caddy-conf-d
          emptyDir: {}
      {{- end }}
{{- end }}
