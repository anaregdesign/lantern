[package]
name = "lantern-client"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native Rust client for the Lantern graph KVS"
repository = "https://github.com/anaregdesign/lantern"
homepage = "https://github.com/anaregdesign/lantern"
readme = "README.md"
keywords = ["lantern", "graph", "grpc", "database"]
categories = ["database", "network-programming"]
include = ["Cargo.toml", "LICENSE", "README.md", "RELEASING.md", "CHANGELOG.md", "src/**", "examples/**"]

[workspace]
members = ["xtask"]
resolver = "3"

[features]
default = []
bundled-roots = ["tonic/tls-webpki-roots"]

[dependencies]
base64 = "=0.22.1"
bytes = "=1.12.1"
fastrand = "=2.5.0"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
http = "=1.5.0"
prost = "=0.14.4"
prost-types = "=0.14.4"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "=1.15.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "1", features = ["io-util", "time"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"] }
tonic-health = "=0.14.6"
tonic-prost = "=0.14.6"
tonic-types = "=0.14.6"

[dev-dependencies]
rcgen = "=0.13.2"
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
