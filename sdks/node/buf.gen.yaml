version: v2
managed:
  enabled: true
plugins:
  # protobuf-es v2 codegen — emits message classes AND service schema
  # descriptors in a single output. Consumed by `src/client.ts` via
  # `createClient(LanternService, transport)`. Local plugin (not the
  # remote bufbuild/es plugin) so the version tracks the
  # @bufbuild/protobuf runtime pinned in package.json.
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: ../../proto
