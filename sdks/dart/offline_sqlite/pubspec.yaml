publish_to: none
repository: https://github.com/anaregdesign/lantern

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  lantern_client_offline:
    path: ../offline
  path: 1.9.1
  sqflite: 2.4.4
