version: 2
updates:
  # gomod — one entry per Go module in the workspace (6 total).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"
          - "google.golang.org/genproto*"
      x-deps:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      x-deps:
        patterns:
          - "golang.org/x/*"

  - package-ecosystem: gomod
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mcp-sdk:
        patterns:
          - "github.com/modelcontextprotocol/*"
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"

  - package-ecosystem: gomod
    directory: /pb
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"
          - "google.golang.org/genproto*"

  - package-ecosystem: gomod
    directory: /sdks/go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"
          - "google.golang.org/genproto*"
      otel:
        patterns:
          - "go.opentelemetry.io/*"

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      grpc-protobuf:
        patterns:
          - "google.golang.org/grpc*"
          - "google.golang.org/protobuf*"
          - "google.golang.org/genproto*"
      x-deps:
        patterns:
          - "golang.org/x/*"
      otel:
        patterns:
          - "go.opentelemetry.io/*"
      prometheus:
        patterns:
          - "github.com/prometheus/*"

  # Pub updates remain PR-reviewed. Major runtime bumps are intentionally
  # blocked because Connect-Dart 1.x requires Protobuf 4.x; generator/runtime
  # compatibility is released as one coordinated change.
  - package-ecosystem: pub
    directory: /sdks/dart
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dart-runtime:
        patterns:
          - connectrpc
          - fixnum
          - protobuf
      dart-dev:
        dependency-type: development
    ignore:
      - dependency-name: connectrpc
        update-types: ["version-update:semver-major"]
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /sdks/dart/example
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # docker — one entry per Dockerfile (2 total).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
