version: 2
updates:
  # One weekly version PR per dependency used by compatible workspace modules.
  - package-ecosystem: gomod
    directories: ["/", "/core", "/mcp", "/pb", "/sdks/go", "/server"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      workspace-dependency:
        applies-to: version-updates
        patterns: ["*"]
        group-by: dependency-name

  # Pub updates remain PR-reviewed. Major runtime bumps are intentionally
  # blocked because Connect-Dart 1.x requires Protobuf 4.x; generator/runtime
  # compatibility is released as one coordinated change.
  - package-ecosystem: pub
    directory: /sdks/dart
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dart-runtime:
        patterns:
          - connectrpc
          - fixnum
          - protobuf
      dart-dev:
        dependency-type: development
    ignore:
      - dependency-name: connectrpc
        update-types: ["version-update:semver-major"]
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /sdks/dart/example
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # docker — one entry per Dockerfile (2 total).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
