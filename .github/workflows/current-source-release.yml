name: Configured source integration release preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify:
    uses: ./.github/workflows/current-sdk4.yml
    with:
      proof_kind: configured-source-integration
  verify:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: ${{ runner.temp }}/current-sdk4-configured-source-integration
      - name: Require exact release source and normal-build configured-source-integration receipt
        env:
          CONFIGURED_SOURCE_INTEGRATION_RECEIPT_SHA256: ${{ needs.qualify.outputs.receipt_sha256 }}
        run: python3 -B .github/scripts/current_sdk4_gate.py verify --expected-head "$GITHUB_SHA" --proof-kind configured-source-integration --trusted-receipt-sha256 "$CONFIGURED_SOURCE_INTEGRATION_RECEIPT_SHA256" --evidence "$RUNNER_TEMP/current-sdk4-configured-source-integration"
