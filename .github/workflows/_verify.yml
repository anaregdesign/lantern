# Reusable verify gate — gofmt + vet + build + test across every Go
# module in the workspace. Called from publish workflows so a bad tag
# can't ship a broken release.
#
# Previously docker-publish.yml, mcp-publish.yml, and sdks-go-publish.yml
# each maintained their own ad-hoc `verify` job; the bodies drifted over
# time and only mcp-publish actually covered more than one module. This
# workflow is now the full-workspace gate for Root/MCP publishing. The Go SDK
# keeps its artifact-specific isolated verifier and normal authority proof.
#
# Refs #295 (dev-flow improvements backlog).
#
# `go.yml` Build & Test intentionally still owns its own loop because it
# also runs coverage + artifact upload and the job name is a branch-
# protection required check — folding it in would risk renaming the
# required check.

name: Verify (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  configured-source-integration:
    uses: ./.github/workflows/current-source-release.yml
  verify:
    name: Verify (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: nonserver
            modules: '. core mcp pb sdks/go'
          - group: server
            modules: 'server'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Each go.mod needs its own ./...; isolate server from the other
      # modules without sharing one job's timeout. Stream JSON directly to
      # the job log so completed events remain visible after a hard timeout.
      - name: Vet / build / test (selected modules)
        env:
          MODULES: ${{ matrix.modules }}
        run: |
          set -e
          read -r -a modules <<< "$MODULES"
          for mod in "${modules[@]}"; do
            echo "::group::$mod"
            (cd "$mod" && go vet ./... && go build -v ./... && go test -race -shuffle=on -json ./...)
            echo "::endgroup::"
          done
