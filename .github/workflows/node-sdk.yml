name: Node SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/node/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'core/search/**'
      - 'core/graphcache/**'
      - 'server/**'
      - 'testdata/search/**'
      - '.github/workflows/node-sdk.yml'
    tags:
      - 'sdks/node/v*'
  pull_request:
    paths:
      - 'sdks/node/**'
      - 'proto/**'
      - 'buf.yaml'
      - 'core/search/**'
      - 'core/graphcache/**'
      - 'server/**'
      - 'testdata/search/**'
      - '.github/workflows/node-sdk.yml'

defaults:
  run:
    working-directory: sdks/node

# Least-privilege default: the test job only needs to read repo contents
# (checkout, codegen, lint, build, test). It does not write to PRs,
# packages, deployments, or attestations. The publish job overrides this
# with the additional `id-token: write` needed for npm Trusted Publishing
# (OIDC). Mirrors the pattern PR #328 applied to admin.yml (#329).
permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start production conformance servers
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_PORT=6380 LANTERN_METRICS_ADDR=:9090 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-node-enabled.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          env LANTERN_PORT=6381 LANTERN_METRICS_ADDR=:9091 LANTERN_SEARCH_ENABLED=false \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-node-disabled.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          env LANTERN_PORT=6382 LANTERN_METRICS_ADDR=:9092 LANTERN_SEARCH_POSITIONS=false \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-node-positions.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          env LANTERN_PORT=6383 LANTERN_METRICS_ADDR=:9093 LANTERN_SEARCH_MAX_QUERY_BYTES=4 \
            LANTERN_SEARCH_MAX_QUERY_TERMS=4 LANTERN_MUTATION_LOG_CAPACITY=2 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-node-budget.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          env LANTERN_PORT=6384 LANTERN_METRICS_ADDR=:9094 \
            LANTERN_AUTH_TOKENS=node-receipt-test-token \
            LANTERN_RECEIPT_WAL_MODE=fresh \
            LANTERN_RECEIPT_WAL_PATH="$RUNNER_TEMP/lantern-node-receipt-a.wal" \
            LANTERN_RECEIPT_EPOCH=42424242424242424242424242424242 \
            LANTERN_RECEIPT_RETENTION=2h LANTERN_RECEIPT_MAX_ENTRIES=4096 \
            LANTERN_RECEIPT_MAX_BYTES=16777216 \
            LANTERN_NODE_ID=31313131313131313131313131313131 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-node-receipt-a.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          env LANTERN_PORT=6385 LANTERN_METRICS_ADDR=:9095 \
            LANTERN_AUTH_TOKENS=node-receipt-test-token \
            LANTERN_RECEIPT_WAL_MODE=fresh \
            LANTERN_RECEIPT_WAL_PATH="$RUNNER_TEMP/lantern-node-receipt-b.wal" \
            LANTERN_RECEIPT_EPOCH=42424242424242424242424242424242 \
            LANTERN_RECEIPT_RETENTION=2h LANTERN_RECEIPT_MAX_ENTRIES=4096 \
            LANTERN_RECEIPT_MAX_BYTES=16777216 \
            LANTERN_NODE_ID=32323232323232323232323232323232 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-node-receipt-b.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          for attempt in $(seq 1 60); do
            ready=true
            for port in 6380 6381 6382 6383 6384 6385; do
              curl --fail --silent --show-error --max-time 2 \
                -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
                --data '{}' "http://127.0.0.1:$port/grpc.health.v1.Health/Check" >/dev/null || ready=false
            done
            $ready && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP"/lantern-node-*.log
          exit 1
      - name: Start test-only NaN receipt codec fixture
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern-node-nan-fixture" ./sdks/node/testdata/receiptfixture
          env LANTERN_NODE_RECEIPT_TOKEN=node-receipt-test-token \
            LANTERN_NODE_NAN_FIXTURE_PORT=6386 \
            "$RUNNER_TEMP/lantern-node-nan-fixture" > "$RUNNER_TEMP/lantern-node-nan-fixture.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-node.pids"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 2 \
              -H 'Authorization: Bearer node-receipt-test-token' \
              -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
              --data '{}' "http://127.0.0.1:6386/graph.v1.LanternService/GetReceiptCapability" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/lantern-node-nan-fixture.log"
          exit 1
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pin so a fresh bun release can't silently break CI. Dependabot's
          # github-actions ecosystem will bump this via PR (#295).
          bun-version: 1.3.14
      - name: Setup buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.70.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify codegen is up to date
        run: |
          bun run codegen
          if [ -n "$(git status --porcelain -- src/gen)" ]; then
            echo "::error::Generated stubs are out of date. Run 'sdks/node/scripts/codegen.sh' and commit."
            git status --short -- src/gen
            git diff -- src/gen
            exit 1
          fi
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Typecheck maintained example
        run: bun run example:typecheck
      - name: Build
        run: bun run build
      # Connect-Node h2c runs under the supported Node runtime; Bun owns the
      # browser Connect-Web coverage in the following step.
      - name: Test authenticated Node h2c receipts
        run: bun run test:real-wire
        env:
          LANTERN_NODE_RECEIPT_ENDPOINT: http://127.0.0.1:6384
          LANTERN_NODE_RECEIPT_OTHER_ENDPOINT: http://127.0.0.1:6385
          LANTERN_NODE_NAN_FIXTURE_ENDPOINT: http://127.0.0.1:6386
          LANTERN_NODE_RECEIPT_TOKEN: node-receipt-test-token
      - name: Test Bun suite
        run: bun test
        env:
          LANTERN_NODE_REAL_WIRE_ENDPOINT: http://127.0.0.1:6380
          LANTERN_NODE_SEARCH_DISABLED_ENDPOINT: http://127.0.0.1:6381
          LANTERN_NODE_SEARCH_POSITIONS_DISABLED_ENDPOINT: http://127.0.0.1:6382
          LANTERN_NODE_SEARCH_BUDGET_ENDPOINT: http://127.0.0.1:6383
          LANTERN_NODE_IDENTITY_GAP_ENDPOINT: http://127.0.0.1:6383
          LANTERN_NODE_RECEIPT_ENDPOINT: http://127.0.0.1:6384
          LANTERN_NODE_RECEIPT_OTHER_ENDPOINT: http://127.0.0.1:6385
          LANTERN_NODE_NAN_FIXTURE_ENDPOINT: http://127.0.0.1:6386
          LANTERN_NODE_RECEIPT_TOKEN: node-receipt-test-token
      - name: Verify npm pack candidate
        run: bun run verify:package

      - name: Stop conformance servers and receipt codec fixture
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/lantern-node.pids" ]; then
            xargs kill < "$RUNNER_TEMP/lantern-node.pids" || true
          fi

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/sdks/node/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/lantern-sdk
    permissions:
      contents: read
      id-token: write  # for npm Trusted Publishing (OIDC) + Sigstore provenance
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@latest
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # See note in test job above (#295).
          bun-version: 1.3.14
      - name: Setup buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: '1.70.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Codegen
        run: bun run codegen
      - name: Build
        run: bun run build
      - name: Verify npm pack candidate
        run: bun run verify:package
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public
        # No NODE_AUTH_TOKEN: npm CLI exchanges the GitHub OIDC token for a
        # short-lived publish token via the trusted-publisher binding on
        # npmjs.com. Provenance is attached automatically when publishing
        # via OIDC.
