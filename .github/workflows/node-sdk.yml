name: Node SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/node/**'
      - 'proto/**'
      - 'buf.yaml'
      - '.github/workflows/node-sdk.yml'
    tags:
      - 'sdks/node/v*'
  pull_request:
    paths:
      - 'sdks/node/**'
      - 'proto/**'
      - 'buf.yaml'
      - '.github/workflows/node-sdk.yml'

defaults:
  run:
    working-directory: sdks/node

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin so a fresh bun release can't silently break CI. Dependabot's
          # github-actions ecosystem will bump this via PR (#295).
          bun-version: 1.3.14
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.70.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify codegen is up to date
        run: |
          bun run codegen
          if ! git diff --quiet -- src/generated; then
            echo "::error::Generated stubs are out of date. Run 'sdks/node/scripts/codegen.sh' and commit."
            git diff -- src/generated
            exit 1
          fi
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build

  publish:
    name: Publish to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/sdks/node/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/lantern-sdk
    permissions:
      contents: read
      id-token: write  # for npm Trusted Publishing (OIDC) + Sigstore provenance
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (Trusted Publishing requires >= 11.5.1)
        run: npm install -g npm@latest
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # See note in test job above (#295).
          bun-version: 1.3.14
      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.70.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Codegen
        run: bun run codegen
      - name: Build
        run: bun run build
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public
        # No NODE_AUTH_TOKEN: npm CLI exchanges the GitHub OIDC token for a
        # short-lived publish token via the trusted-publisher binding on
        # npmjs.com. Provenance is attached automatically when publishing
        # via OIDC.
