# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Per-module loop. Each module is a separate go.mod; the root `./...`
      # does NOT recurse into core/, mcp/, pb/, sdks/go/, server/.
      - name: Vet (all modules)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            echo "::group::go vet ($mod)"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done

      - name: Build (all modules)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            echo "::group::go build ($mod)"
            (cd "$mod" && go build -v ./...)
            echo "::endgroup::"
          done

      - name: Test (race + coverage, all modules)
        run: |
          set -e
          mkdir -p coverage
          for mod in . core mcp pb sdks/go server; do
            # Slug for coverage filename: '.' -> root, 'sdks/go' -> sdks-go.
            slug=$(echo "$mod" | sed 's|/|-|g; s|^\.$|root|')
            echo "::group::go test ($mod)"
            (cd "$mod" && go test -race -shuffle=on -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/coverage/${slug}.out" ./...)
            echo "::endgroup::"
          done
          # Keep the legacy artifact path so downstream tooling that expects
          # coverage.out at the repo root keeps working.
          cp coverage/root.out coverage.out

      # Merge the six per-module coverage profiles into a single workspace-wide
      # profile. `go test -coverprofile` only sees one module's packages, so
      # merging is the only way to get a unified view across the workspace.
      # gocovmerge is the standard tool — see https://github.com/wadey/gocovmerge.
      # Refs #295.
      - name: Merge per-module coverage
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage/*.out > coverage/merged.out
          echo "Merged coverage line count:"
          wc -l coverage/merged.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage/
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a concrete release so a fresh golangci-lint can't silently
          # break CI. Dependabot's github-actions ecosystem will bump this
          # via PR (#295).
          version: v2.12.2
          args: --timeout=5m

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf format
        run: buf format -d --exit-code
      - name: buf lint
        run: buf lint
      - name: Generated code is up to date (wire + buf)
        env:
          GOWORK: 'off'
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::generated files are stale; run 'go generate ./...' and commit the result"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck (all modules)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            echo "::group::govulncheck ($mod)"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done
