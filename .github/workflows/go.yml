# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # Per-module loop. Each module is a separate go.mod; the root `./...`
      # does NOT recurse into core/, mcp/, pb/, sdks/go/, server/.
      - name: Vet (all modules)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            echo "::group::go vet ($mod)"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done

      - name: Build (all modules)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            echo "::group::go build ($mod)"
            (cd "$mod" && go build -v ./...)
            echo "::endgroup::"
          done

      - name: Test (race + coverage, all modules)
        run: |
          set -e
          mkdir -p coverage
          for mod in . core mcp pb sdks/go server; do
            # Slug for coverage filename: '.' -> root, 'sdks/go' -> sdks-go.
            slug=$(echo "$mod" | sed 's|/|-|g; s|^\.$|root|')
            echo "::group::go test ($mod)"
            (cd "$mod" && go test -race -shuffle=on -covermode=atomic -coverprofile="$GITHUB_WORKSPACE/coverage/${slug}.out" ./...)
            echo "::endgroup::"
          done
          # Keep the legacy artifact path so downstream tooling that expects
          # coverage.out at the repo root keeps working.
          cp coverage/root.out coverage.out

      # Merge the six per-module coverage profiles into a single workspace-wide
      # profile. `go test -coverprofile` only sees one module's packages, so
      # merging is the only way to get a unified view across the workspace.
      # gocovmerge is the standard tool — see https://github.com/wadey/gocovmerge.
      # Refs #295.
      - name: Merge per-module coverage
        run: |
          go install github.com/wadey/gocovmerge@latest
          gocovmerge coverage/*.out > coverage/merged.out
          echo "Merged coverage line count:"
          wc -l coverage/merged.out

      # Ratchet coverage gate. Each per-module floor sits just below that
      # module's current measured baseline (documented in CONTRIBUTING.md ->
      # "Coverage floor"); a PR that drops a module below its floor fails the
      # build. Raise the floor in the same PR whenever coverage rises durably so
      # the ratchet only moves up. Module totals vary widely (generated pb and
      # the CLI sit far below core/mcp), so a single workspace number would let a
      # regression in a well-tested module hide behind the large low-coverage
      # denominator -- hence per-module floors over the merged total. Reuses the
      # per-module profiles from the test step; no extra dependency. Refs #717.
      - name: Enforce coverage floors
        run: |
          set -euo pipefail
          # slug:floor% -- keep in sync with CONTRIBUTING.md "Coverage floor".
          floors="root:31 core:84 mcp:84 pb:5 sdks-go:37 server:52"
          fail=0
          for entry in $floors; do
            slug=${entry%%:*}
            floor=${entry##*:}
            prof="coverage/${slug}.out"
            if [ ! -f "$prof" ]; then
              echo "::error::coverage profile $prof is missing"
              fail=1
              continue
            fi
            total=$(go tool cover -func="$prof" | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
            if awk -v t="$total" -v f="$floor" 'BEGIN { exit !(t+0 < f+0) }'; then
              echo "::error::coverage for '$slug' is ${total}%, below floor ${floor}%"
              fail=1
            else
              echo "ok: ${slug} ${total}% >= ${floor}%"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::coverage floor gate failed; raise coverage or, if this is a deliberate baseline change, adjust the floor + CONTRIBUTING.md"
            exit 1
          fi

      # `if: always()` so the artifact survives a failing floor gate (or a test
      # failure that still produced partial profiles) -- it is the primary
      # debugging aid when the gate trips.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage/
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a concrete release so a fresh golangci-lint can't silently
          # break CI. Dependabot's github-actions ecosystem will bump this
          # via PR (#295).
          version: v2.12.2
          args: --timeout=5m

  proto:
    name: Proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: buf format
        run: buf format -d --exit-code
      - name: buf lint
        run: buf lint
      - name: Generated code is up to date (wire + buf)
        env:
          GOWORK: 'off'
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "::error::generated files are stale; run 'go generate ./...' and commit the result"
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Install govulncheck
        # Pinned to v1.3.0: govulncheck@latest (v1.4.0) builds against
        # golang.org/x/tools v0.46.0, which panics with
        # "ForEachElement called on type containing *types.TypeParam" while
        # analysing the generics in core/ and server/ (verified locally:
        # v1.4.0 panics, v1.3.0 is clean on all six modules). Re-float to
        # @latest once a fixed x/tools ships.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
      - name: Run govulncheck (all modules)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            echo "::group::govulncheck ($mod)"
            (cd "$mod" && govulncheck ./...)
            echo "::endgroup::"
          done

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      # Active-mutation smoke run for every `func Fuzz*` target. The Build &
      # Test job already replays the committed seed corpora under -race (Go
      # runs FuzzXxx as ordinary tests when -fuzz is absent); this job adds a
      # short bout of real mutation per target so malformed-input regressions
      # surface on PRs. A crash writes a reproducer under the package's
      # testdata/fuzz/ and fails the job. Per-module + per-target because
      # `-fuzz` only accepts a single target in a single package. Refs #714.
      - name: Fuzz each target (per module)
        run: |
          set -e
          for mod in . core mcp pb sdks/go server; do
            (cd "$mod"
             dirs=$(grep -rl --include='*_test.go' --exclude-dir=node_modules -e 'func Fuzz' . 2>/dev/null \
               | xargs -r -n1 dirname | sort -u)
             for d in $dirs; do
               pkg=$(go list "$d" 2>/dev/null) || continue
               for t in $(go test -list='^Fuzz' "$pkg" 2>/dev/null | grep '^Fuzz' || true); do
                 echo "::group::fuzz ${pkg} ${t}"
                 go test -run='^$' -fuzz="^${t}$" -fuzztime=20s "$pkg"
                 echo "::endgroup::"
               done
             done)
          done
