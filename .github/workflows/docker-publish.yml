name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the canonical CI gates on the tagged commit. Tag pushes do not
  # trigger the `Go` workflow (which is gated on branch pushes / PRs), so
  # without this we could ship a broken image from a bad tag. The verify
  # job is shared with mcp-publish.yml / sdks-go-publish.yml via the
  # reusable `_verify.yml` workflow — see #295.
  verify:
    uses: ./.github/workflows/_verify.yml

  search-qualification:
    name: Search release qualification
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Set up Go
        id: setup-go
        continue-on-error: true
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Verify checked-out tag SHA
        id: tag-sha
        continue-on-error: true
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Qualify request-boundary decisions
        id: request-boundary
        continue-on-error: true
        run: |
          go test ./server/service -run 'TestSearchVertices_(PhraseWithoutPositionsFailsClosed|RejectsInvalidOptionsBeforeBackend|AcceptsOptionsDecisionTable)$'

      - name: Qualify production wire semantics
        id: wire-semantics
        continue-on-error: true
        run: |
          go test ./tests/integration -run 'TestSearchVertices_(OptionsContract|ProductionStructuredFieldsOverRealH2C|LifecycleConvergenceOverProductionComposition|PositionsOff)$'

      - name: Qualify HA Search convergence
        id: ha-convergence
        continue-on-error: true
        run: |
          go test ./tests/integration -run 'Test(PeerPump_SearchPartitionHealConvergence|AntiEntropy_GappedLogRebuildsExactSearchIndex)$'

      - name: Install bench prerequisites
        id: bench-prerequisites
        continue-on-error: true
        run: |
          set -euo pipefail
          GHZ_VERSION="0.121.0"
          curl -fsSL -o /tmp/ghz.tgz \
            "https://github.com/bojand/ghz/releases/download/v${GHZ_VERSION}/ghz-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/ghz.tgz -C /usr/local/bin ghz
          sudo chmod +x /usr/local/bin/ghz
          YQ_VERSION="v4.45.4"
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          ghz --version
          yq --version

      - name: Build tagged lantern:local image
        id: qualification-image
        continue-on-error: true
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t lantern:local .

      - name: Run short Search qualification scenario
        id: qualification-scenario
        continue-on-error: true
        env:
          COMPOSE_PROJECT_NAME: lantern-search-qualification
          LANTERN_IMAGE: lantern:local
          LEAK_GATE_ONLY: "1"
        run: ./testbed/bench/run.sh search_qualification

      - name: Record qualification stages
        if: always()
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_GO: ${{ steps.setup-go.outcome }}
          TAG_SHA: ${{ steps.tag-sha.outcome }}
          REQUEST_BOUNDARY: ${{ steps.request-boundary.outcome }}
          WIRE_SEMANTICS: ${{ steps.wire-semantics.outcome }}
          HA_CONVERGENCE: ${{ steps.ha-convergence.outcome }}
          BENCH_PREREQUISITES: ${{ steps.bench-prerequisites.outcome }}
          QUALIFICATION_IMAGE: ${{ steps.qualification-image.outcome }}
          QUALIFICATION_SCENARIO: ${{ steps.qualification-scenario.outcome }}
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg sha "$GITHUB_SHA" \
            --arg checkout "$CHECKOUT" \
            --arg setup_go "$SETUP_GO" \
            --arg tag_sha "$TAG_SHA" \
            --arg request_boundary "$REQUEST_BOUNDARY" \
            --arg wire_semantics "$WIRE_SEMANTICS" \
            --arg ha_convergence "$HA_CONVERGENCE" \
            --arg bench_prerequisites "$BENCH_PREREQUISITES" \
            --arg qualification_image "$QUALIFICATION_IMAGE" \
            --arg qualification_scenario "$QUALIFICATION_SCENARIO" '
              def status($outcome):
                if $outcome == "success" then "pass"
                elif $outcome == "skipped" then "skipped"
                else "fail"
                end;
              [
                {name:"checkout", status:status($checkout)},
                {name:"setup_go", status:status($setup_go)},
                {name:"verify_tag_sha", status:status($tag_sha)},
                {name:"request_boundary", status:status($request_boundary)},
                {name:"production_wire_semantics", status:status($wire_semantics)},
                {name:"ha_search_convergence", status:status($ha_convergence)},
                {name:"bench_prerequisites", status:status($bench_prerequisites)},
                {name:"build_tagged_image", status:status($qualification_image)},
                {name:"search_qualification_scenario", status:status($qualification_scenario)}
              ] as $stages |
              [{name:"search_qualification", status:status($qualification_scenario)}] as $scenarios |
              {
                tag:$tag,
                commit_sha:$sha,
                stages:$stages,
                scenarios:$scenarios,
                verdict:(if all($stages[]; .status == "pass") then "pass" else "fail" end)
              }
            ' > qualification-report.json
          {
            echo '# Search release qualification'
            echo
            echo "- Tag: \`$GITHUB_REF_NAME\`"
            echo "- Commit SHA: \`$GITHUB_SHA\`"
            echo "- Verdict: \`$(jq -r .verdict qualification-report.json)\`"
            echo
            echo '| stage | status |'
            echo '| --- | --- |'
            jq -r '.stages[] | "| `\(.name)` | `\(.status)` |"' qualification-report.json
            echo
            echo '| scenario | status |'
            echo '| --- | --- |'
            jq -r '.scenarios[] | "| `\(.name)` | `\(.status)` |"' qualification-report.json
          } > qualification-report.md
          scenario_report="$(find testbed/bench/out/search_qualification -name report.md -type f 2>/dev/null | sort | tail -1 || true)"
          if [[ -n "$scenario_report" ]]; then
            cp "$scenario_report" qualification-scenario-report.md
          fi

      - name: Upload Search qualification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: search-qualification-${{ github.sha }}
          path: |
            qualification-report.json
            qualification-report.md
            qualification-scenario-report.md
            testbed/bench/out/search_qualification/**/semantic_*.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Search qualification
        if: always()
        run: test "$(jq -r .verdict qualification-report.json)" = pass

  build:
    # The multi-arch image must never publish from a tag whose deterministic
    # Search qualification failed or was skipped. GitHub Release depends on
    # this job, so the same gate also blocks release publication.
    needs: [verify, search-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Publish BOTH v-prefixed and bare tag families so consumers can
          # use the canonical git-style "vX.Y.Z" form (which matches `git tag`
          # and `gh release`) AND the SemVer-pure form. See #89.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Plumb release metadata into lantern_build_info{version,commit}.
          # The container reads these via LANTERN_VERSION / LANTERN_COMMIT
          # env vars baked in by the Dockerfile. See #98.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "$TAGS" | xargs -I {} cosign sign --yes {}@${DIGEST}

  bench:
    # Release-time benchmark sweep. Runs the compact scenario set
    # listed in testbed/bench/release-scenarios.txt against a freshly-built
    # local image and uploads a fixed-format bench-report.md for the release
    # job to splice into the release notes. Non-blocking: a lifecycle/perf
    # failure or harness hiccup must not prevent a release from shipping
    # (the deliberate design of #256, #394). This full profiling sweep is
    # separate from the short blocking search-qualification job above.
    # Scheduled lifecycle/perf ENFORCEMENT also lives in
    # the nightly blocking run (.github/workflows/bench-nightly.yml), which
    # runs this same sweep WITHOUT continue-on-error (#716, #1063).
    name: Release-time benchmark
    needs: verify
    runs-on: ubuntu-latest
    continue-on-error: true
    # The compact sweep is ~25-26 min including the isolated per-scenario
    # cluster lifecycles (see release-scenarios.txt and #1097).
    # release.sh self-bounds via RELEASE_BENCH_BUDGET_SECONDS (default 27 min) and
    # always aggregates a report before returning, so this `timeout-minutes` is
    # only a hard backstop — sized above the budget plus one scenario's worst-case
    # overshoot plus job overhead (checkout + Go + ghz/yq + docker build + compose)
    # so the script's graceful cutoff fires first and the report is never discarded
    # by a mid-loop cancellation. See issues #571, #573, #708, and #1097.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
      - name: Install bench prerequisites (ghz, yq)
        run: |
          set -euo pipefail
          GHZ_VERSION="0.121.0"
          curl -fsSL -o /tmp/ghz.tgz \
            "https://github.com/bojand/ghz/releases/download/v${GHZ_VERSION}/ghz-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/ghz.tgz -C /usr/local/bin ghz
          sudo chmod +x /usr/local/bin/ghz
          ghz --version
          YQ_VERSION="v4.45.4"
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Build lantern:local image
        run: |
          docker build \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t lantern:local .
      - name: Run release bench sweep
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUNNER: linux/amd64 (ubuntu-latest)
          LANTERN_IMAGE: lantern:local
        run: ./testbed/bench/release.sh --out bench-report.md
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench-report.md
          if-no-files-found: warn
          retention-days: 30

  binaries:
    name: Build CLI + server binaries
    # GoReleaser may also publish Homebrew casks, so it shares the blocking
    # Search qualification with the container image and GitHub Release.
    needs: [verify, search-qualification]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          # GoReleaser uses this for GitHub API calls; the GitHub Release itself
          # is created by the `release` job below (release.disable: true keeps
          # GoReleaser from touching it).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo token for pushing the generated casks to
          # anaregdesign/homebrew-tap. Always exported (empty when the secret is
          # absent) so the `skip_upload` template in .goreleaser.yaml can gate
          # publishing without erroring on an undefined env var. Add a PAT/App
          # token with contents:write on the tap repo as this secret to enable
          # cask publishing.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-binaries
          path: |
            dist/lantern_*.tar.gz
            dist/lantern-cli_*.tar.gz
            dist/lantern-cli_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    # bench is intentionally NOT in `needs:`. Per #394, a bench-job cancellation
    # (e.g. via `timeout-minutes`) does not count as success-or-failure and
    # would skip this job, even though bench is `continue-on-error: true`.
    # The release-notes step below tolerates a missing bench report via
    # `download-artifact … continue-on-error: true`, so coupling them
    # structurally only adds gating risk.
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: cli-binaries
          path: dist
      - name: Download bench report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: bench-report
          path: bench
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ask GitHub to produce the standard auto-generated changelog
          # (same content as the "Generate release notes" button in the UI).
          auto=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq .body)

          notes_file=$(mktemp)
          {
            echo "## Container image"
            echo
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`), signed with cosign keyless."
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG#v}"
            echo '```'
            echo
            echo "## Binaries"
            echo
            echo "Pre-built \`lantern\` (server) and \`lantern-cli\` archives are attached to this"
            echo "release. The server covers macOS / Linux and the CLI also covers Windows, on"
            echo "x86_64 and arm64. Verify with \`checksums.txt\`."
            echo
            echo "### Homebrew (macOS)"
            echo
            echo '```sh'
            echo "brew tap anaregdesign/tap"
            echo "brew install --cask lantern        # server"
            echo "brew install --cask lantern-cli    # client"
            echo '```'
            echo
            echo "### Direct download"
            echo
            echo '```sh'
            echo "# macOS arm64 CLI example"
            echo "curl -L -o lantern-cli.tar.gz https://github.com/${REPO}/releases/download/${TAG}/lantern-cli_${TAG#v}_Darwin_arm64.tar.gz"
            echo "tar -xzf lantern-cli.tar.gz && ./lantern-cli version"
            echo '```'
            echo
            # Splice in the release-time benchmark report if the bench job
            # produced one. The bench job is non-blocking (continue-on-error)
            # so a missing artifact is normal — fall back to a placeholder
            # rather than aborting the release. Issue #256.
            if [[ -s bench/bench-report.md ]]; then
              cat bench/bench-report.md
            else
              echo "## Lantern benchmark — ${TAG}"
              echo
              echo "_Bench job did not produce a report for this release; see the workflow run for details._"
            fi
            echo
            echo "$auto"
          } > "$notes_file"

          # Collect the artifacts to attach to the release.
          assets=( dist/lantern_*.tar.gz dist/lantern-cli_*.tar.gz dist/lantern-cli_*.zip dist/checksums.txt )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file" --verify-tag
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${assets[@]}"
          fi

  # Continuous deployment: roll the freshly-pushed server image onto the live
  # GKE Autopilot cluster. Gated on `build` so we only deploy an image that was
  # actually pushed + signed; the workflow's `tags: [ 'v*.*.*' ]` trigger keeps
  # this tag-push-only. Auth is keyless via Workload Identity Federation — the
  # repo-scoped OIDC provider + deploy SA are provisioned out-of-band and wired
  # through the GCP_WIF_PROVIDER / GCP_DEPLOY_SA secrets. See #809.
  deploy-gke:
    name: Deploy to GKE Autopilot
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # mint the OIDC token google-github-actions/auth exchanges
    # Deployment target coordinates are non-secret but environment-specific;
    # configure them as repository variables instead of baking one cluster into
    # the reusable release workflow.
    env:
      GKE_CLUSTER: ${{ vars['GKE_CLUSTER'] }}
      GKE_LOCATION: ${{ vars['GKE_LOCATION'] }}
      GCP_PROJECT_ID: ${{ vars['GCP_PROJECT_ID'] }}
      RELEASE: ${{ vars['GKE_HELM_RELEASE'] }}
      NAMESPACE: ${{ vars['GKE_NAMESPACE'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate GKE deployment configuration
        run: |
          set -euo pipefail
          for name in GKE_CLUSTER GKE_LOCATION GCP_PROJECT_ID RELEASE NAMESPACE; do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable for $name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Roll the new image onto the StatefulSet
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The published GHCR tag is SemVer-pure (no leading v).
          helm upgrade --install "$RELEASE" deploy/helm/lantern \
            --namespace "$NAMESPACE" \
            --set image.tag="${TAG#v}" \
            --wait --timeout 10m
          kubectl rollout status "statefulset/$RELEASE" \
            --namespace "$NAMESPACE" --timeout=10m
