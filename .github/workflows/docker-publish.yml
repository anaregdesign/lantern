name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the canonical CI gates on the tagged commit. Tag pushes do not
  # trigger the `Go` workflow (which is gated on branch pushes / PRs), so
  # without this we could ship a broken image from a bad tag.
  verify:
    name: Verify (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race -shuffle=on ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Publish BOTH v-prefixed and bare tag families so consumers can
          # use the canonical git-style "vX.Y.Z" form (which matches `git tag`
          # and `gh release`) AND the SemVer-pure form. See #89.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Plumb release metadata into lantern_build_info{version,commit}.
          # The container reads these via LANTERN_VERSION / LANTERN_COMMIT
          # env vars baked in by the Dockerfile. See #98.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "$TAGS" | xargs -I {} cosign sign --yes {}@${DIGEST}

  binaries:
    name: Build CLI binaries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: |
            dist/lantern-cli_*.tar.gz
            dist/lantern-cli_*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Ask GitHub to produce the standard auto-generated changelog
          # (same content as the "Generate release notes" button in the UI).
          auto=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq .body)

          notes_file=$(mktemp)
          {
            echo "## Container image"
            echo
            echo "Multi-arch (\`linux/amd64\`, \`linux/arm64\`), signed with cosign keyless."
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${TAG#v}"
            echo '```'
            echo
            echo "## CLI binaries"
            echo
            echo "Pre-built \`lantern-cli\` archives for macOS / Linux / Windows on x86_64 and arm64"
            echo "are attached to this release. Verify with \`checksums.txt\`."
            echo
            echo '```sh'
            echo "# macOS arm64 example"
            echo "curl -L -o lantern-cli.tar.gz https://github.com/${REPO}/releases/download/${TAG}/lantern-cli_${TAG#v}_Darwin_arm64.tar.gz"
            echo "tar -xzf lantern-cli.tar.gz && ./lantern-cli version"
            echo '```'
            echo
            echo "$auto"
          } > "$notes_file"

          # Collect the artifacts to attach to the release.
          assets=( dist/lantern-cli_*.tar.gz dist/lantern-cli_*.zip dist/checksums.txt )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file" --verify-tag
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag \
              "${assets[@]}"
          fi
