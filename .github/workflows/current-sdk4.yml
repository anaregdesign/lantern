name: Current authority SDK4

on:
  workflow_call:
    outputs:
      receipt_sha256:
        value: ${{ jobs.native.outputs.receipt_sha256 }}
      artifact_id:
        value: ${{ jobs.native.outputs.artifact_id }}

permissions:
  contents: read

jobs:
  native:
    name: Native current SDK4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The native Linux profile uses the real raw counter/zero-offset namespace.
    # The selected source file belongs to this disposable container, not the
    # host; no clock setter, injected time or extra capability is used.
    container:
      image: ubuntu:24.04
      options: --cap-drop=SYS_TIME --security-opt=no-new-privileges
    outputs:
      receipt_sha256: ${{ steps.qualify.outputs.receipt_sha256 }}
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Prepare container tools and read-only source input
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3 unzip xz-utils build-essential pkg-config libssl-dev
          printf 'server time.asia.apple.com\n' > /tmp/current-sdk4-ntp.conf
          install -m 0444 /tmp/current-sdk4-ntp.conf /etc/ntp.conf
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: '1.97.1'
      - name: Prepare frozen SDK dependencies before native startup
        shell: bash
        run: |
          set -euo pipefail
          (cd sdks/node && bun install --frozen-lockfile && bun run build)
          (cd admin && bun install --frozen-lockfile)
          (cd sdks/dart && dart pub get --enforce-lockfile --no-example)
          (cd sdks/rust && cargo test --locked --lib --no-run)
      - name: Require exact candidate native SDK4 execution
        id: qualify
        shell: bash
        run: python3 -B .github/scripts/current_sdk4_gate.py run --expected-head "$GITHUB_SHA" --evidence "$RUNNER_TEMP/current-sdk4"
      - name: Retain native execution evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: current-sdk4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-sdk4/
          if-no-files-found: error
