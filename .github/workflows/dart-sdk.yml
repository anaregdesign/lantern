name: Dart SDK

on:
  push:
    branches: [main]
    paths:
      - "sdks/dart/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "generate.go"
      - ".github/workflows/dart-sdk.yml"
  pull_request:
    paths:
      - "sdks/dart/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "generate.go"
      - ".github/workflows/dart-sdk.yml"

permissions:
  contents: read

jobs:
  test:
    name: Generate, analyze, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Start Lantern real-wire server
        working-directory: .
        run: |
          go run ./server/cmd > "$RUNNER_TEMP/lantern-dart-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lantern-dart-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 \
              -H 'Content-Type: application/json' \
              -H 'Connect-Protocol-Version: 1' \
              --data '{}' \
              http://127.0.0.1:6380/grpc.health.v1.Health/Check >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/lantern-dart-server.log"
          exit 1

      - name: Resolve dependencies
        run: dart pub get --enforce-lockfile

      - name: Regenerate and check drift
        working-directory: .
        run: |
          sdks/dart/scripts/codegen.sh
          git diff --exit-code -- sdks/dart/lib/src/gen

      - name: Check format
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/lantern_client.dart test

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Real-wire test
        env:
          LANTERN_DART_REAL_WIRE_ENDPOINT: http://127.0.0.1:6380
        run: dart test test/real_wire_test.dart

      - name: Build API documentation
        run: dart doc --validate-links

      - name: Validate package shape
        run: dart pub publish --dry-run

      - name: Stop Lantern real-wire server
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/lantern-dart-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/lantern-dart-server.pid")" || true
          fi
