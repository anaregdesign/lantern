name: Dart SDK

on:
  push:
    branches: [main]
    tags:
      - "sdks/dart/v*.*.*"
    paths:
      - "sdks/dart/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "generate.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "core/search/**"
      - "core/graphcache/**"
      - "server/**"
      - "testdata/search/**"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "docs/decisions/0002-dart-offline-repository-contract.md"
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/dart-sdk.yml"
  pull_request:
    paths:
      - "sdks/dart/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "generate.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "core/search/**"
      - "core/graphcache/**"
      - "server/**"
      - "testdata/search/**"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "docs/decisions/0002-dart-offline-repository-contract.md"
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/dart-sdk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Backend-only changes still exercise the pure-Dart client over the real
      # wire. The complete toolchain and mobile matrix is reserved for changes
      # that can alter the generated/package/platform surfaces, and for tags.
      - name: Select required gate scope
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            full=true
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              base=$PR_BASE_SHA
              head=$PR_HEAD_SHA
              range="$base...$head"
            else
              base=$PUSH_BEFORE_SHA
              head=$GITHUB_SHA
              if [[ "$base" =~ ^0+$ ]]; then
                full=true
                range=
              else
                range="$base..$head"
              fi
            fi

            if [[ "$full" == false ]]; then
              while IFS= read -r path; do
                case "$path" in
                  sdks/dart/* | proto/* | buf.yaml | buf.gen.yaml | generate.go | \
                    go.mod | go.sum | go.work | go.work.sum | \
                    docs/decisions/0001-dart-mobile-transport.md | \
                    docs/decisions/0002-dart-offline-repository-contract.md | \
                    AGENTS.md | README.md | \
                    CONTRIBUTING.md | \
                    .github/workflows/dart-sdk.yml)
                    full=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$range")
            fi
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full Dart/mobile matrix: $full" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Generate, analyze, and test
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up current supported Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2

      - name: Set up Buf
        if: needs.changes.outputs.full == 'true'
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.71.0

      - name: Start Lantern real-wire server
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_PORT=6380 LANTERN_METRICS_ADDR=:9090 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-enabled.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          env LANTERN_PORT=6381 LANTERN_METRICS_ADDR=:9091 LANTERN_SEARCH_ENABLED=false \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-disabled.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          env LANTERN_PORT=6382 LANTERN_METRICS_ADDR=:9092 LANTERN_SEARCH_POSITIONS=false \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-positions.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          env LANTERN_PORT=6383 LANTERN_METRICS_ADDR=:9093 LANTERN_SEARCH_MAX_QUERY_BYTES=4 \
            LANTERN_SEARCH_MAX_QUERY_TERMS=4 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-budget.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          for attempt in $(seq 1 60); do
            ready=true
            for port in 6380 6381 6382 6383; do
              curl --fail --silent --show-error --max-time 2 \
                -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
                --data '{}' "http://127.0.0.1:$port/grpc.health.v1.Health/Check" >/dev/null || ready=false
            done
            $ready && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP"/lantern-dart-*.log
          exit 1

      - name: Resolve dependencies
        # The Flutter example resolves in the blocking Android job. Keeping it
        # out of this pure-Dart job avoids requiring a second Flutter install.
        run: dart pub get --enforce-lockfile --no-example

      - name: Regenerate and check drift
        if: needs.changes.outputs.full == 'true'
        working-directory: .
        run: |
          sdks/dart/scripts/codegen.sh
          git diff --exit-code -- sdks/dart/lib/src/gen

      - name: Check format
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/lantern_client.dart lib/src/*.dart test

      - name: Analyze
        # The standalone Dart SDK intentionally does not resolve the Flutter
        # example. Android and iOS jobs analyze that package with Flutter.
        run: dart analyze lib test

      - name: Test
        run: dart test

      - name: Real-wire test
        env:
          LANTERN_DART_REAL_WIRE_ENDPOINT: http://127.0.0.1:6380
          LANTERN_DART_SEARCH_DISABLED_ENDPOINT: http://127.0.0.1:6381
          LANTERN_DART_SEARCH_POSITIONS_DISABLED_ENDPOINT: http://127.0.0.1:6382
          LANTERN_DART_SEARCH_BUDGET_ENDPOINT: http://127.0.0.1:6383
        run: dart test test/real_wire_test.dart

      - name: Build API documentation
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dartdoc.log"
          dart doc --output "$RUNNER_TEMP/dartdoc" --validate-links \
            2>&1 | tee "$log"
          if grep -Eq '^  warning:|^warning:' "$log"; then
            echo "::error::dartdoc emitted warnings"
            exit 1
          fi

      # `--to-archive` uses Dart Pub's own publish file selection and tarball
      # builder. Verify that exact artifact outside the repository so a sibling
      # path cannot make a broken included package look resolvable.
      - name: Build and verify isolated parent publish archive
        if: needs.changes.outputs.full == 'true'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/lantern-client-artifact"
          source_dir="$artifact_root/source"
          archive="$artifact_root/lantern_client.tar.gz"
          package_dir="$artifact_root/unpacked/package"
          isolated_pub_cache="$artifact_root/pub-cache"
          mkdir -p "$source_dir" "$package_dir" "$isolated_pub_cache"

          git archive HEAD:sdks/dart | tar -x -C "$source_dir"
          dart pub publish -C "$source_dir" --to-archive="$archive"
          tar -xzf "$archive" -C "$package_dir"

          mapfile -d '' pubspecs < <(find "$package_dir" -name pubspec.yaml -print0)
          if [[ "${#pubspecs[@]}" -eq 0 ]]; then
            echo "::error::parent publish archive contains no pubspec.yaml"
            exit 1
          fi
          if [[ -e "$package_dir/offline" || -e "$package_dir/example/pubspec.yaml" ]]; then
            echo "::error::parent publish archive contains a repository-only package"
            exit 1
          fi
          if [[ ! -f "$package_dir/example/lantern_client_example.dart" ]]; then
            echo "::error::parent publish archive lost its standalone online example"
            exit 1
          fi
          if grep -HnE '^[[:space:]]*lantern_client_offline:' "${pubspecs[@]}"; then
            echo "::error::parent publish archive references lantern_client_offline"
            exit 1
          fi

          for pubspec in "${pubspecs[@]}"; do
            package=$(dirname "$pubspec")
            (
              cd "$package"
              PUB_CACHE="$isolated_pub_cache" dart pub get --no-example
              PUB_CACHE="$isolated_pub_cache" dart analyze
            )
          done

          (
            cd "$package_dir"
            PUB_CACHE="$isolated_pub_cache" dart test
          )

      - name: Generate pana quality report
        if: needs.changes.outputs.full == 'true'
        working-directory: .
        run: |
          package_dir="$RUNNER_TEMP/lantern-client-artifact/unpacked/package"
          dart pub global activate pana 0.23.14
          timeout 15m dart pub global run pana --json "$package_dir" \
            > "$RUNNER_TEMP/lantern-client-pana.json"

      - name: Upload pana quality report
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lantern-client-pana
          path: ${{ runner.temp }}/lantern-client-pana.json
          if-no-files-found: error

      - name: Stop Lantern real-wire server
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/lantern-dart.pids" ]; then
            xargs kill < "$RUNNER_TEMP/lantern-dart.pids" || true
          fi

  minimum-dart:
    name: Minimum Dart 3.11
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7

      - name: Set up minimum supported Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.11.0

      - name: Resolve at the minimum floor
        # The maintained Flutter example intentionally follows the pinned
        # current Flutter/Dart pair and is validated in separate mobile jobs.
        run: dart pub get --no-example

      - name: Analyze and test at the minimum floor
        run: |
          dart analyze lib test
          dart test

  offline-test:
    name: Offline package and real-wire replay
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart/offline
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up current supported Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2

      - name: Start Lantern real-wire server
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern-offline" ./server/cmd
          env LANTERN_PORT=6398 LANTERN_METRICS_ADDR=:9098 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern-offline" > "$RUNNER_TEMP/lantern-offline.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lantern-offline.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --max-time 2 \
              -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
              --data '{}' \
              http://127.0.0.1:6398/grpc.health.v1.Health/Check >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/lantern-offline.log"
          exit 1

      - name: Resolve exact offline lockfile
        run: dart pub get --enforce-lockfile

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: dart analyze lib test tool

      - name: Test with real committed-response loss
        env:
          LANTERN_DART_REAL_WIRE_ENDPOINT: http://127.0.0.1:6398
        run: dart test

      - name: Check reference-store resource baseline
        run: >-
          dart run tool/performance_probe.dart
          --output "$RUNNER_TEMP/lantern-offline-performance.json"

      - name: Upload sanitized offline performance evidence
        uses: actions/upload-artifact@v7
        with:
          name: lantern-offline-performance
          path: ${{ runner.temp }}/lantern-offline-performance.json
          if-no-files-found: error

      - name: Build warning-free API documentation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dart-offline-doc.log"
          dart doc --output "$RUNNER_TEMP/dart-offline-doc" --validate-links \
            2>&1 | tee "$log"
          if grep -Eq '^  warning:|^warning:' "$log"; then
            echo "::error::offline dartdoc emitted warnings"
            exit 1
          fi

      - name: Prove experimental publish remains blocked
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dart-offline-publish.log"
          if dart pub publish --dry-run >"$log" 2>&1; then
            cat "$log"
            echo "::error::experimental offline package unexpectedly passed publish validation"
            exit 1
          fi
          grep -F 'path source' "$log"

      - name: Stop Lantern real-wire server
        if: always()
        working-directory: .
        run: |
          cat "$RUNNER_TEMP/lantern-offline.log" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/lantern-offline.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/lantern-offline.pid")" 2>/dev/null || true
          fi

  offline-minimum-dart:
    name: Offline package minimum Dart 3.11
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart/offline
    steps:
      - uses: actions/checkout@v7

      - name: Set up minimum supported Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.11.0

      - name: Resolve, analyze, and test at the minimum floor
        run: |
          dart pub get --enforce-lockfile
          dart analyze lib test tool
          dart test

  android:
    name: Android emulator real-wire example
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Start Lantern
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_METRICS_ADDR=:9092 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/android-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-server.pid"

      - name: Check Flutter example
        working-directory: sdks/dart/example
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed \
            lib test integration_test test_driver
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android native smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: >-
            cd sdks/dart/example &&
            flutter test --no-pub integration_test/mobile_smoke_test.dart -d emulator-5554
            --reporter=expanded --timeout=3m
            --dart-define=LANTERN_ENDPOINT=http://10.0.2.2:6380
            --dart-define=LANTERN_ALLOW_INSECURE=true

      - name: Record exact Android revision evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lantern-mobile-evidence"
          mkdir -p "$evidence"
          grep -Fq 'applicationId = "com.anaregdesign.lantern_example"' \
            sdks/dart/example/android/app/build.gradle.kts
          flutter_json=$(cd sdks/dart/example && flutter --version --machine)
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg host_image_os "${ImageOS:-unknown}" \
            --arg host_image_version "${ImageVersion:-unknown}" \
            --arg flutter_version "$(jq -r .frameworkVersion <<<"$flutter_json")" \
            --arg flutter_revision "$(jq -r .frameworkRevision <<<"$flutter_json")" \
            --arg dart_version "$(jq -r .dartSdkVersion <<<"$flutter_json")" \
            '{
              schema: 1,
              kind: "ci_mobile_revision_evidence",
              contentFree: true,
              physicalDevice: false,
              repository: $repository,
              commit: $commit,
              ref: $ref,
              recordedAt: $recorded_at,
              workflow: {runId: $run_id, attempt: $run_attempt},
              toolchain: {
                flutter: $flutter_version,
                flutterRevision: $flutter_revision,
                dart: $dart_version
              },
              application: {
                packageId: "com.anaregdesign.lantern_example",
                target: "integration_test/mobile_smoke_test.dart"
              },
              platform: {
                kind: "android-emulator",
                apiLevel: 35,
                architecture: "x86_64",
                profile: "pixel_6",
                hostImageOS: $host_image_os,
                hostImageVersion: $host_image_version
              },
              network: {
                transport: "Connect/h2c",
                topology: "android-emulator-host-alias",
                authenticated: false
              },
              scenarios: [
                "online_exact_values",
                "offline_put_replay",
                "authoritative_server_expiry",
                "watch_cleanup",
                "wipe_before_send"
              ],
              result: "passed"
            }' > "$evidence/android.json"
          jq -e --arg commit "$GITHUB_SHA" '
            .schema == 1 and
            .kind == "ci_mobile_revision_evidence" and
            .contentFree == true and
            .physicalDevice == false and
            .commit == $commit and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.recordedAt | fromdateiso8601) and
            .application.packageId == "com.anaregdesign.lantern_example" and
            .platform.kind == "android-emulator" and
            .network.transport == "Connect/h2c" and
            (.scenarios | length == 5) and
            .result == "passed"
          ' "$evidence/android.json" >/dev/null

      - name: Upload sanitized Android revision evidence
        uses: actions/upload-artifact@v7
        with:
          name: lantern-android-revision-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-mobile-evidence/android.json
          if-no-files-found: error

      - name: Show logs and stop server
        if: always()
        run: |
          cat "$RUNNER_TEMP/android-server.log" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/android-server.pid")" 2>/dev/null || true

  ios:
    name: iOS simulator real-wire example
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Start iOS simulator boot
        run: |
          boot_simulator() {
            set -euo pipefail
            device=$(xcrun simctl list devices available -j | \
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
            test -n "$device"
            echo "$device" > "$RUNNER_TEMP/ios-device-id"
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
          }
          (
            if boot_simulator; then
              touch "$RUNNER_TEMP/ios-simulator-ready"
            else
              touch "$RUNNER_TEMP/ios-simulator-failed"
            fi
          ) > "$RUNNER_TEMP/ios-simulator-boot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-simulator-boot.pid"

      - name: Start Lantern
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_METRICS_ADDR=:9093 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/ios-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-server.pid"

      - name: Check and build iOS example
        working-directory: sdks/dart/example
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter build ios --debug --no-codesign --no-pub

      - name: Wait for iOS simulator
        timeout-minutes: 5
        run: |
          for attempt in $(seq 1 300); do
            if [[ -f "$RUNNER_TEMP/ios-simulator-ready" ]]; then
              break
            fi
            if [[ -f "$RUNNER_TEMP/ios-simulator-failed" ]]; then
              cat "$RUNNER_TEMP/ios-simulator-boot.log"
              exit 1
            fi
            sleep 1
          done
          if [[ ! -f "$RUNNER_TEMP/ios-simulator-ready" ]]; then
            cat "$RUNNER_TEMP/ios-simulator-boot.log"
            echo "::error::iOS simulator did not become ready"
            exit 1
          fi
          device=$(cat "$RUNNER_TEMP/ios-device-id")
          test -n "$device"
          echo "DEVICE_ID=$device" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/ios-simulator-boot.log"

      - name: Run iOS native smoke
        id: ios_smoke
        continue-on-error: true
        timeout-minutes: 8
        working-directory: sdks/dart/example
        run: |
          flutter test --no-pub integration_test/mobile_smoke_test.dart -d "$DEVICE_ID" \
            --reporter=expanded --timeout=3m \
            --dart-define=LANTERN_ENDPOINT=http://127.0.0.1:6380 \
            --dart-define=LANTERN_ALLOW_INSECURE=true

      # Flutter's test timeout does not cover a stalled iOS app launch.
      - name: Reboot iOS simulator after a failed smoke attempt
        if: steps.ios_smoke.outcome == 'failure'
        run: |
          xcrun simctl shutdown "$DEVICE_ID" || true
          xcrun simctl erase "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Retry iOS native smoke
        id: ios_smoke_retry
        if: steps.ios_smoke.outcome == 'failure'
        timeout-minutes: 8
        working-directory: sdks/dart/example
        run: |
          flutter test --no-pub integration_test/mobile_smoke_test.dart -d "$DEVICE_ID" \
            --reporter=expanded --timeout=3m \
            --dart-define=LANTERN_ENDPOINT=http://127.0.0.1:6380 \
            --dart-define=LANTERN_ALLOW_INSECURE=true

      - name: Record exact iOS revision evidence
        if: steps.ios_smoke.outcome == 'success' || steps.ios_smoke_retry.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lantern-mobile-evidence"
          mkdir -p "$evidence"
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.anaregdesign.lanternExample;' \
            sdks/dart/example/ios/Runner.xcodeproj/project.pbxproj
          flutter_json=$(cd sdks/dart/example && flutter --version --machine)
          simulator=$(xcrun simctl list devices available -j | jq -er \
            --arg id "$DEVICE_ID" \
            '.devices | first(to_entries[] | .key as $runtime | .value[] | select(.udid == $id) | [$runtime, .name] | @tsv)')
          simulator_runtime=${simulator%%$'\t'*}
          simulator_name=${simulator#*$'\t'}
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg host_image_os "${ImageOS:-unknown}" \
            --arg host_image_version "${ImageVersion:-unknown}" \
            --arg flutter_version "$(jq -r .frameworkVersion <<<"$flutter_json")" \
            --arg flutter_revision "$(jq -r .frameworkRevision <<<"$flutter_json")" \
            --arg dart_version "$(jq -r .dartSdkVersion <<<"$flutter_json")" \
            --arg simulator_runtime "$simulator_runtime" \
            --arg simulator_name "$simulator_name" \
            '{
              schema: 1,
              kind: "ci_mobile_revision_evidence",
              contentFree: true,
              physicalDevice: false,
              repository: $repository,
              commit: $commit,
              ref: $ref,
              recordedAt: $recorded_at,
              workflow: {runId: $run_id, attempt: $run_attempt},
              toolchain: {
                flutter: $flutter_version,
                flutterRevision: $flutter_revision,
                dart: $dart_version
              },
              application: {
                packageId: "com.anaregdesign.lanternExample",
                target: "integration_test/mobile_smoke_test.dart"
              },
              platform: {
                kind: "ios-simulator",
                runtime: $simulator_runtime,
                model: $simulator_name,
                hostImageOS: $host_image_os,
                hostImageVersion: $host_image_version
              },
              network: {
                transport: "Connect/h2c",
                topology: "ios-simulator-host-loopback",
                authenticated: false
              },
              scenarios: [
                "online_exact_values",
                "offline_put_replay",
                "authoritative_server_expiry",
                "watch_cleanup",
                "wipe_before_send"
              ],
              result: "passed"
            }' > "$evidence/ios.json"
          jq -e --arg commit "$GITHUB_SHA" '
            .schema == 1 and
            .kind == "ci_mobile_revision_evidence" and
            .contentFree == true and
            .physicalDevice == false and
            .commit == $commit and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.recordedAt | fromdateiso8601) and
            .application.packageId == "com.anaregdesign.lanternExample" and
            .platform.kind == "ios-simulator" and
            .network.transport == "Connect/h2c" and
            (.scenarios | length == 5) and
            .result == "passed"
          ' "$evidence/ios.json" >/dev/null

      - name: Upload sanitized iOS revision evidence
        if: steps.ios_smoke.outcome == 'success' || steps.ios_smoke_retry.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lantern-ios-revision-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-mobile-evidence/ios.json
          if-no-files-found: error

      - name: Show logs and clean up
        if: always()
        run: |
          cat "$RUNNER_TEMP/ios-server.log" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/ios-server.pid")" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/ios-simulator-boot.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/ios-simulator-boot.pid")" 2>/dev/null || true
          fi
          device=${DEVICE_ID:-}
          if [[ -z "$device" && -f "$RUNNER_TEMP/ios-device-id" ]]; then
            device=$(cat "$RUNNER_TEMP/ios-device-id")
          fi
          if [[ -n "$device" ]]; then
            xcrun simctl shutdown "$device" || true
          fi

  gate:
    name: Gate
    if: always()
    needs: [changes, test, minimum-dart, offline-test, offline-minimum-dart, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_DART_RESULT: ${{ needs.minimum-dart.result }}
          OFFLINE_TEST_RESULT: ${{ needs.offline-test.result }}
          OFFLINE_MINIMUM_DART_RESULT: ${{ needs.offline-minimum-dart.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          require_result() {
            local job=$1 actual=$2 expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$job result is $actual; expected $expected"
              exit 1
            fi
          }

          require_result changes "$CHANGES_RESULT" success
          require_result test "$TEST_RESULT" success
          require_result offline-test "$OFFLINE_TEST_RESULT" success
          if [[ "$FULL" == true ]]; then
            require_result minimum-dart "$MINIMUM_DART_RESULT" success
            require_result offline-minimum-dart "$OFFLINE_MINIMUM_DART_RESULT" success
            require_result android "$ANDROID_RESULT" success
            require_result ios "$IOS_RESULT" success
          else
            require_result minimum-dart "$MINIMUM_DART_RESULT" skipped
            require_result offline-minimum-dart "$OFFLINE_MINIMUM_DART_RESULT" skipped
            require_result android "$ANDROID_RESULT" skipped
            require_result ios "$IOS_RESULT" skipped
          fi

          echo "Full Dart/mobile matrix: $FULL" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish lantern_client
    needs: [gate]
    if: startsWith(github.ref, 'refs/tags/sdks/dart/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pub.dev
      url: https://pub.dev/packages/lantern_client
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # setup-dart also mints and configures the GitHub OIDC credential that
      # pub.dev's automated publisher consumes. A Flutter-only setup silently
      # falls back to interactive Google OAuth in a headless runner.
      - name: Set up current supported Dart and pub.dev OIDC
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: 3.12.2

      - name: Verify tag, package version, and changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^sdks/dart/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_version=${TAG#sdks/dart/v}
          pubspec_version=$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)
          test "$tag_version" = "$pubspec_version"
          grep -Fx "## $tag_version" CHANGELOG.md
          echo "VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Resolve exact lockfile
        # The publish runner intentionally installs Dart only. Resolve the
        # package lock without descending into the maintained Flutter example.
        run: dart pub get --enforce-lockfile --no-example

      - name: Check pub.dev package/version state
        run: |
          set -euo pipefail
          package_status=$(curl --silent --show-error --output "$RUNNER_TEMP/package.json" \
            --write-out '%{http_code}' \
            https://pub.dev/api/packages/lantern_client)
          version_status=$(curl --silent --show-error --output "$RUNNER_TEMP/version.json" \
            --write-out '%{http_code}' \
            "https://pub.dev/api/packages/lantern_client/versions/$VERSION")
          if [[ "$version_status" == 200 ]]; then
            echo "PUBLISH_REQUIRED=false" >> "$GITHUB_ENV"
          elif [[ "$package_status" == 404 ]]; then
            echo "::error::pub.dev requires lantern_client's first version to be published manually from this exact tag. Publish it, configure automated publishing for anaregdesign/lantern and sdks/dart/v{{version}}, then rerun this job."
            exit 1
          elif [[ "$package_status" == 200 && "$version_status" == 404 ]]; then
            echo "PUBLISH_REQUIRED=true" >> "$GITHUB_ENV"
          else
            echo "::error::Unexpected pub.dev API status: package=$package_status version=$version_status"
            exit 1
          fi

      - name: Publish with pub.dev OIDC
        if: env.PUBLISH_REQUIRED == 'true'
        run: dart pub publish --force

      - name: Verify pub.dev version exists
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "https://pub.dev/api/packages/lantern_client/versions/$VERSION" \
              >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published version did not become visible on pub.dev"
          exit 1

      - name: Create exact-title GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file=$(mktemp)
          {
            echo "## Lantern Dart client SDK"
            echo
            echo "Install with:"
            echo
            echo '```yaml'
            echo 'dependencies:'
            echo "  lantern_client: ^$VERSION"
            echo '```'
          } > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" \
              --notes-file "$notes_file" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" \
              --notes-file "$notes_file" --verify-tag
          fi
