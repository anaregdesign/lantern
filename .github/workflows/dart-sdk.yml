name: Dart SDK

on:
  push:
    branches: [main]
    tags:
      - "sdks/dart/v*.*.*"
    paths:
      - "sdks/dart/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "generate.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "core/search/**"
      - "core/graphcache/**"
      - "server/**"
      - "testdata/search/**"
      - "tests/integration/dart_offline_sqlite_test.dart"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "docs/decisions/0002-dart-offline-repository-contract.md"
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/dart-sdk.yml"
  pull_request:
    paths:
      - "sdks/dart/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "generate.go"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "core/search/**"
      - "core/graphcache/**"
      - "server/**"
      - "testdata/search/**"
      - "tests/integration/dart_offline_sqlite_test.dart"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "docs/decisions/0002-dart-offline-repository-contract.md"
      - "AGENTS.md"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/dart-sdk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Backend-only changes still exercise the pure-Dart client over the real
      # wire. The complete toolchain and mobile matrix is reserved for changes
      # that can alter the generated/package/platform surfaces, and for tags.
      - name: Select required gate scope
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          full=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            full=true
          else
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              base=$PR_BASE_SHA
              head=$PR_HEAD_SHA
              range="$base...$head"
            else
              base=$PUSH_BEFORE_SHA
              head=$GITHUB_SHA
              if [[ "$base" =~ ^0+$ ]]; then
                full=true
                range=
              else
                range="$base..$head"
              fi
            fi

            if [[ "$full" == false ]]; then
              while IFS= read -r path; do
                case "$path" in
                  sdks/dart/* | proto/* | buf.yaml | buf.gen.yaml | generate.go | \
                    go.mod | go.sum | go.work | go.work.sum | \
                    tests/integration/dart_offline_sqlite_test.dart | \
                    docs/decisions/0001-dart-mobile-transport.md | \
                    docs/decisions/0002-dart-offline-repository-contract.md | \
                    AGENTS.md | README.md | \
                    CONTRIBUTING.md | \
                    .github/workflows/dart-sdk.yml)
                    full=true
                    break
                    ;;
                esac
              done < <(git diff --name-only "$range")
            fi
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full Dart/mobile matrix: $full" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Generate, analyze, and test
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up current supported Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12.2

      - name: Set up Buf
        if: needs.changes.outputs.full == 'true'
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.71.0

      - name: Start Lantern real-wire server
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_PORT=6380 LANTERN_METRICS_ADDR=:9090 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-enabled.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          env LANTERN_PORT=6381 LANTERN_METRICS_ADDR=:9091 LANTERN_SEARCH_ENABLED=false \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-disabled.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          env LANTERN_PORT=6382 LANTERN_METRICS_ADDR=:9092 LANTERN_SEARCH_POSITIONS=false \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-positions.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          env LANTERN_PORT=6383 LANTERN_METRICS_ADDR=:9093 LANTERN_SEARCH_MAX_QUERY_BYTES=4 \
            LANTERN_SEARCH_MAX_QUERY_TERMS=4 \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/lantern-dart-budget.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/lantern-dart.pids"
          for attempt in $(seq 1 60); do
            ready=true
            for port in 6380 6381 6382 6383; do
              curl --fail --silent --show-error --max-time 2 \
                -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
                --data '{}' "http://127.0.0.1:$port/grpc.health.v1.Health/Check" >/dev/null || ready=false
            done
            $ready && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP"/lantern-dart-*.log
          exit 1

      - name: Test parent publication safeguards
        run: python3 -B -m unittest discover -s scripts -p release_test.py

      - name: Resolve dependencies
        # The Flutter example resolves in the blocking Android job. Keeping it
        # out of this pure-Dart job avoids requiring a second Flutter install.
        run: dart pub get --enforce-lockfile --no-example

      - name: Regenerate and check drift
        if: needs.changes.outputs.full == 'true'
        working-directory: .
        run: |
          sdks/dart/scripts/codegen.sh
          git diff --exit-code -- sdks/dart/lib/src/gen

      - name: Check format
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/lantern_client.dart lib/src/*.dart test

      - name: Analyze
        # The standalone Dart SDK intentionally does not resolve the Flutter
        # example. Android and iOS jobs analyze that package with Flutter.
        run: dart analyze lib test

      - name: Test
        run: dart test

      - name: Real-wire test
        env:
          LANTERN_DART_REAL_WIRE_ENDPOINT: http://127.0.0.1:6380
          LANTERN_DART_SEARCH_DISABLED_ENDPOINT: http://127.0.0.1:6381
          LANTERN_DART_SEARCH_POSITIONS_DISABLED_ENDPOINT: http://127.0.0.1:6382
          LANTERN_DART_SEARCH_BUDGET_ENDPOINT: http://127.0.0.1:6383
        run: dart test test/real_wire_test.dart

      - name: Build API documentation
        if: needs.changes.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dartdoc.log"
          dart doc --output "$RUNNER_TEMP/dartdoc" --validate-links \
            2>&1 | tee "$log"
          if grep -Eq '^  warning:|^warning:' "$log"; then
            echo "::error::dartdoc emitted warnings"
            exit 1
          fi

      # `--to-archive` uses Dart Pub's own publish file selection and tarball
      # builder. Verify that exact artifact outside the repository so a sibling
      # path cannot make a broken included package look resolvable.
      - name: Build and verify isolated parent publish archive
        if: needs.changes.outputs.full == 'true'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/lantern-client-artifact"
          source_dir="$artifact_root/source"
          archive="$artifact_root/lantern_client.tar.gz"
          package_dir="$artifact_root/unpacked/package"
          isolated_pub_cache="$artifact_root/pub-cache"
          mkdir -p "$source_dir" "$package_dir" "$isolated_pub_cache"

          git archive HEAD:sdks/dart | tar -x -C "$source_dir"
          dart pub publish -C "$source_dir" --to-archive="$archive"
          tar -xzf "$archive" -C "$package_dir"

          mapfile -d '' pubspecs < <(find "$package_dir" -name pubspec.yaml -print0)
          if [[ "${#pubspecs[@]}" -eq 0 ]]; then
            echo "::error::parent publish archive contains no pubspec.yaml"
            exit 1
          fi
          if [[ -e "$package_dir/offline" || -e "$package_dir/offline_sqlite" || -e "$package_dir/example/pubspec.yaml" ]]; then
            echo "::error::parent publish archive contains a repository-only package"
            exit 1
          fi
          if [[ ! -f "$package_dir/example/lantern_client_example.dart" ]]; then
            echo "::error::parent publish archive lost its standalone online example"
            exit 1
          fi
          if grep -HnE '^[[:space:]]*lantern_client_offline(_sqlite)?:' "${pubspecs[@]}"; then
            echo "::error::parent publish archive references a repository-only offline package"
            exit 1
          fi

          for pubspec in "${pubspecs[@]}"; do
            package=$(dirname "$pubspec")
            (
              cd "$package"
              PUB_CACHE="$isolated_pub_cache" dart pub get --no-example
              PUB_CACHE="$isolated_pub_cache" dart analyze
            )
          done

          (
            cd "$package_dir"
            PUB_CACHE="$isolated_pub_cache" dart test
          )

      - name: Generate pana quality report
        if: needs.changes.outputs.full == 'true'
        working-directory: .
        run: |
          package_dir="$RUNNER_TEMP/lantern-client-artifact/unpacked/package"
          dart pub global activate pana 0.23.14
          timeout 15m dart pub global run pana --json "$package_dir" \
            > "$RUNNER_TEMP/lantern-client-pana.json"

      - name: Upload pana quality report
        if: needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lantern-client-pana
          path: ${{ runner.temp }}/lantern-client-pana.json
          if-no-files-found: error

      - name: Stop Lantern real-wire server
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/lantern-dart.pids" ]; then
            xargs kill < "$RUNNER_TEMP/lantern-dart.pids" || true
          fi

  minimum-dart:
    name: Minimum Dart 3.11
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart
    steps:
      - uses: actions/checkout@v7

      - name: Set up minimum supported Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.11.0

      - name: Resolve at the minimum floor
        # The maintained Flutter example intentionally follows the pinned
        # current Flutter/Dart pair and is validated in separate mobile jobs.
        run: dart pub get --no-example

      - name: Analyze and test at the minimum floor
        run: |
          dart analyze lib test
          dart test

  offline-test:
    name: Offline package and real-wire replay
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart/offline
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up current supported Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12.2

      - name: Start Lantern real-wire server
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern-offline" ./server/cmd
          env LANTERN_PORT=6398 LANTERN_METRICS_ADDR=:9098 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern-offline" > "$RUNNER_TEMP/lantern-offline.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lantern-offline.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --max-time 2 \
              -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
              --data '{}' \
              http://127.0.0.1:6398/grpc.health.v1.Health/Check >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/lantern-offline.log"
          exit 1

      - name: Resolve exact offline lockfile
        run: dart pub get --enforce-lockfile

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: dart analyze lib test tool

      - name: Test with real committed-response loss
        env:
          LANTERN_DART_REAL_WIRE_ENDPOINT: http://127.0.0.1:6398
        run: dart test

      - name: Check reference-store resource baseline
        run: >-
          dart run tool/performance_probe.dart
          --output "$RUNNER_TEMP/lantern-offline-performance.json"

      - name: Upload sanitized offline performance evidence
        uses: actions/upload-artifact@v7
        with:
          name: lantern-offline-performance
          path: ${{ runner.temp }}/lantern-offline-performance.json
          if-no-files-found: error

      - name: Build warning-free API documentation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dart-offline-doc.log"
          dart doc --output "$RUNNER_TEMP/dart-offline-doc" --validate-links \
            2>&1 | tee "$log"
          if grep -Eq '^  warning:|^warning:' "$log"; then
            echo "::error::offline dartdoc emitted warnings"
            exit 1
          fi

      - name: Prove experimental publish remains blocked
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/dart-offline-publish.log"
          if dart pub publish --dry-run >"$log" 2>&1; then
            cat "$log"
            echo "::error::experimental offline package unexpectedly passed publish validation"
            exit 1
          fi
          grep -F 'path source' "$log"

      - name: Stop Lantern real-wire server
        if: always()
        working-directory: .
        run: |
          cat "$RUNNER_TEMP/lantern-offline.log" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/lantern-offline.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/lantern-offline.pid")" 2>/dev/null || true
          fi

  offline-minimum-dart:
    name: Offline package minimum Dart 3.11
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/dart/offline
    steps:
      - uses: actions/checkout@v7

      - name: Set up minimum supported Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.11.0

      - name: Resolve, analyze, and test at the minimum floor
        run: |
          dart pub get --enforce-lockfile
          dart analyze lib test tool
          dart test

  offline-sqlite:
    name: SQLite adapter persistence and real-wire replay
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/dart/offline_sqlite
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Start Lantern real-wire server
        working-directory: .
        run: |
          go build -o "$RUNNER_TEMP/lantern-sqlite" ./server/cmd
          env LANTERN_PORT=6397 LANTERN_METRICS_ADDR=:9097 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern-sqlite" > "$RUNNER_TEMP/lantern-sqlite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/lantern-sqlite.pid"
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error --max-time 2 \
              -H 'Content-Type: application/json' -H 'Connect-Protocol-Version: 1' \
              --data '{}' \
              http://127.0.0.1:6397/grpc.health.v1.Health/Check >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/lantern-sqlite.log"
          exit 1

      - name: Check SQLite adapter
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --no-pub

      - name: Test durable SQLite contracts
        run: flutter test --no-pub

      - name: Verify process-crash recovery
        run: dart run tool/crash_probe.dart

      - name: Check SQLite host resource baseline
        run: >-
          dart run tool/performance_probe.dart
          > "$RUNNER_TEMP/lantern-sqlite-baseline.json"

      - name: Upload sanitized SQLite host baseline
        uses: actions/upload-artifact@v7
        with:
          name: lantern-sqlite-host-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-sqlite-baseline.json
          if-no-files-found: error

      - name: Test SQLite replay over the real wire
        env:
          LANTERN_DART_REAL_WIRE_ENDPOINT: http://127.0.0.1:6397
        run: >-
          flutter test --no-pub
          ../../../tests/integration/dart_offline_sqlite_test.dart

      - name: Stop Lantern real-wire server
        if: always()
        working-directory: .
        run: |
          cat "$RUNNER_TEMP/lantern-sqlite.log" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/lantern-sqlite.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/lantern-sqlite.pid")" 2>/dev/null || true
          fi

  android:
    name: Android emulator real-wire example
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Start Lantern
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_METRICS_ADDR=:9092 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/android-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-server.pid"

      - name: Check Flutter example
        working-directory: sdks/dart/example
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed \
            lib test integration_test test_driver
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android native smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: >-
            cd sdks/dart/example &&
            flutter test --no-pub integration_test/mobile_smoke_test.dart -d emulator-5554
            --reporter=expanded --timeout=3m
            --dart-define=LANTERN_ENDPOINT=http://10.0.2.2:6380
            --dart-define=LANTERN_ALLOW_INSECURE=true

      - name: Record exact Android revision evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lantern-mobile-evidence"
          mkdir -p "$evidence"
          grep -Fq 'applicationId = "com.anaregdesign.lantern_example"' \
            sdks/dart/example/android/app/build.gradle.kts
          flutter_json=$(cd sdks/dart/example && flutter --version --machine)
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg host_image_os "${ImageOS:-unknown}" \
            --arg host_image_version "${ImageVersion:-unknown}" \
            --arg flutter_version "$(jq -r .frameworkVersion <<<"$flutter_json")" \
            --arg flutter_revision "$(jq -r .frameworkRevision <<<"$flutter_json")" \
            --arg dart_version "$(jq -r .dartSdkVersion <<<"$flutter_json")" \
            '{
              schema: 1,
              kind: "ci_mobile_revision_evidence",
              contentFree: true,
              physicalDevice: false,
              repository: $repository,
              commit: $commit,
              ref: $ref,
              recordedAt: $recorded_at,
              workflow: {runId: $run_id, attempt: $run_attempt},
              toolchain: {
                flutter: $flutter_version,
                flutterRevision: $flutter_revision,
                dart: $dart_version
              },
              application: {
                packageId: "com.anaregdesign.lantern_example",
                target: "integration_test/mobile_smoke_test.dart"
              },
              platform: {
                kind: "android-emulator",
                apiLevel: 35,
                architecture: "x86_64",
                profile: "pixel_6",
                hostImageOS: $host_image_os,
                hostImageVersion: $host_image_version
              },
              network: {
                transport: "Connect/h2c",
                topology: "android-emulator-host-alias",
                authenticated: false
              },
              scenarios: [
                "online_exact_values",
                "offline_put_replay",
                "authoritative_server_expiry",
                "watch_cleanup",
                "wipe_before_send",
                "sqlite_pending_close_reopen",
                "sqlite_original_ttl_preserved",
                "sqlite_expired_before_replay",
                "sqlite_logout_wipe_reopen",
                "sqlite_partition_isolation"
              ],
              result: "passed"
            }' > "$evidence/android.json"
          jq -e --arg commit "$GITHUB_SHA" '
            .schema == 1 and
            .kind == "ci_mobile_revision_evidence" and
            .contentFree == true and
            .physicalDevice == false and
            .commit == $commit and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.recordedAt | fromdateiso8601) and
            .application.packageId == "com.anaregdesign.lantern_example" and
            .platform.kind == "android-emulator" and
            .network.transport == "Connect/h2c" and
            (.scenarios | length == 10) and
            .result == "passed"
          ' "$evidence/android.json" >/dev/null

      - name: Upload sanitized Android revision evidence
        uses: actions/upload-artifact@v7
        with:
          name: lantern-android-revision-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-mobile-evidence/android.json
          if-no-files-found: error

      - name: Show logs and stop server
        if: always()
        run: |
          cat "$RUNNER_TEMP/android-server.log" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/android-server.pid")" 2>/dev/null || true

  ios:
    name: iOS simulator real-wire example
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-15
    # Two bounded 10-minute attempts plus fresh-device creation must leave
    # enough margin for setup/build, diagnostics upload, and mandatory cleanup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Start iOS simulator boot
        run: |
          boot_simulator() {
            set -euo pipefail
            device=$(xcrun simctl list devices available -j | \
              jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
            test -n "$device"
            echo "$device" > "$RUNNER_TEMP/ios-device-id"
            xcrun simctl boot "$device" || true
            xcrun simctl bootstatus "$device" -b
          }
          (
            if boot_simulator; then
              touch "$RUNNER_TEMP/ios-simulator-ready"
            else
              touch "$RUNNER_TEMP/ios-simulator-failed"
            fi
          ) > "$RUNNER_TEMP/ios-simulator-boot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-simulator-boot.pid"

      - name: Start Lantern
        run: |
          go build -o "$RUNNER_TEMP/lantern" ./server/cmd
          env LANTERN_METRICS_ADDR=:9093 LANTERN_LOG_LEVEL=warn \
            "$RUNNER_TEMP/lantern" > "$RUNNER_TEMP/ios-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ios-server.pid"

      - name: Check and build iOS example
        working-directory: sdks/dart/example
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter build ios --debug --no-codesign --no-pub

      - name: Wait for iOS simulator
        timeout-minutes: 5
        run: |
          for attempt in $(seq 1 300); do
            if [[ -f "$RUNNER_TEMP/ios-simulator-ready" ]]; then
              break
            fi
            if [[ -f "$RUNNER_TEMP/ios-simulator-failed" ]]; then
              cat "$RUNNER_TEMP/ios-simulator-boot.log"
              exit 1
            fi
            sleep 1
          done
          if [[ ! -f "$RUNNER_TEMP/ios-simulator-ready" ]]; then
            cat "$RUNNER_TEMP/ios-simulator-boot.log"
            echo "::error::iOS simulator did not become ready"
            exit 1
          fi
          device=$(cat "$RUNNER_TEMP/ios-device-id")
          test -n "$device"
          echo "DEVICE_ID=$device" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/ios-simulator-boot.log"

      - name: Run attached iOS native smoke
        id: ios_smoke_initial
        if: success()
        continue-on-error: true
        timeout-minutes: 10
        working-directory: sdks/dart/example
        env:
          IOS_SMOKE_LAUNCH_TIMEOUT_SECONDS: 180
          IOS_SMOKE_TOTAL_TIMEOUT_SECONDS: 480
        run: >-
          bash tool/ios_smoke_ci.sh run-attached-attempt "$DEVICE_ID" initial
          "$RUNNER_TEMP/ios-smoke-diagnostics"

      # Retry only a native launch or VM attachment stall on a clean device.
      # Assertion, RPC, build, and post-body failures never enter this path.
      - name: Create independently clean retry simulator
        id: ios_fresh_device
        if: >-
          contains(fromJSON('["launch_stall","attach_stall"]'),
          steps.ios_smoke_initial.outputs.classification)
        timeout-minutes: 3
        working-directory: sdks/dart/example
        run: |
          xcrun simctl shutdown "$DEVICE_ID" || true
          bash tool/ios_smoke_ci.sh create-retry-device \
            "$DEVICE_ID" "$RUNNER_TEMP/ios-retry-device-id" \
            "$RUNNER_TEMP/ios-smoke-diagnostics"
          retry_device=$(cat "$RUNNER_TEMP/ios-retry-device-id")
          test -n "$retry_device"
          test "$retry_device" != "$DEVICE_ID"
          echo "RETRY_DEVICE_ID=$retry_device" >> "$GITHUB_ENV"

      - name: Retry attached iOS native smoke on fresh simulator
        id: ios_smoke_retry
        if: >-
          contains(fromJSON('["launch_stall","attach_stall"]'),
          steps.ios_smoke_initial.outputs.classification) &&
          steps.ios_fresh_device.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: sdks/dart/example
        env:
          IOS_SMOKE_LAUNCH_TIMEOUT_SECONDS: 180
          IOS_SMOKE_TOTAL_TIMEOUT_SECONDS: 480
        run: >-
          bash tool/ios_smoke_ci.sh run-attached-attempt "$RETRY_DEVICE_ID" retry
          "$RUNNER_TEMP/ios-smoke-diagnostics"

      - name: Finalize bounded iOS launch diagnostics
        id: ios_diagnostics_finalize
        if: always()
        timeout-minutes: 2
        working-directory: sdks/dart/example
        run: >-
          bash tool/ios_smoke_ci.sh finalize-diagnostics
          "$RUNNER_TEMP/ios-smoke-diagnostics"

      - name: Upload bounded iOS launch diagnostics
        if: always() && steps.ios_diagnostics_finalize.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: lantern-ios-smoke-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-smoke-diagnostics
          if-no-files-found: error
          retention-days: 14

      - name: Require classified iOS smoke success
        if: always()
        env:
          INITIAL_CLASSIFICATION: ${{ steps.ios_smoke_initial.outputs.classification }}
          FRESH_DEVICE_OUTCOME: ${{ steps.ios_fresh_device.outcome }}
          RETRY_CLASSIFICATION: ${{ steps.ios_smoke_retry.outputs.classification }}
        run: |
          set -euo pipefail
          if [[ "$INITIAL_CLASSIFICATION" == success ]]; then
            echo "SMOKE_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ ( "$INITIAL_CLASSIFICATION" == launch_stall || \
                  "$INITIAL_CLASSIFICATION" == attach_stall ) && \
                "$FRESH_DEVICE_OUTCOME" == success && \
                "$RETRY_CLASSIFICATION" == success ]]; then
            echo "SMOKE_DEVICE_ID=$RETRY_DEVICE_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::iOS smoke failed: initial=$INITIAL_CLASSIFICATION fresh=$FRESH_DEVICE_OUTCOME retry=$RETRY_CLASSIFICATION"
          exit 1

      - name: Record exact iOS revision evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/lantern-mobile-evidence"
          mkdir -p "$evidence"
          grep -Fq 'PRODUCT_BUNDLE_IDENTIFIER = com.anaregdesign.lanternExample;' \
            sdks/dart/example/ios/Runner.xcodeproj/project.pbxproj
          flutter_json=$(cd sdks/dart/example && flutter --version --machine)
          simulator=$(xcrun simctl list devices available -j | jq -er \
            --arg id "$SMOKE_DEVICE_ID" \
            '.devices | first(to_entries[] | .key as $runtime | .value[] | select(.udid == $id) | [$runtime, .name] | @tsv)')
          simulator_runtime=${simulator%%$'\t'*}
          simulator_name=${simulator#*$'\t'}
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg host_image_os "${ImageOS:-unknown}" \
            --arg host_image_version "${ImageVersion:-unknown}" \
            --arg flutter_version "$(jq -r .frameworkVersion <<<"$flutter_json")" \
            --arg flutter_revision "$(jq -r .frameworkRevision <<<"$flutter_json")" \
            --arg dart_version "$(jq -r .dartSdkVersion <<<"$flutter_json")" \
            --arg simulator_runtime "$simulator_runtime" \
            --arg simulator_name "$simulator_name" \
            '{
              schema: 1,
              kind: "ci_mobile_revision_evidence",
              contentFree: true,
              physicalDevice: false,
              repository: $repository,
              commit: $commit,
              ref: $ref,
              recordedAt: $recorded_at,
              workflow: {runId: $run_id, attempt: $run_attempt},
              toolchain: {
                flutter: $flutter_version,
                flutterRevision: $flutter_revision,
                dart: $dart_version
              },
              application: {
                packageId: "com.anaregdesign.lanternExample",
                target: "integration_test/mobile_smoke_test.dart"
              },
              platform: {
                kind: "ios-simulator",
                runtime: $simulator_runtime,
                model: $simulator_name,
                hostImageOS: $host_image_os,
                hostImageVersion: $host_image_version
              },
              network: {
                transport: "Connect/h2c",
                topology: "ios-simulator-host-loopback",
                authenticated: false
              },
              scenarios: [
                "online_exact_values",
                "offline_put_replay",
                "authoritative_server_expiry",
                "watch_cleanup",
                "wipe_before_send",
                "sqlite_pending_close_reopen",
                "sqlite_original_ttl_preserved",
                "sqlite_expired_before_replay",
                "sqlite_logout_wipe_reopen",
                "sqlite_partition_isolation"
              ],
              result: "passed"
            }' > "$evidence/ios.json"
          jq -e --arg commit "$GITHUB_SHA" '
            .schema == 1 and
            .kind == "ci_mobile_revision_evidence" and
            .contentFree == true and
            .physicalDevice == false and
            .commit == $commit and
            (.commit | test("^[0-9a-f]{40}$")) and
            (.recordedAt | fromdateiso8601) and
            .application.packageId == "com.anaregdesign.lanternExample" and
            .platform.kind == "ios-simulator" and
            .network.transport == "Connect/h2c" and
            (.scenarios | length == 10) and
            .result == "passed"
          ' "$evidence/ios.json" >/dev/null

      - name: Upload sanitized iOS revision evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: lantern-ios-revision-${{ github.sha }}
          path: ${{ runner.temp }}/lantern-mobile-evidence/ios.json
          if-no-files-found: error

      - name: Show logs and clean up
        if: always()
        run: |
          cat "$RUNNER_TEMP/ios-server.log" 2>/dev/null || true
          kill "$(cat "$RUNNER_TEMP/ios-server.pid")" 2>/dev/null || true
          if [[ -f "$RUNNER_TEMP/ios-simulator-boot.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/ios-simulator-boot.pid")" 2>/dev/null || true
          fi
          device=${DEVICE_ID:-}
          if [[ -z "$device" && -f "$RUNNER_TEMP/ios-device-id" ]]; then
            device=$(cat "$RUNNER_TEMP/ios-device-id")
          fi
          if [[ -n "$device" ]]; then
            xcrun simctl shutdown "$device" || true
          fi

      - name: Delete fresh retry simulator
        if: always()
        timeout-minutes: 2
        run: |
          if [[ -f "$RUNNER_TEMP/ios-retry-device-id" ]]; then
            retry_device=$(cat "$RUNNER_TEMP/ios-retry-device-id")
            xcrun simctl shutdown "$retry_device" || true
            xcrun simctl delete "$retry_device" || true
          fi

  gate:
    name: Gate
    if: always()
    needs: [changes, test, minimum-dart, offline-test, offline-minimum-dart, offline-sqlite, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          FULL: ${{ needs.changes.outputs.full }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MINIMUM_DART_RESULT: ${{ needs.minimum-dart.result }}
          OFFLINE_TEST_RESULT: ${{ needs.offline-test.result }}
          OFFLINE_MINIMUM_DART_RESULT: ${{ needs.offline-minimum-dart.result }}
          OFFLINE_SQLITE_RESULT: ${{ needs.offline-sqlite.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          require_result() {
            local job=$1 actual=$2 expected=$3
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$job result is $actual; expected $expected"
              exit 1
            fi
          }

          require_result changes "$CHANGES_RESULT" success
          require_result test "$TEST_RESULT" success
          require_result offline-test "$OFFLINE_TEST_RESULT" success
          require_result offline-sqlite "$OFFLINE_SQLITE_RESULT" success
          if [[ "$FULL" == true ]]; then
            require_result minimum-dart "$MINIMUM_DART_RESULT" success
            require_result offline-minimum-dart "$OFFLINE_MINIMUM_DART_RESULT" success
            require_result android "$ANDROID_RESULT" success
            require_result ios "$IOS_RESULT" success
          else
            require_result minimum-dart "$MINIMUM_DART_RESULT" skipped
            require_result offline-minimum-dart "$OFFLINE_MINIMUM_DART_RESULT" skipped
            require_result android "$ANDROID_RESULT" skipped
            require_result ios "$IOS_RESULT" skipped
          fi

          echo "Full Dart/mobile matrix: $FULL" >> "$GITHUB_STEP_SUMMARY"

  release-preflight:
    name: Verify parent release candidate
    needs: [gate]
    if: startsWith(github.ref, 'refs/tags/sdks/dart/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      archive_sha256: ${{ steps.candidate.outputs.archive_sha256 }}
      archive_artifact_id: ${{ steps.archive.outputs.artifact-id }}
      publish_required: ${{ steps.state.outputs.publish_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up current supported Dart without OIDC
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12.2

      - name: Verify exact tag and build dependency-closed candidate
        id: candidate
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^sdks/dart/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
          version=${TAG#sdks/dart/v}
          test "$(awk '$1 == "name:" { print $2; exit }' sdks/dart/pubspec.yaml)" = lantern_client
          test "$(awk '$1 == "version:" { print $2; exit }' sdks/dart/pubspec.yaml)" = "$version"
          grep -Fx "## $version" sdks/dart/CHANGELOG.md

          artifact_root="$RUNNER_TEMP/lantern-client-release"
          source_dir="$artifact_root/source"
          archive="$artifact_root/lantern_client.tar.gz"
          package_dir="$artifact_root/unpacked/package"
          isolated_pub_cache="$artifact_root/pub-cache"
          mkdir -p "$source_dir" "$package_dir" "$isolated_pub_cache"
          git archive "$GITHUB_SHA:sdks/dart" | tar -x -C "$source_dir"
          (cd "$source_dir" && dart pub get --enforce-lockfile --no-example)
          dart pub publish -C "$source_dir" --to-archive="$archive"
          tar -xzf "$archive" -C "$package_dir"
          mapfile -d '' pubspecs < <(find "$package_dir" -name pubspec.yaml -print0)
          test "${#pubspecs[@]}" -gt 0
          test ! -e "$package_dir/offline"
          test ! -e "$package_dir/offline_sqlite"
          test ! -e "$package_dir/example/pubspec.yaml"
          test -f "$package_dir/example/lantern_client_example.dart"
          if grep -HnE '^[[:space:]]*lantern_client_offline(_sqlite)?:' "${pubspecs[@]}"; then
            echo "::error::parent publish archive references a repository-only offline package"
            exit 1
          fi
          for pubspec in "${pubspecs[@]}"; do
            (
              cd "$(dirname "$pubspec")"
              PUB_CACHE="$isolated_pub_cache" dart pub get --no-example
              PUB_CACHE="$isolated_pub_cache" dart analyze
            )
          done
          (cd "$package_dir" && PUB_CACHE="$isolated_pub_cache" dart test)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Verify pub.dev state and any existing archive
        id: state
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
          ARCHIVE_SHA256: ${{ steps.candidate.outputs.archive_sha256 }}
        run: |
          python3 sdks/dart/scripts/release.py preflight \
            --version "$VERSION" \
            --candidate "$RUNNER_TEMP/lantern-client-release/lantern_client.tar.gz" \
            --sha256 "$ARCHIVE_SHA256" --output "$GITHUB_OUTPUT"

      - name: Preserve the verified candidate archive
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: lantern-client-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lantern-client-release/lantern_client.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish lantern_client
    needs: [release-preflight]
    if: needs.release-preflight.outputs.publish_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pub.dev
      url: https://pub.dev/packages/lantern_client
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified candidate archive
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release-preflight.outputs.archive_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/lantern-client-release

      # This job executes no repository scripts and has no Release authority.
      # --from-archive publishes the bytes already validated in preflight.
      - name: Set up current supported Dart and pub.dev OIDC
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: 3.12.2

      - name: Publish verified archive with pub.dev OIDC
        env:
          ARCHIVE_SHA256: ${{ needs.release-preflight.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lantern-client-release/lantern_client.tar.gz"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum --check --strict
          dart pub publish --force --from-archive="$archive"

  verify-published:
    name: Verify published parent archive
    needs: [release-preflight, publish]
    if: >-
      ${{ !cancelled() && needs.release-preflight.result == 'success' &&
          (needs.publish.result == 'success' ||
           (needs.publish.result == 'skipped' && needs.release-preflight.outputs.publish_required == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download the verified candidate archive
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.release-preflight.outputs.archive_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/lantern-client-release

      - name: Verify pub.dev visibility and exact package archive contents
        env:
          VERSION: ${{ needs.release-preflight.outputs.version }}
          ARCHIVE_SHA256: ${{ needs.release-preflight.outputs.archive_sha256 }}
        run: |
          python3 sdks/dart/scripts/release.py verify \
            --version "$VERSION" \
            --candidate "$RUNNER_TEMP/lantern-client-release/lantern_client.tar.gz" \
            --sha256 "$ARCHIVE_SHA256"

  release:
    name: Create parent SDK GitHub Release
    needs: [release-preflight, verify-published]
    if: >-
      ${{ !cancelled() && needs.release-preflight.result == 'success' &&
          needs.verify-published.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # No checkout or Dart setup: this job has only Release authority.
      - name: Create exact-title GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.release-preflight.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^sdks/dart/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$TAG" = "sdks/dart/v$VERSION"
          notes_file=$(mktemp)
          {
            echo "## Lantern Dart client SDK"
            echo
            echo "Install with:"
            echo
            echo '```yaml'
            echo 'dependencies:'
            echo "  lantern_client: ^$VERSION"
            echo '```'
          } > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" \
              --notes-file "$notes_file" --verify-tag
          else
            gh release create "$TAG" --title "$TAG" \
              --notes-file "$notes_file" --verify-tag
          fi
