name: Admin Release

on:
  push:
    tags: ['admin/v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/lantern-admin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the admin gates against the tagged commit. `_verify.yml` is
  # Go-only, so we inline the bun-flavoured equivalent of `admin.yml`'s
  # lint / typecheck / codegen-up-to-date / build steps. Playwright is
  # intentionally omitted because tag-time signal is low (the SPA was
  # already exercised on the PR that landed the commit) and Chromium
  # download dominates the runtime.
  verify:
    name: Verify (admin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        # Pinned to commit SHA (v2.2.0) for supply-chain hygiene; keep in
        # lockstep with admin.yml + sdks/node.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install + build lantern-sdk (admin links via file:../sdks/node)
        working-directory: sdks/node
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute admin version
        id: admin_version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # github.ref_name is `admin/vX.Y.Z`; strip the `admin/` prefix so
          # the image tag is the plain `vX.Y.Z` (and SemVer-pure `X.Y.Z`).
          version="${TAG#admin/}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # docker/metadata-action's semver pattern engine needs the bare
          # version, not the `admin/v…` Go-module-style tag form.
          DOCKER_METADATA_PR_HEAD_SHA: ''
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.admin_version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(steps.admin_version.outputs.version, '-') }}
            type=sha
          labels: |
            org.opencontainers.image.title=lantern-admin
            org.opencontainers.image.description=Lantern admin SPA — browser-only React Router app that talks to the Lantern gateway over HTTP/JSON, served by Caddy on :8080.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/main/admin
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.admin_version.outputs.version }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
          provenance: true
          sbom: true

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          echo "$TAGS" | xargs -I {} cosign sign --yes {}@${DIGEST}

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#admin/}"
          notes_file=$(mktemp)
          {
            echo "## Lantern admin SPA"
            echo
            echo "Multi-arch container (\`linux/amd64\`, \`linux/arm64\`), signed with cosign keyless. Caddy 2 Alpine serves the React Router build on :8080 with SPA fallback."
            echo
            echo '```sh'
            echo "docker run --rm -p 8080:8080 ${IMAGE}:${version}"
            echo '```'
            echo
            echo "### OFF: direct Server with CORS"
            echo
            echo "For a local OFF trial, open http://localhost:8080, select \`http://localhost:6380\` in the Lantern picker, and set the Server's \`LANTERN_CORS_ALLOWED_ORIGINS=http://localhost:8080\`. This example has no IdP or browser session."
            echo
            echo "### OIDC: HTTPS same-origin routes"
            echo
            echo "Expose Admin and its auth/browser/RPC routes at one HTTPS public origin, for example \`https://admin.example.com:8443\`, and select that exact origin in the Lantern picker. Set \`LANTERN_OIDC_BROWSER_ORIGIN=https://admin.example.com:8443\` and register \`LANTERN_OIDC_REDIRECT_URI\` with the same origin plus the exact Issuer-specific \`/auth/callback/<SHA-256>\` path. The direct-Server default does not configure OIDC."
            echo
            echo "Caddy optionally proxies \`/auth/*\`, \`/browser/*\` and \`/graph.v1.*/*\` to the operator-fixed \`LANTERN_ADMIN_SERVER_UPSTREAM\` (\`scheme://hostname:port\`), for example \`https://writer.internal.example:6380\`. The browser's gateway picker never selects that upstream. Verify the upstream certificate against its hostname and mount \`LANTERN_ADMIN_SERVER_CA_FILE\` for a private CA. Preserve the public Host/scheme through the proxy chain and configure exact \`LANTERN_OIDC_TRUSTED_PROXY_IPS\` where required. A plaintext Server hop is permitted only behind the explicitly trusted exact gateway IP with validated HTTPS/public Host headers."
            echo
            echo "The current fixed-writer baseline pins auth/browser and security/control routes to that writer. Future eligible-node routing and per-attempt login affinity remain #1608/#1609 S5 work. Missing upstream routes fail closed instead of returning the SPA shell. The optional Prometheus proxy checks \`/auth/operations\` first: OFF permits diagnostics; OIDC requires current \`operations.read\` authority. Only GET diagnostics pass, and Prometheus never receives cookies or Authorization. Keep credentials and private keys out of the SPA, browser local storage and Vite env."
            echo
            echo "See the [OIDC operations guide](https://github.com/${REPO}/blob/${TAG}/docs/oidc-operations.md#browser-and-diagnostics-boundary), [HA runbook](https://github.com/${REPO}/blob/${TAG}/docs/ha-runbook.md) and [Server guide](https://github.com/${REPO}/blob/${TAG}/server/README.md) for the current deployment contract."
          } > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file" --verify-tag
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
