name: Admin

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'pb/openapiv2/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'pb/openapiv2/**'
      - '.github/workflows/admin.yml'

defaults:
  run:
    working-directory: admin

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Codegen (OpenAPI types)
        run: bun run codegen

      - name: Verify codegen is up to date
        run: |
          if ! git diff --quiet -- app/lib/client/infrastructure/api/lantern-api.gen.ts; then
            echo "::error::Generated API types are out of date. Run 'bun run codegen' inside admin/ and commit the result."
            git diff -- app/lib/client/infrastructure/api/lantern-api.gen.ts
            exit 1
          fi

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Playwright smoke test
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report
          retention-days: 7
