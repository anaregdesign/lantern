name: Admin

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'sdks/node/**'
      - 'proto/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'admin/**'
      - 'sdks/node/**'
      - 'proto/**'
      - '.github/workflows/admin.yml'

defaults:
  run:
    working-directory: admin

# Least-privilege default: this workflow only needs to read repo contents
# (checkout, codegen, build). It does not write to PRs, packages, deployments,
# or attestations. Overridden per-job if a step needs more.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        # Pin to commit SHA (v2.2.0) instead of the floating v2 tag so a
        # backdoored upstream release cannot silently land in our CI.
        # GitHub-owned actions (actions/checkout, actions/setup-node,
        # actions/upload-artifact) are exempt from this rule because they
        # are verified-creator immutable. Bump in lockstep with sdks/node.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install + build lantern-sdk (admin links via file:../sdks/node)
        working-directory: sdks/node
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: bun x playwright install --with-deps chromium

      - name: Playwright smoke test
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: admin/playwright-report
          retention-days: 7
