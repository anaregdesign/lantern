name: Rust SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/rust/**'
      - 'proto/**'
      - 'pb/**'
      - 'server/**'
      - 'core/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'docs/decisions/0011-native-rust-sdk.md'
      - 'docs/rust-sdk-v0.1-contract.md'
      - '.github/workflows/rust-sdk.yml'
      - '.github/workflows/rust-release.yml'
      - "!core/*.md"
      - "!pb/*.md"
      - "!sdks/rust/*.md"
      - "!server/*.md"
      - "docs/decisions/0011-native-rust-sdk.md"
      - "docs/rust-sdk-v0.1-contract.md"
  pull_request:
    paths:
      - 'sdks/rust/**'
      - 'proto/**'
      - 'pb/**'
      - 'server/**'
      - 'core/**'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - 'docs/decisions/0011-native-rust-sdk.md'
      - 'docs/rust-sdk-v0.1-contract.md'
      - '.github/workflows/rust-sdk.yml'
      - '.github/workflows/rust-release.yml'
      - "!core/*.md"
      - "!pb/*.md"
      - "!sdks/rust/*.md"
      - "!server/*.md"
      - "docs/decisions/0011-native-rust-sdk.md"
      - "docs/rust-sdk-v0.1-contract.md"

permissions:
  contents: read

defaults:
  run:
    working-directory: sdks/rust

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Verify checked-in codegen on native toolchain
        run: |
          cargo xtask codegen
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::Rust bindings drifted. Run 'cd sdks/rust && cargo xtask codegen' and commit src/generated."
            git status --short -- src/generated
            git diff -- src/generated
            exit 1
          fi
        shell: bash

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test registry release policy against controlled versions
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        run: python3 -B -m unittest discover -s ci -p 'test_*.py'
      - name: Lint all targets and features
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Check default native TLS policy
        run: cargo test --locked --no-default-features smoke::native_tls_roots_are_available_by_default
      - name: Test
        run: cargo test --locked --all-features
      - name: Compile maintained examples
        run: cargo check --locked --examples
      - name: Document without warnings
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - uses: actions/setup-go@v7
        if: matrix.rust == 'stable'
        with:
          go-version-file: go.mod
      - name: Build production server for real-wire conformance
        if: matrix.rust == 'stable'
        working-directory: .
        shell: bash
        run: |
          suffix=''
          if [[ "$RUNNER_OS" == Windows ]]; then suffix='.exe'; fi
          mkdir -p sdks/rust/target
          go build -o "sdks/rust/target/lantern-smoke$suffix" ./server/cmd
          go build -o "sdks/rust/target/lantern-authfixture$suffix" ./server/cmd/authfixture
      - name: Qualify native private-file and fixture input security
        if: matrix.rust == 'stable'
        working-directory: .
        run: go test ./core/privatefile ./server/internal/listenerlaunch ./server/provider ./server/cmd ./server/cmd/authfixture -run '^(TestCreateAndCheck|TestCreateTemp|TestUnixModeGuards|TestWindowsHandleOwnerDACL|TestWritePrivateInput|TestFixtureFailureCategory|TestReservedListenerOwnership|TestReservedListenerRoleGuards|TestListenerLaunchProtocol|TestNewListenerAdoptionRequiresCertification|TestPeerListenerAdoptionRequiresExactRuntime|TestListenerLaunchRejectsUnboundArguments|TestNativeListenerLaunchLifecycle|TestFixtureReservedEndpointValidation)$' -count=1
        env:
          LANTERN_TEST_LAUNCH_SERVER: ${{ github.workspace }}/sdks/rust/target/lantern-smoke${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Test real Health, CRUD, queries, CDC, backup, HA, and failure paths
        if: matrix.rust == 'stable'
        run: cargo test --locked --all-features -- --ignored --test-threads=1 --skip scoped_changes::tests::real_public_scoped_wire
        env:
          LANTERN_RUST_TEST_SERVER: ${{ github.workspace }}/sdks/rust/target/lantern-smoke${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          LANTERN_RUST_TEST_AUTH_FIXTURE: ${{ github.workspace }}/sdks/rust/target/lantern-authfixture${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Test certified OIDC public scoped CDC over the real Rust wire
        if: matrix.rust == 'stable'
        working-directory: .
        run: go test ./tests/integration -run '^TestAuth_OIDCRustScopedChangesFacadeRealConnect$' -count=1

      - name: Inspect and build isolated library archive
        if: matrix.os == 'ubuntu-latest' && matrix.rust == 'stable'
        shell: bash
        run: |
          expected=$(printf '%s\n' \
            .cargo_vcs_info.json CHANGELOG.md Cargo.lock Cargo.toml \
            Cargo.toml.orig LICENSE README.md RELEASING.md \
            examples/cdc_backup.rs examples/complete.rs \
            src/generated/graph.v1.rs \
            src/backup.rs src/backup/format.rs src/backup/tests.rs \
            src/batch.rs src/batch/tests.rs src/contrib.rs src/contrib/tests.rs \
            src/cdc.rs src/cdc/full.rs src/cdc/identity.rs \
            src/cdc/identity/tests.rs src/cdc/receipt.rs src/cdc/tests.rs \
            src/crud.rs src/crud/tests.rs src/discovery.rs src/discovery/tests.rs \
            src/error.rs src/lib.rs src/mutation.rs src/paging.rs src/paging/tests.rs \
            src/prefix.rs src/prefix/tests.rs src/scans.rs src/scans/tests.rs \
            src/search.rs src/search/tests.rs src/scoped_changes.rs src/smoke.rs src/test_server.rs \
            src/transport.rs src/transport/tests.rs src/traversal.rs \
            src/traversal/tests.rs \
            src/value.rs src/value/tests.rs | sort)
          actual=$(cargo package --list --locked | sort)
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected Rust crate archive inputs"
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi
          cargo package --no-verify --locked
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "lantern-client") | .version')
          test -n "$version"
          staging="$RUNNER_TEMP/lantern-rust-package"
          mkdir -p "$staging"
          tar -xzf "target/package/lantern-client-$version.crate" -C "$staging"
          (
            cd "$staging/lantern-client-$version"
            test ! -e build.rs
            test ! -e xtask
            test ! -e proto
            PROTOC=/nonexistent/protoc CARGO_TARGET_DIR="$RUNNER_TEMP/lantern-rust-archive-target" \
              cargo build --frozen
          )
