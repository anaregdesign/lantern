# CodeQL static analysis for Go and GitHub Actions workflows.
# Filed as part of the #295 quick-win backlog. Job names ('Analyze (go)' /
# 'Analyze (actions)') are reserved for the default-branch trend view in
# the Security tab — do not rename without retraining branch protection.

name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly Monday 06:00 UTC sweep so a stale main still gets a fresh
    # baseline even when no PRs land.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    uses: ./.github/workflows/validation-scope.yml

  analyze:
    needs: scope
    if: needs.scope.outputs.codeql_languages != '[]'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.codeql_languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 'security-extended' adds higher-precision queries beyond the
          # default suite. 'security-and-quality' would also pull in
          # maintainability rules — out of scope for a security baseline.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"


  selection-failure:
    name: Check selected jobs
    needs: [scope, analyze]
    if: >-
      always() && (needs.scope.result != 'success' ||
      ((needs.scope.outputs.codeql_languages != '[]') && needs.analyze.result != 'success') ||
      (!(needs.scope.outputs.codeql_languages != '[]') && needs.analyze.result != 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Report missing or unsuccessful selected job
        working-directory: .
        run: |
          echo "::error::The changed-file selection or a selected job did not complete successfully"
          exit 1
