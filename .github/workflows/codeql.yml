# CodeQL static analysis for Go and GitHub Actions workflows.
# Filed as part of the #295 quick-win backlog. Job names ('Analyze (go)' /
# 'Analyze (actions)') are reserved for the default-branch trend view in
# the Security tab — do not rename without retraining branch protection.

name: CodeQL

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!.github/*.md"
      - "!AGENTS.md"
      - "!CLAUDE.md"
      - "!CONTRIBUTING.md"
      - "!README.md"
      - "!docs/**/*.md"
      - "!admin/*.md"
      - "!core/*.md"
      - "!deploy/compose/*.md"
      - "!deploy/helm/lantern/*.md"
      - "!mcp/*.md"
      - "!mcp/examples/*.md"
      - "!pb/*.md"
      - "!sdks/dart/*.md"
      - "!sdks/dart/example/*.md"
      - "!sdks/dart/offline/*.md"
      - "!sdks/dart/offline_sqlite/*.md"
      - "!sdks/go/*.md"
      - "!sdks/node/*.md"
      - "!sdks/python.archived/*.md"
      - "!sdks/rust/*.md"
      - "!server/*.md"
      - "!testbed/*.md"
      - "!testbed/bench/*.md"
      - "!testbed/dart-transport-probe/*.md"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "docs/decisions/0002-dart-offline-repository-contract.md"
      - "docs/decisions/0011-native-rust-sdk.md"
      - "docs/env.md"
      - "docs/rust-sdk-v0.1-contract.md"
      - "!sdks/dart/example/evidence/offline-release/*.json"
  pull_request:
    branches: ["main"]
    paths:
      - "**"
      - "!.github/*.md"
      - "!AGENTS.md"
      - "!CLAUDE.md"
      - "!CONTRIBUTING.md"
      - "!README.md"
      - "!docs/**/*.md"
      - "!admin/*.md"
      - "!core/*.md"
      - "!deploy/compose/*.md"
      - "!deploy/helm/lantern/*.md"
      - "!mcp/*.md"
      - "!mcp/examples/*.md"
      - "!pb/*.md"
      - "!sdks/dart/*.md"
      - "!sdks/dart/example/*.md"
      - "!sdks/dart/offline/*.md"
      - "!sdks/dart/offline_sqlite/*.md"
      - "!sdks/go/*.md"
      - "!sdks/node/*.md"
      - "!sdks/python.archived/*.md"
      - "!sdks/rust/*.md"
      - "!server/*.md"
      - "!testbed/*.md"
      - "!testbed/bench/*.md"
      - "!testbed/dart-transport-probe/*.md"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "docs/decisions/0002-dart-offline-repository-contract.md"
      - "docs/decisions/0011-native-rust-sdk.md"
      - "docs/env.md"
      - "docs/rust-sdk-v0.1-contract.md"
      - "!sdks/dart/example/evidence/offline-release/*.json"
  schedule:
    # Weekly Monday 06:00 UTC sweep so a stale main still gets a fresh
    # baseline even when no PRs land.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # 'security-extended' adds higher-precision queries beyond the
          # default suite. 'security-and-quality' would also pull in
          # maintainability rules — out of scope for a security baseline.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
