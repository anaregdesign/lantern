name: Python SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python/**'
      - 'proto/**'
      - '.github/workflows/python-sdk.yml'
    tags:
      - 'sdks/python/v*'
  pull_request:
    paths:
      - 'sdks/python/**'
      - 'proto/**'
      - '.github/workflows/python-sdk.yml'

defaults:
  run:
    working-directory: sdks/python

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # Pin so a fresh uv release can't silently break CI. Dependabot's
          # github-actions ecosystem will bump this via PR (#295).
          version: '0.11.19'
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Verify codegen is up to date
        run: |
          uv run scripts/codegen.sh
          if ! git diff --quiet -- src/lantern_client/_pb; then
            echo "::error::Generated stubs are out of date. Run 'sdks/python/scripts/codegen.sh' and commit."
            git diff -- src/lantern_client/_pb
            exit 1
          fi
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest -v

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/sdks/python/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # for PyPI trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/lantern-sdk
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install Python
        run: uv python install 3.12
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
