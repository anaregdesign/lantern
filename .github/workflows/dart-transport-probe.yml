name: Dart transport probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dart-transport-probe.yml"
      - "docs/decisions/0001-dart-mobile-transport.md"
      - "proto/**"
      - "server/**"
      - "core/privatefile/**"
      - "testbed/scripts/dart_transport_fixture.sh"
      - "testbed/dart-transport-probe/**"
      - "!testbed/dart-transport-probe/*.md"
      - "docs/decisions/0001-dart-mobile-transport.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart:
    name: Generate, analyze, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Install Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.71.0

      - name: Regenerate and check drift
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          testbed/dart-transport-probe/scripts/codegen.sh
          git diff --exit-code -- testbed/dart-transport-probe

      - name: Check Connect candidate
        working-directory: testbed/dart-transport-probe/connect
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed \
            lib/probe.dart test tool ../templates/connect ../templates/main.dart
          dart analyze
          dart test

      - name: Check gRPC candidate
        working-directory: testbed/dart-transport-probe/grpc
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed \
            lib/probe.dart test tool ../templates/grpc
          dart analyze
          dart test

  ios:
    name: iOS real-wire (${{ matrix.transport }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        transport: [connect, grpc]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Build production probe server and native fixture
        shell: bash
        run: |
          set -euo pipefail
          probe_app="$RUNNER_TEMP/lantern"
          probe_fixture="$RUNNER_TEMP/lantern-authfixture"
          go build -o "$probe_app" ./server/cmd
          go build -o "$probe_fixture" ./server/cmd/authfixture
          echo "PROBE_APP=$probe_app" >> "$GITHUB_ENV"
          echo "PROBE_FIXTURE=$probe_fixture" >> "$GITHUB_ENV"
          echo "LANTERN_PROBE_WORKDIR=$RUNNER_TEMP/dart-mobile" >> "$GITHUB_ENV"

      - name: Start plaintext and TLS probe servers
        shell: bash
        run: |
          set -euo pipefail
          env LANTERN_PORT=6433 LANTERN_METRICS_ADDR=:9143 \
            LANTERN_LOG_LEVEL=warn nohup "$PROBE_APP" \
            >"$RUNNER_TEMP/plain.log" 2>&1 &
          plain_pid=$!
          echo "PLAIN_PID=$plain_pid" >> "$GITHUB_ENV"
          bash testbed/scripts/dart_transport_fixture.sh start \
            "$PROBE_APP" "$PROBE_FIXTURE" "$RUNNER_TEMP/transport-native" 6434
          python3 - "$RUNNER_TEMP/transport-native/metadata.json" "$GITHUB_ENV" <<'PY'
          import json,pathlib,sys
          m=json.loads(pathlib.Path(sys.argv[1]).read_text())
          node=m['nodes'][0]
          with open(sys.argv[2], 'a') as out:
              out.write('PROBE_CA='+m['ca_file']+'\n')
              out.write('PROBE_CERT='+node['environment']['LANTERN_TLS_CERT_FILE']+'\n')
          PY

          for port in 9143; do
            ready=0
            for _ in {1..60}; do
              if curl --fail --silent "http://127.0.0.1:$port/healthz" >/dev/null; then
                ready=1
                break
              fi
              sleep 1
            done
            if [[ $ready -ne 1 ]]; then
              cat "$RUNNER_TEMP/plain.log"
              exit 1
            fi
          done

      - name: Boot iOS simulator
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | \
            jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices | grep "$device"
          echo "DEVICE_ID=$device" >> "$GITHUB_ENV"

      - name: Run candidate on iOS
        timeout-minutes: 15
        env:
          LANTERN_PROBE_DRIVER: simctl
          LANTERN_PROBE_SERVER_CERT: ${{ env.PROBE_CERT }}
        run: |
          testbed/dart-transport-probe/scripts/mobile.sh \
            "${{ matrix.transport }}" "$DEVICE_ID" http://127.0.0.1:6433 \
            https://localhost:6434 "$RUNNER_TEMP/transport-native/token" "$PROBE_CA"

      - name: Show server logs and clean up
        if: always()
        shell: bash
        run: |
          cat "$RUNNER_TEMP/plain.log" 2>/dev/null || true
          kill "${PLAIN_PID:-}" 2>/dev/null || true
          bash testbed/scripts/dart_transport_fixture.sh stop "$RUNNER_TEMP/transport-native"
          if [[ -n ${DEVICE_ID:-} ]]; then
            xcrun simctl shutdown "$DEVICE_ID" || true
          fi
