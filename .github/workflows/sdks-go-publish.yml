# Tag-triggered verification + release notes for the Go client SDK.
# The Go module ecosystem pulls source directly from VCS — there is no
# artifact to push — but a `sdks/go/vX.Y.Z` tag bypasses the regular
# Go CI run. This workflow can withhold the GitHub Release, but a
# pushed tag may become visible to the Go module proxy independently.
# This mirrors the verify+release-notes pattern in `mcp-publish.yml`
# (sans the Docker push).
#
# Per AGENTS.md "Release title convention (locked)": title MUST equal
# the raw tag name verbatim.

name: SDKs/Go Release

on:
  push:
    tags: ['sdks/go/v*.*.*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shared workspace gate — see _verify.yml and #295. Covers all six Go
  # modules, but workspace replacements can hide an unpublished/stale pb.
  verify:
    uses: ./.github/workflows/_verify.yml

  standalone:
    name: Verify tagged SDK against published pb
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdks/go/go.mod
          check-latest: true
      - name: Test release verifier (no network)
        run: python3 -m unittest discover -s .github/scripts -p 'test_verify_go_sdk_release.py'
      - name: Verify exact SDK tag outside go.work
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/verify_go_sdk_release.py --tag "$TAG"

  release:
    name: Publish GitHub Release
    needs: [verify, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#sdks/go/}"
          notes_file=$(mktemp)
          {
            echo "## Lantern Go client SDK"
            echo
            echo "Pull with:"
            echo
            echo '```sh'
            echo "go get github.com/anaregdesign/lantern/sdks/go@${version}"
            echo '```'
            echo
            echo "Import as \`github.com/anaregdesign/lantern/sdks/go\` (package name remains \`client\`)."
          } > "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes_file" --verify-tag
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
