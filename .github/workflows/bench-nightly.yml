name: Bench (manual qualification)

# On-demand leak + metric + semantic + perf gate. Runs the same compact scenario sweep as
# the release-time bench (testbed/bench/release-scenarios.txt) against a
# freshly-built lantern:local image, but — unlike the release bench, which is
# deliberately `continue-on-error` so a hiccup can never block shipping
# (#256, #394) — this job has NO continue-on-error. release.sh exits non-zero
# when any scenario's goroutine/heap leak gate, lifecycle metric gate,
# semantic probe, or perf floor trips. Per-producer Search gates prevent fast
# Put traffic from hiding a slow Search family, so a correctness, retention,
# or step-change performance regression fails this
# manually requested qualification rather than merely warning in an advisory artifact.
# This is the enforcement half of #716 (leaks), #935 (perf floors), and #1063
# (Search qualification).
#
# It also runs with RELEASE_BENCH_BUDGET_SECONDS=0 (the sweep's graceful
# wall-clock cutoff disabled), so every scenario runs to completion and no leak
# can hide behind a budget-truncated tail. To keep that un-truncated sweep inside
# a sane CI timeout it runs LEAK_GATE_ONLY=1, which drops the pprof + Prometheus
# captures the leak verdict never reads (they, not the fixed phase durations, are
# what made the sweep balloon past an hour — see #727). The job `timeout-minutes`
# is the only backstop.

on:
  workflow_dispatch:
    inputs:
      diagnostic_scenario:
        description: 'Run one canonical scenario for diagnosis (leave empty for the full gate)'
        required: false
        type: string
      diagnostic_log_capacity:
        description: 'Optional mutation log capacity for the diagnostic scenario'
        required: false
        type: string
      diagnostic_subscriber_buffer:
        description: 'Optional subscriber buffer for the diagnostic scenario (default 512)'
        required: false
        type: string

# A new manual run supersedes an in-flight one rather than queueing a second
# 3-replica compose stack on a fresh runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  leak-gate:
    name: Manual benchmark qualification
    runs-on: ubuntu-latest
    # Sizing (see #727): with full pprof + Prometheus capture the un-truncated
    # sweep ran ~55-65 min on current ubuntu-latest runners — ~2.5x the stale
    # "~23 min" estimate — and the old 60 min cap cancelled run 27807832936
    # mid-sweep before it could render a verdict. The fix is NOT a bigger cap but
    # LEAK_GATE_ONLY=1 below, which drops the diagnostic captures the gate never
    # reads (24 pprof + 12 prom curls per scenario); that returns the sweep to
    # ~deterministic phase time plus isolated cluster lifecycles (~25-26 min)
    # and image build/setup, ~35-40 min before the receipt qualification.
    # Four sequential fresh-WAL receipt families add 4 x (10/45/10s plus
    # Compose setup/teardown). 60 min bounds a wedged run without truncating
    # the added families, and remains below the rejected 90 min cap.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Validate diagnostic request
        env:
          DIAGNOSTIC_SCENARIO: ${{ inputs.diagnostic_scenario }}
          DIAGNOSTIC_LOG_CAPACITY: ${{ inputs.diagnostic_log_capacity }}
          DIAGNOSTIC_SUBSCRIBER_BUFFER: ${{ inputs.diagnostic_subscriber_buffer }}
        run: |
          set -euo pipefail
          if [[ -z "$DIAGNOSTIC_SCENARIO" ]]; then
            [[ -z "$DIAGNOSTIC_LOG_CAPACITY" && -z "$DIAGNOSTIC_SUBSCRIBER_BUFFER" ]] ||
              { echo 'diagnostic overrides require diagnostic_scenario' >&2; exit 1; }
          fi
          if [[ -n "$DIAGNOSTIC_SUBSCRIBER_BUFFER" ]]; then
            [[ "$DIAGNOSTIC_SUBSCRIBER_BUFFER" =~ ^[1-9][0-9]{0,5}$ ]] &&
              (( DIAGNOSTIC_SUBSCRIBER_BUFFER <= 100000 )) ||
              { echo 'diagnostic_subscriber_buffer must be an integer from 1 to 100000' >&2; exit 1; }
          fi
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          check-latest: true
      - name: Install bench prerequisites (ghz, yq)
        run: |
          set -euo pipefail
          GHZ_VERSION="0.121.0"
          curl -fsSL -o /tmp/ghz.tgz \
            "https://github.com/bojand/ghz/releases/download/v${GHZ_VERSION}/ghz-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/ghz.tgz -C /usr/local/bin ghz
          sudo chmod +x /usr/local/bin/ghz
          ghz --version
          YQ_VERSION="v4.45.4"
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Run deterministic advanced Search wire contracts
        # search_churn covers positions-on plus every advanced producer. This
        # real-h2c test adds the positions-off fail-closed contract without
        # relying on shared-runner timing.
        run: |
          go test ./tests/integration -run 'TestSearchVertices_(OptionsContract|PositionsOff)$'
      - name: Build lantern:local image
        run: |
          docker build \
            --build-arg VERSION=manual-bench \
            --build-arg COMMIT=${{ github.sha }} \
            -t lantern:local .
      - name: Pin receipt image identity
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' lantern:local)"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
          echo "RECEIPT_IMAGE_ID=$image_id" >> "$GITHUB_ENV"
      - name: Verify qualification host and source
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] ||
            { echo 'qualification checkout differs from requested source' >&2; exit 1; }
          running_containers="$(docker ps -q)"
          [[ -z "$running_containers" ]] ||
            { echo 'qualification runner is not free of existing containers' >&2; exit 1; }
          image_commit="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' lantern:local | sed -n 's/^LANTERN_COMMIT=//p')"
          [[ "$image_commit" == "$GITHUB_SHA" ]] ||
            { echo 'qualification image differs from requested source' >&2; exit 1; }
          cpus="$(nproc)"
          for attempt in $(seq 1 19); do
            load="$(awk '{print $1}' /proc/loadavg)"
            if awk -v host_load="$load" -v cpus="$cpus" 'BEGIN { exit !(host_load < cpus / 2) }'; then
              break
            fi
            if [[ "$attempt" -eq 19 ]]; then
              echo "qualification runner remained busy after 180s: 1m load=$load cpus=$cpus" >&2
              exit 1
            fi
            sleep 10
          done
          printf 'source=%s image=%s runner=%s/%s cpus=%s\n' \
            "$GITHUB_SHA" "$(docker image inspect --format '{{.Id}}' lantern:local)" \
            "$RUNNER_OS" "$RUNNER_ARCH" "$cpus"
          printf 'preflight_load_1m=%s (must be < cpus/2, cpus=%s)\n' "$load" "$cpus"
          free -h
          uptime
      - name: Run manual leak-gate sweep (blocking)
        if: inputs.diagnostic_scenario == ''
        env:
          TAG: manual-bench
          COMMIT: ${{ github.sha }}
          RUNNER: linux/amd64 (ubuntu-latest)
          LANTERN_IMAGE: lantern:local
          # Retain the small ghz/runtime summaries for failed producer
          # attribution; the release script still tears down each cluster.
          KEEP_OUT: "1"
          # Leak-gate-only: skip the pprof + Prometheus captures the leak verdict
          # never reads (they dominate per-scenario wall-time). This is what lets
          # the un-truncated sweep finish inside timeout-minutes. The advisory
          # release-time bench omits this and keeps full capture for its
          # throughput report. See #727.
          LEAK_GATE_ONLY: "1"
          # Disable the graceful truncation budget so every scenario runs and a
          # leak in a tail scenario cannot be silently skipped. The job
          # timeout-minutes above is the hard backstop.
          RELEASE_BENCH_BUDGET_SECONDS: "0"
        # No continue-on-error: a non-zero exit (any scenario's leak gate failed,
        # or a harness/setup error) fails this requested qualification.
        run: ./testbed/bench/release.sh --out bench-report.md
      - name: Run one diagnostic scenario
        id: diagnostic
        if: inputs.diagnostic_scenario != ''
        env:
          LANTERN_IMAGE: lantern:local
          LEAK_GATE_ONLY: '1'
          KEEP_UP: ${{ (inputs.diagnostic_scenario == 'broad_rw' || inputs.diagnostic_scenario == 'broad_mutate') && '1' || '0' }}
          DIAGNOSTIC_SCENARIO: ${{ inputs.diagnostic_scenario }}
          LANTERN_BENCH_MUTATION_LOG_CAPACITY: ${{ inputs.diagnostic_log_capacity }}
          LANTERN_MUTATION_LOG_SUBSCRIBER_BUFFER: ${{ inputs.diagnostic_subscriber_buffer }}
        run: ./testbed/bench/run.sh "$DIAGNOSTIC_SCENARIO"
      - name: Summarize diagnostic RPC errors
        if: always() && inputs.diagnostic_scenario != '' && steps.diagnostic.outcome != 'skipped'
        run: |
          set -euo pipefail
          find testbed/bench/out -name 'ghz_steady_*.json' -print0 | sort -z | while IFS= read -r -d '' file; do
            echo "$(basename "$file")"
            jq -r '
              (.errorDistribution // {}) | to_entries | map({
                count: .value,
                reason: (if (.key | contains("graph publication changed during read")) then "publication_changed_during_read"
                         elif (.key | contains("mutation publication or Snapshot install requires repair")) then "publication_or_snapshot_gap"
                         elif (.key | contains("Snapshot install already in progress")) then "snapshot_install_in_progress"
                         elif (.key | contains("local mutation publication repair")) then "local_publication_repair"
                         else "other" end)
              }) | group_by(.reason)[] | "  \(.[0].reason): \(map(.count) | add)"
            ' "$file"
          done
      - name: Summarize diagnostic replication health
        if: always() && (inputs.diagnostic_scenario == 'broad_rw' || inputs.diagnostic_scenario == 'broad_mutate') && steps.diagnostic.outcome != 'skipped'
        run: |
          set -euo pipefail
          for port in 9390 9391 9392; do
            echo "replica=localhost:${port}"
            curl -fsS --max-time 10 "http://localhost:${port}/metrics" |
              awk '$1 ~ /^lantern_(mutation_log_(entries_total|capacity|fill_ratio|evicted_total)|mutationlog_subscriber_dropped_total|subscribe_(active_streams|dropped_total)|replication_(applied_total|apply_total|dropped_total|lag_seq)|peer_connected|snapshot_replayed_total|anti_entropy_(cycles_total|gaps_found_total))(\{|$)/ {print}'
          done
      - name: Summarize diagnostic peer repairs
        if: always() && (inputs.diagnostic_scenario == 'broad_rw' || inputs.diagnostic_scenario == 'broad_mutate') && steps.diagnostic.outcome != 'skipped'
        run: |
          set -euo pipefail
          for replica in lantern-0 lantern-1 lantern-2; do
            echo "replica=${replica}"
            docker compose --project-name lantern-bench \
              -f deploy/compose/docker-compose.yml \
              -f testbed/bench/compose.override.yml \
              logs --no-color --since 10m "$replica" |
              awk '
                /replication pump: peer transition|replication pump: peer session error|anti-entropy: PeerStatus failed|anti-entropy: peer ahead, catching up|anti-entropy: Subscribe gapped|anti-entropy: catch-up failed|anti-entropy: caught up|local mutation log append failed/ {
                  matches++
                  if (matches <= 80) first[matches] = $0
                  last[matches % 160] = $0
                }
                END {
                  first_count = matches < 80 ? matches : 80
                  last_start = matches > 240 ? matches - 159 : first_count + 1
                  printf "peer_repair_events=%d, showing first %d and last %d\n", matches, first_count, matches - last_start + 1
                  for (i = 1; i <= first_count; i++) print first[i]
                  for (i = last_start; i <= matches; i++) print last[i % 160]
                }
              '
          done
      - name: Stop diagnostic cluster
        if: always() && (inputs.diagnostic_scenario == 'broad_rw' || inputs.diagnostic_scenario == 'broad_mutate') && steps.diagnostic.outcome != 'skipped'
        run: docker compose --project-name lantern-bench -f deploy/compose/docker-compose.yml -f testbed/bench/compose.override.yml down -v --remove-orphans
      - name: Run four receipt admission and lookup gates (blocking)
        if: inputs.diagnostic_scenario == ''
        env:
          LANTERN_IMAGE: lantern:local
          EXPECTED_LANTERN_IMAGE_ID: ${{ env.RECEIPT_IMAGE_ID }}
          EXPECTED_LANTERN_COMMIT: ${{ github.sha }}
          LEAK_GATE_ONLY: "1"
        run: |
          set -euo pipefail
          for scenario in \
            receipt_vertex_put_admission_lookup \
            receipt_vertex_delete_admission_lookup \
            receipt_admission_lookup \
            receipt_edge_add_admission_lookup; do
            ./testbed/bench/run.sh "$scenario"
          done
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report-manual
          path: |
            bench-report.md
            testbed/bench/out/broad_rw/
            testbed/bench/out/broad_mutate/
            testbed/bench/out/edge_contrib_idempotent/
            testbed/bench/out/receipt_admission_lookup/
            testbed/bench/out/receipt_vertex_put_admission_lookup/
            testbed/bench/out/receipt_vertex_delete_admission_lookup/
            testbed/bench/out/receipt_edge_add_admission_lookup/
          if-no-files-found: warn
          retention-days: 30
