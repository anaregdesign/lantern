name: Bench (nightly leak gate)

# Nightly BLOCKING leak + perf gate. Runs the same compact scenario sweep as
# the release-time bench (testbed/bench/release-scenarios.txt) against a
# freshly-built lantern:local image, but — unlike the release bench, which is
# deliberately `continue-on-error` so a hiccup can never block shipping
# (#256, #394) — this job has NO continue-on-error. release.sh exits non-zero
# when any scenario's goroutine/heap leak gate trips OR any scenario's
# perf_gate floors (min steady rps / max p99 / max non-OK ratio, #935) are
# breached, so a leak or step-change performance regression fails this
# nightly check rather than merely warning in an advisory artifact.
# This is the enforcement half of #716 (leaks) and #935 (perf floors).
#
# It also runs with RELEASE_BENCH_BUDGET_SECONDS=0 (the sweep's graceful
# wall-clock cutoff disabled), so every scenario runs to completion and no leak
# can hide behind a budget-truncated tail. To keep that un-truncated sweep inside
# a sane CI timeout it runs LEAK_GATE_ONLY=1, which drops the pprof + Prometheus
# captures the leak verdict never reads (they, not the fixed phase durations, are
# what made the sweep balloon past an hour — see #727). The job `timeout-minutes`
# is the only backstop.

on:
  schedule:
    # 18:00 UTC daily — off-peak for the maintainers and well clear of the
    # release pipeline. Scheduled runs always use the default branch (main).
    - cron: '0 18 * * *'
  workflow_dispatch: {}

# A new nightly supersedes an in-flight one rather than queueing a second
# 3-replica compose stack on a fresh runner.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  leak-gate:
    name: Nightly leak gate
    runs-on: ubuntu-latest
    # Sizing (see #727): with full pprof + Prometheus capture the un-truncated
    # sweep ran ~55-65 min on current ubuntu-latest runners — ~2.5x the stale
    # "~23 min" estimate — and the old 60 min cap cancelled run 27807832936
    # mid-sweep before it could render a verdict. The fix is NOT a bigger cap but
    # LEAK_GATE_ONLY=1 below, which drops the diagnostic captures the gate never
    # reads (24 pprof + 12 prom curls per scenario); that returns the sweep to
    # ~deterministic phase time (~23 min) + image build/setup, ~35-40 min total.
    # 50 min leaves headroom for a slow cold build while still bounding a wedged
    # scenario — and is well under the rejected 90 min.
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          check-latest: true
      - name: Install bench prerequisites (ghz, yq)
        run: |
          set -euo pipefail
          GHZ_VERSION="0.121.0"
          curl -fsSL -o /tmp/ghz.tgz \
            "https://github.com/bojand/ghz/releases/download/v${GHZ_VERSION}/ghz-linux-x86_64.tar.gz"
          sudo tar -xzf /tmp/ghz.tgz -C /usr/local/bin ghz
          sudo chmod +x /usr/local/bin/ghz
          ghz --version
          YQ_VERSION="v4.45.4"
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Build lantern:local image
        run: |
          docker build \
            --build-arg VERSION=nightly \
            --build-arg COMMIT=${{ github.sha }} \
            -t lantern:local .
      - name: Run nightly leak-gate sweep (blocking)
        env:
          TAG: nightly
          COMMIT: ${{ github.sha }}
          RUNNER: linux/amd64 (ubuntu-latest)
          LANTERN_IMAGE: lantern:local
          # Leak-gate-only: skip the pprof + Prometheus captures the leak verdict
          # never reads (they dominate per-scenario wall-time). This is what lets
          # the un-truncated sweep finish inside timeout-minutes. The advisory
          # release-time bench omits this and keeps full capture for its
          # throughput report. See #727.
          LEAK_GATE_ONLY: "1"
          # Disable the graceful truncation budget so every scenario runs and a
          # leak in a tail scenario cannot be silently skipped. The job
          # timeout-minutes above is the hard backstop.
          RELEASE_BENCH_BUDGET_SECONDS: "0"
        # No continue-on-error: a non-zero exit (any scenario's leak gate failed,
        # or a harness/setup error) fails this required nightly check.
        run: ./testbed/bench/release.sh --out bench-report.md
      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-report-nightly
          path: bench-report.md
          if-no-files-found: warn
          retention-days: 30
