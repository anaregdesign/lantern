version: v2
managed:
  enabled: true
  disable:
    # Don't regenerate googleapis types under our module path — consume them
    # from the upstream google.golang.org/genproto module instead.
    - module: buf.build/googleapis/googleapis
  override:
    # Generated stubs live in their own `pb/` module so both the server and the
    # Go SDK can depend on the proto contract without depending on each other.
    - file_option: go_package_prefix
      value: github.com/anaregdesign/lantern/pb
plugins:
  - remote: buf.build/protocolbuffers/go
    out: pb
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: pb
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  - remote: buf.build/grpc-ecosystem/gateway
    out: pb
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: pb/openapiv2
  # Connect-Go stubs land alongside the gRPC stubs under
  # pb/graph/v1/graphv1connect/ — the canonical *Connect/* sub-package
  # convention from connectrpc.com/connect. Kept additive alongside the
  # gRPC + grpc-gateway outputs while the Connect-only migration (#335)
  # is in flight; the gRPC and gateway plugins are removed in #342 once
  # every consumer has flipped over.
  - remote: buf.build/connectrpc/go
    out: pb
    opt:
      - paths=source_relative
inputs:
  - directory: proto
