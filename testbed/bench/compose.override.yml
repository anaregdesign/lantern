# OFF-only profiling overlay for the explicit native benchmark base.
# Native peer trust and workload identity come from per-node env files.
# Protected receipt runs use compose.receipt-tls.yml to remove anonymous
# diagnostics ports and profiling; an owned loopback collector reads metrics.

x-lantern-bench-env: &lantern-bench-env
  LANTERN_METRICS_ADDR: ":9090"
  LANTERN_PPROF_ENABLED: "true"
  # Sample 1/N events. Non-zero values are required for /debug/pprof/mutex
  # and /debug/pprof/block to return useful data. Cheap at these rates.
  LANTERN_MUTEX_PROFILE_FRACTION: "100"
  LANTERN_BLOCK_PROFILE_RATE: "10000"
  # Shrink the mutation-log ring from the prod default (100k) to a bench
  # size. At 5k RPS for 5min the steady-state phase generates ~1.5M ops,
  # so a 10k ring overflows ~150x — exercising gap-fill / snapshot paths
  # while keeping legitimate ring retention well under the leak_gate
  # heap budget. See issue #254.
  LANTERN_MUTATION_LOG_CAPACITY: "${LANTERN_BENCH_MUTATION_LOG_CAPACITY:-10000}"
  # Inherit only when explicitly set by a diagnostic; otherwise keep the
  # server default, including future default changes.
  LANTERN_MUTATION_LOG_SUBSCRIBER_BUFFER:
  # Per-scenario cluster TTL / GC tick. run.sh exports the LANTERN_BENCH_*
  # host vars from a scenario's optional `cluster:` block; both fall back to
  # the canonical 3600/60 when unset, so scenarios without a `cluster:` block
  # are unaffected. These override the canonical x-lantern-common values
  # because the override file is merged last (per-key environment merge).
  # Lets leak scenarios (search_churn, replication_apply_churn) drive prompt
  # TTL eviction so the index / vertexHLC maps demonstrably shrink back to
  # baseline during cooldown. See issue #711.
  LANTERN_DEFAULT_TTL_SECONDS: "${LANTERN_BENCH_DEFAULT_TTL_SECONDS:-3600}"
  LANTERN_GC_INTERVAL_SECONDS: "${LANTERN_BENCH_GC_INTERVAL_SECONDS:-60}"
  # Separate retained HA metadata budgets. They default to unlimited for
  # scenarios that do not exercise the #1204 contract; ttl_churn supplies an
  # exact bounded identity set and gates its high-water independently of live
  # graph capacity.
  LANTERN_MAX_VERTEX_CAUSAL_ENTRIES: "${LANTERN_BENCH_MAX_VERTEX_CAUSAL_ENTRIES:-0}"
  LANTERN_MAX_EDGE_CAUSAL_ENTRIES: "${LANTERN_BENCH_MAX_EDGE_CAUSAL_ENTRIES:-0}"
  # Optional per-scenario search toggle. Defaults to the server default (on).
  # A leak scenario that exercises an unrelated structure under high-cardinality
  # unique content (e.g. replication_apply_churn isolating vertexHLC) can turn
  # search off so the InvertedIndex does not dominate the heap signal.
  LANTERN_SEARCH_ENABLED: "${LANTERN_BENCH_SEARCH_ENABLED:-true}"
  # Receipt scenarios opt into one fresh durable WAL per replica. Empty
  # defaults preserve graph-only behavior for every existing scenario.
  LANTERN_BACKUP_RESTORE_ON_START: "${LANTERN_BENCH_BACKUP_RESTORE_ON_START:-true}"

services:
  lantern-0:
    environment:
      <<: *lantern-bench-env
    ports:
      - "127.0.0.1:${LANTERN_BENCH_METRICS_PORT_0:-9390}:9090"

  lantern-1:
    environment:
      <<: *lantern-bench-env
    ports:
      - "127.0.0.1:${LANTERN_BENCH_METRICS_PORT_1:-9391}:9090"

  lantern-2:
    environment:
      <<: *lantern-bench-env
    ports:
      - "127.0.0.1:${LANTERN_BENCH_METRICS_PORT_2:-9392}:9090"
