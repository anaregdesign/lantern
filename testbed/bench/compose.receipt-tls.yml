# Protected native receipt overlay. Trust, authority and machine Role bindings
# are generated into each workload's private env file before Compose starts.
x-protected-env: &protected-env
  LANTERN_METRICS_ADDR: "127.0.0.1:9090"
  LANTERN_PPROF_ENABLED: "false"
  LANTERN_MUTEX_PROFILE_FRACTION: "0"
  LANTERN_BLOCK_PROFILE_RATE: "0"
  LANTERN_BACKUP_RESTORE_ON_START: "false"
  LANTERN_RECEIPT_MAX_BYTES: "${LANTERN_BENCH_RECEIPT_MAX_BYTES:?receipt byte budget required}"
  LANTERN_RECEIPT_MAX_ENTRIES: "${LANTERN_BENCH_RECEIPT_MAX_ENTRIES:?receipt entry budget required}"
  LANTERN_RECEIPT_RETENTION: "${LANTERN_BENCH_RECEIPT_RETENTION:?receipt retention required}"
services:
  lantern-0:
    environment:
      <<: *protected-env
    ports: !override ["127.0.0.1:${LANTERN_BENCH_PUBLIC_PORT_0:-6380}:6380"]
  lantern-1:
    environment:
      <<: *protected-env
    ports: !override ["127.0.0.1:${LANTERN_BENCH_PUBLIC_PORT_1:-6381}:6380"]
  lantern-2:
    environment:
      <<: *protected-env
    ports: !override ["127.0.0.1:${LANTERN_BENCH_PUBLIC_PORT_2:-6382}:6380"]
