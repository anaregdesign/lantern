# prefix_surface — exercises the full prefix API surface under concurrent
# load to catch correctness regressions and data races:
#
# - ScanVertexKeys   : keys-only listing (no vertex deserialization)
# - ScanEdges        : edge-weight scan
# - CountVerticesByPrefix : aggregate count, now emits lantern_scan_* metrics
# - DeleteVerticesByPrefix: bulk delete — asserts count returns 0 after delete
#
# The "k-*" keyspace is seeded by broad_rw.  Run this scenario AFTER
# broad_rw, or add a seed phase here.
#
# thread-safety: all four calls may run concurrently under the read lock
# of GraphCache; DeleteVerticesByPrefix takes the write lock.
# consistency: CountVerticesByPrefix must be ≤ the count observed just
# before the delete phase.
name: prefix_surface
phases:
  warmup:
    duration: 30s
    concurrency: 8
    rps: 200
    # seed: write k-* vertices so the prefix scans have something to return
    calls:
      - call: graph.v1.LanternService/PutVertex
        data_template: |
          {"vertex":{"key":"k-{{mod .RequestNumber 2000}}","string_":"val-{{.RequestNumber}}","expiration":"{{timeAfterSeconds 300}}"}}
  steady:
    duration: 90s
    concurrency: 16
    rps: 1000
  cooldown: 30s
target:
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  calls:
    # [0] keys-only scan: low-bandwidth, high-frequency; exercises
    #     ScanVertexKeys hot path (now tracked by lantern_scan_ops)
    - call: graph.v1.LanternService/ScanVertexKeys
      data_template: |
        {"prefix":"k-","limit":100}
    # [1] full edge scan
    - call: graph.v1.LanternService/ScanEdges
      data_template: |
        {"prefix":"k-","limit":100}
    # [2] aggregate count — now emits OnScan("CountVerticesByPrefix", ...)
    - call: graph.v1.LanternService/CountVerticesByPrefix
      data_template: |
        {"prefix":"k-"}
    # [3] targeted delete to keep the keyspace from growing unboundedly
    #     during the steady window; rate is intentionally low (≈ rps/20)
    - call: graph.v1.LanternService/DeleteVerticesByPrefix
      data_template: |
        {"prefix":"k-{{mod .RequestNumber 200}}-"}
leak_gate:
  goroutine_max_delta: 20
  heap_alloc_max_delta_mb: 24
