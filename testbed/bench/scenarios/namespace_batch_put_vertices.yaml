# Public keys that resemble internal prefixes must still encode exactly once.
# Compare the same workload under OFF before/after namespace activation and OIDC.
name: namespace_batch_put_vertices
phases:
  warmup: { duration: 30s, concurrency: 8, rps: 200 }
  steady: { duration: 5m, concurrency: 32, rps: 1000 }
  cooldown: 30s
target:
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  call: graph.v1.LanternService/PutVertices
  data_template: |
    {"vertices":[
      {"key":"users:{{mod .RequestNumber 10000}}","int64":"{{.RequestNumber}}"},
      {"key":"sys:users:{{mod .RequestNumber 10000}}","int64":"{{.RequestNumber}}"},
      {"key":"data:users:{{mod .RequestNumber 10000}}","int64":"{{.RequestNumber}}"},
      {"key":"日本語:{{mod .RequestNumber 10000}}","int64":"{{.RequestNumber}}"}
    ]}
leak_gate:
  goroutine_max_delta: 20
  heap_alloc_max_delta_mb: 48
