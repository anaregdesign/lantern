# many_subscribers — 64 public value CDC consumers across three replicas.
# Producer workload and floors are retained. Native private pumps still carry
# complete replication; external consumers now use scope-bound opaque cursors.
# changeprobe records bounded-stream resumes and gap/bootstrap separately.
name: many_subscribers
# This scenario deliberately drives the 10k-entry bench mutation log past its
# retention window so Subscribe gap recovery and full Snapshot replay are part
# of the load. Search snapshot recovery correctly marks the derived index
# incomplete and rejects local indexed writes while it rebuilds; that is an
# orthogonal contract already covered by the search scenarios and would turn
# expected recovery backpressure into a false producer perf failure here.
cluster:
  search_enabled: false
phases:
  # steady compacted from 5m to 2m for the release sweep (#573); still long
  # enough for the Subscribe fan-out to reach steady state and to bracket the
  # 60s GC sweep twice for the leak gate.
  warmup:   { duration: 30s, concurrency: 8, rps: 500 }
  steady:   { duration: 2m,  concurrency: 32, rps: 2000 }
  cooldown: 30s
target:
  # Writes pinned to one replica on purpose — see scenario doc above.
  endpoints: ["localhost:6380"]
  call: graph.v1.LanternService/PutVertex
  data_template: |
    {"vertex":{"key":"fan-{{.RequestNumber}}","int64":"{{.RequestNumber}}"}}
subscribe:
  # Consumers bootstrap the live tail; this is not historical replay.
  count: 64
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  call: graph.v1.LanternChangeService/WatchChanges
  data_template: '{"projection":"CHANGE_PROJECTION_VALUE","bootstrap":true}'
leak_gate:
  goroutine_max_delta: 80     # 64 streams × bookkeeping
  # 2k RPS × 2m of PutVertex with monotonically-increasing keys grows
  # the in-memory graph + mutation-log ring + per-replica replication
  # state by hundreds of MiB of legitimate live working set. Under
  # Reading B every replica now also appends remote-applied mutations
  # to its local log (so the local log seq matches the global write
  # rate), which roughly triples the per-replica retention pressure
  # compared to pre-B-3 builds. Keep the threshold generous enough to
  # cover the working set across all three replicas. See #258 item 2
  # for the rationale and #419 for the Reading B capacity discussion.
  heap_alloc_max_delta_mb: 512
# Floors originate from the 2026-06-29 → 2026-07-03 mixed search/subscriber
# nightly baselines. Keep those conservative thresholds until the search-free
# scenario has accumulated enough nightly samples for a deliberate rebaseline.
# The perf gate reads only the producer's ghz report; stream health is observed
# through the lantern_changes_* series (see #258 item 4).
perf_gate:
  min_steady_rps_total: 180
  max_p99_ms: 1500
  max_non_ok_ratio: 0.02
