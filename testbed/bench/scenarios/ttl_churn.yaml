# ttl_churn — born-expired Put and Delete churn must retain resurrection
# floors inside the explicit causal-metadata budget without growing heap.
#
# ghz templates lack arithmetic, so `expiration` is set to `now` (the
# built-in {{.Timestamp}} variable); every PutVertex therefore arrives
# already expired. Since #698 the server treats a write whose expiration is
# already in the past as an accepted delete-like overwrite: no live payload is
# stored, but HA retains its causal floor. #1204 bounds those floor identities
# separately from live graph state. The 4096-key ring reaches steady state in
# warmup; steady Put/Delete traffic then replaces barrier↔tombstone in one slot
# per key. This catches both lost resurrection floors and unbounded retention.
name: ttl_churn
cluster:
  max_vertex_causal_entries: 4096
phases:
  # steady is 2m so the post-warmup→post-cooldown leak window brackets the
  # 60s GC/TTL sweep twice (compacted from 5m for the release sweep, #573).
  warmup:   { duration: 30s, concurrency: 16, rps: 1000 }
  steady:   { duration: 2m,  concurrency: 64, rps: 4000 }
  cooldown: 60s
target:
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  calls:
    - name: born_expired_put
      rps: 3000
      call: graph.v1.LanternService/PutVertex
      data_template: |
        {"vertex":{"key":"ttl-{{mod .RequestNumber 4096}}","int64":"{{.RequestNumber}}","expiration":"{{.Timestamp}}"}}
    - name: delete
      rps: 1000
      call: graph.v1.LanternService/DeleteVertex
      data_template: |
        {"key":"ttl-{{mod .RequestNumber 4096}}"}
leak_gate:
  # cooldown is long enough that expirations have drained; tighter bounds.
  goroutine_max_delta: 15
  heap_alloc_max_delta_mb: 16
metric_gate:
  metrics:
    lantern_vertex_causal_metadata_entries: { min_post: 4096, max_post: 4096 }
    lantern_vertex_causal_metadata_entries_high_water: { min_post: 4096, max_post: 4096 }
    # 1 MiB covers the exact 4096-entry ledger plus the bounded lazy deadline
    # heap (at most 2*tombstones+1024 total deadline entries), while failing an
    # unbounded index-retention regression.
    lantern_vertex_causal_metadata_estimated_bytes: { min_post: 1, max_post: 1048576 }
    lantern_vertex_causal_metadata_over_limit: { min_post: 0, max_post: 0 }
# The aggregate floors retain substantial headroom below the historical
# 4000-rps born-expired baseline. Per-producer floors make the new Delete arm
# independently visible instead of allowing the faster Put arm to conceal it.
perf_gate:
  min_steady_rps_total: 2000
  max_p99_ms: 150
  max_non_ok_ratio: 0.02
  producers:
    born_expired_put: { min_steady_rps: 1000, max_p99_ms: 150, max_non_ok_ratio: 0.02 }
    delete: { min_steady_rps: 300, max_p99_ms: 150, max_non_ok_ratio: 0.02 }
