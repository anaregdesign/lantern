# ttl_churn — a flood of born-expired (dead-on-arrival) writes must not
# accumulate memory.
#
# ghz templates lack arithmetic, so `expiration` is set to `now` (the
# built-in {{.Timestamp}} variable); every PutVertex therefore arrives
# already expired. Since #698 the server treats a write whose expiration is
# already in the past as a no-op store (it is invisible to GetVertex the
# instant it lands anyway), so a sustained born-expired write flood must
# leave the vertex, dictionary, prefix-index and search-index high-water
# flat. Before #698 those maps grew to the inter-sweep high-water
# (~rps × GC interval ≈ 240k entries here) and never released that backing
# capacity after the sweep drained them, tripping the leak gate with
# tens of MiB retained against zero live vertices.
name: ttl_churn
phases:
  # steady is 2m so the post-warmup→post-cooldown leak window brackets the
  # 60s GC/TTL sweep twice (compacted from 5m for the release sweep, #573).
  warmup:   { duration: 30s, concurrency: 16, rps: 1000 }
  steady:   { duration: 2m,  concurrency: 64, rps: 4000 }
  cooldown: 60s
target:
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  call: graph.v1.LanternService/PutVertex
  data_template: |
    {"vertex":{"key":"ttl-{{.RequestNumber}}","int64":"{{.RequestNumber}}","expiration":"{{.Timestamp}}"}}
leak_gate:
  # cooldown is long enough that expirations have drained; tighter bounds.
  goroutine_max_delta: 15
  heap_alloc_max_delta_mb: 16
# Floors from the 2026-06-29 → 2026-07-03 nightly baselines: the single
# producer sustains the offered 4000 rps essentially exactly (3999.6–4000.0)
# with p99 12–27 ms and non-OK 2–12 of ~480k — the most stable scenario in
# the sweep, so all three metrics are gated.
perf_gate:
  min_steady_rps_total: 2000
  max_p99_ms: 150
  max_non_ok_ratio: 0.02
