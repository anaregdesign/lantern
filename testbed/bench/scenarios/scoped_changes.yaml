# Dedicated public CDC fanout (#1613). Diagnostic only; excluded from release
# qualification until the complete namespaced serving runtime is installed.
# An OIDC sweep must supply producer/consumer Role credentials externally; a
# successful anonymous run cannot qualify authorization or peer separation.
name: scoped_changes
cluster:
  search_enabled: false
phases:
  warmup: { duration: 10s, concurrency: 4, rps: 200 }
  steady: { duration: 60s, concurrency: 8, rps: 500 }
  cooldown: 10s
target:
  endpoints: ["localhost:6380"]
  call: graph.v1.LanternService/PutVertices
  data_template: |
    {"vertices":[
      {"key":"bench:visible:{{.RequestNumber}}","int64":"{{.RequestNumber}}"},
      {"key":"bench:hidden:{{.RequestNumber}}","int64":"{{.RequestNumber}}"}
    ]}
subscribe:
  count: 8
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  call: graph.v1.LanternChangeService/WatchChanges
  data_template: '{"prefix":"bench:visible:","projection":"CHANGE_PROJECTION_IDENTITY","bootstrap":true}'
leak_gate:
  goroutine_max_delta: 32
  heap_alloc_max_delta_mb: 256
