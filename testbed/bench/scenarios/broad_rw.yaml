# broad_rw — single steady window that fans out across the whole read/write/
# scan/edge/delete call surface. Replaces a handful of single-call scenarios
# in the release sweep: instead of paying per-scenario fixed overhead (warmup +
# pre/post snapshots + cooldown + Prometheus range queries + report render) for
# each call path, run.sh forks one ghz per entry in `target.calls` and runs them
# all in parallel for the same steady window (see the fan-out rule in run.sh:
# per_rps = steady.rps / len(calls), each fork gets the full steady.concurrency,
# endpoints are round-robined).
#
# Goal: broad call-path coverage + a leak gate that brackets the 60s GC sweep
#       twice (steady 2m). Key spaces are chosen so every call returns codes.OK
#       (non-OK ~ 0): plural reads return OK + a `missing` list rather than
#       NotFound; AddEdge is additive; DeleteVertex targets a monotonic space.
#       Search is disabled for this scenario because a mutation-log gap can
#       trigger snapshot restore on a saturated hosted runner; the derived
#       index then correctly fails strict local Put* with SEARCH_INDEX_INCOMPLETE
#       while it rebuilds. search_churn owns that lifecycle contract, whereas
#       broad_rw requires every RPC-surface producer to remain codes.OK (#1101).
#
# Ordering: calls[0] (PutVertex over k-*) is what warmup replays — run.sh warms
#           ONLY calls[0] — so it must be the working-set filler. The AddEdge
#           path exercises the additive k-* graph write shape. broad_illuminate
#           owns a separate, verified topology preflight (#994), so no release
#           scenario ordering depends on these incidental edges.
name: broad_rw
cluster:
  search_enabled: false
phases:
  warmup:   { duration: 15s, concurrency: 16, rps: 1000 }
  steady:   { duration: 2m,  concurrency: 16, rps: 12000 }
  cooldown: 15s
target:
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  # 12 parallel ghz invocations (one per call), each at steady.rps/12 = 1000 rps
  # and the full steady.concurrency (16) → 192 concurrent streams total.
  # Calls [8-11] were added per issue #708 to fold ScanVertexKeys,
  # ScanEdges, CountVerticesByPrefix, and idempotent AddEdge into the fan-out
  # so every instrumented path emits lantern_scan_* / lantern_search_* metrics
  # during the release sweep without paying a separate per-scenario fixed cost.
  calls:
    # [0] working-set filler — also what warmup replays. Keep this first.
    - call: graph.v1.LanternService/PutVertex
      data_template: |
        {"vertex":{"key":"k-{{mod .RequestNumber 2000}}","int64":"{{.RequestNumber}}"}}
    # [1] hot single-key read (k-* kept warm by warmup + call[0]).
    - call: graph.v1.LanternService/GetVertex
      data_template: |
        {"key":"k-{{mod .RequestNumber 2000}}"}
    # [2] plural write path (batch upsert into k-* and a sibling kb-* space).
    - call: graph.v1.LanternService/PutVertices
      data_template: |
        {"vertices":[
          {"key":"k-{{mod .RequestNumber 2000}}","int64":"{{.RequestNumber}}"},
          {"key":"kb-{{mod .RequestNumber 2000}}","int64":"{{.RequestNumber}}"}
        ]}
    # [3] plural read path — returns OK + `missing` even on a cold key, so this
    #     never contributes NotFound to the non-OK count.
    - call: graph.v1.LanternService/GetVertices
      data_template: |
        {"keys":["k-{{mod .RequestNumber 2000}}","kb-{{mod .RequestNumber 2000}}"]}
    # [4] additive edge write — exercises the k-* edge-mutation hot path.
    - call: graph.v1.LanternService/AddEdge
      data_template: |
        {"edge":{"tail":"k-{{mod .RequestNumber 2000}}","head":"k-{{mod .RequestNumber 1000}}","weight":1.0}}
    # [5] plural edge read — OK + `missing` semantics, like GetVertices.
    - call: graph.v1.LanternService/GetEdges
      data_template: |
        {"edges":[{"tail":"k-{{mod .RequestNumber 2000}}","head":"k-{{mod .RequestNumber 1000}}"}]}
    # [6] paginated prefix scan over the populated k-* space.
    - call: graph.v1.LanternService/ScanVertices
      data_template: |
        {"prefix":"k-","limit":128}
    # [7] delete path over a monotonic del-* space (no-op removals — exercises
    #     the DeleteVertex→DeleteVertices facade without churning the k-* graph).
    - call: graph.v1.LanternService/DeleteVertex
      data_template: |
        {"key":"del-{{.RequestNumber}}"}
    # [8] keys-only scan: low-bandwidth alternative to ScanVertices — exercises
    #     the ScanVertexKeys hot path and its lantern_scan_ops metric (#704).
    - call: graph.v1.LanternService/ScanVertexKeys
      data_template: |
        {"prefix":"k-","limit":256}
    # [9] edge scan — covers the ScanEdges path under the same write-filled graph.
    - call: graph.v1.LanternService/ScanEdges
      data_template: |
        {"tailPrefix":"k-","limit":128}
    # [10] aggregate count — exercises CountVerticesByPrefix and its
    #      OnScan("CountVerticesByPrefix", ...) metric instrumentation (#704).
    - call: graph.v1.LanternService/CountVerticesByPrefix
      data_template: |
        {"prefix":"k-"}
    # [11] idempotent AddEdge with ContribID — same (k-0,k-1) edge retried
    #      repeatedly with at-most-once semantics; verifies the contrib_id
    #      dedup set stays bounded (#706). The server only honors a canonical
    #      24-byte id, so the bounded 200-value space is padded to 24 ASCII
    #      bytes via backtick-quoted `printf` (a double-quoted "%024d" would
    #      break ghz's pre-template JSON parse) before base64. Without the
    #      pad the id decodes to zero and this silently joins call[4] on the
    #      additive path, doubling the steady-state heap.
    - call: graph.v1.LanternService/AddEdge
      data_template: |
        {"edge":{"tail":"k-0","head":"k-1","weight":1.0},"contribId":"{{ printf `%024d` (mod .RequestNumber 200) | b64enc }}"}
# heap_alloc is dominated by the additive AddEdge path (call[4], no
# contrib_id): each call appends a (weight, expiration) contribution that
# lives until the default 3600s TTL, so over a 2m steady at 1000 AddEdge/s
# ~120k contributions accumulate. The bench cluster replicates every write to
# all three peers (LANTERN_PEER_DISCOVERY=dns), so each replica independently
# holds that set — ~100–145 MiB per replica, measured across runs. This is a
# bounded working set, not a leak: goroutines stay flat/negative and the set
# is capped by steady-duration × per-call rps, not by total run length.
# (call[11] carries a bounded 24-byte ContribID so its retries dedup and add
# negligible heap; only the deliberately-additive call[4] grows.) The gate is
# sized with headroom over the measured peak. #709 bumped steady rps to 12000
# (still 1000 per call across 12 calls) and lengthened the window without
# lifting this gate; 192 restores the lockstep (was 64). See #711.
leak_gate:
  goroutine_max_delta: 30
  heap_alloc_max_delta_mb: 192
# Floors from the 2026-06-29 → 2026-07-03 nightly baselines: aggregate steady
# rps 2683–3552 (offered 12000 — the fan-out saturates a shared runner by
# design, so delivered throughput, not offered, is the signal), non-OK
# 98–171 of ~510k calls. p99 is deliberately ungated: with the offered load
# above capacity, tail latency is queue depth (observed 0.46–3.3 s
# night-over-night) — pure runner noise.
perf_gate:
  min_steady_rps_total: 1300
  max_non_ok_ratio: 0.02
