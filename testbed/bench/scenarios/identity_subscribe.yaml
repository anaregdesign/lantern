# identity_subscribe — bounded identity-only CDC fan-out from one writer.
# The producer perf floor and subscriber leak gate run in the blocking release
# sweep; stream frame sizes and gap behavior have focused real-wire tests.
name: identity_subscribe
cluster:
  search_enabled: false
phases:
  warmup:   { duration: 10s, concurrency: 4, rps: 200 }
  steady:   { duration: 60s, concurrency: 8, rps: 500 }
  cooldown: 10s
target:
  endpoints: ["localhost:6380"]
  call: graph.v1.LanternService/PutVertex
  data_template: |
    {"vertex":{"key":"identity-{{.RequestNumber}}","int64":"{{.RequestNumber}}"}}
subscribe:
  count: 8
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  call: graph.v1.LanternReplicationService/Subscribe
  data_template: '{"projection":"SUBSCRIBE_PROJECTION_IDENTITY_ONLY","bootstrap":true}'
leak_gate:
  goroutine_max_delta: 32
  heap_alloc_max_delta_mb: 256
perf_gate:
  min_steady_rps_total: 150
  max_p99_ms: 1500
  max_non_ok_ratio: 0.02
