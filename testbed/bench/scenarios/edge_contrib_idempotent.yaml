# edge_contrib_idempotent — sends AddEdge / AddEdges and
# DeleteEdgeContribution / DeleteEdgeContributions with client-supplied
# ContribIDs on a small set of hot (tail, head) pairs to verify that:
#
# - thread-safety: concurrent AddEdge calls on the same edge do not race
#   on the per-edge weight.values slice or the ContribID set.
# - consistency: a given ContribID is counted at-most-once regardless of
#   how many times the call is retried.
# - leak: the weight.values slice and the ContribID set must be bounded
#   by the number of distinct ContribIDs, not the total call count; D4
#   contribution tombstones must likewise stay bounded under repeated Deletes.
#
# The hot keyspace is intentionally narrow (a handful of edges) so lock
# contention and the at-most-once ContribID set are exercised together.
# Because every contribution carries a bounded, canonical 24-byte ContribID,
# the set and tombstones are capped by the number of distinct ids (not the call
# count), so the heap stays flat across the steady window and the leak gate
# confirms it never grows — the regression this scenario guards against (#706,
# #1528). This runs separately in the release sweep: adding producers to
# broad_mutate would change its measured per-call RPS and invalidate that gate.
# The bounded 400-RPS mix stayed ready on all three replicas after cooldown in
# an isolated local run; a 2,000-RPS mix triggered the existing HA saturation
# behavior tracked in #1531, so that rate is not used as a release floor.
name: edge_contrib_idempotent
phases:
  warmup:
    duration: 30s
    concurrency: 16
    rps: 100
  steady:
    duration: 2m
    concurrency: 16
    rps: 400
  cooldown: 60s
target:
  endpoints: ["localhost:6380", "localhost:6381", "localhost:6382"]
  calls:
    # [0] singular AddEdge with a stable ContribID derived from the request
    #     number — so the same ID appears repeatedly at high RPS and the
    #     server must deduplicate (at-most-once) instead of double-counting.
    #     contrib_id is request-level bytes (protojson base64). The server
    #     ONLY honors a canonical 24-byte id (contribIDFromBytes: any other
    #     length decodes to the zero "no identity" id and silently falls back
    #     to the legacy additive path), so the template pads the bounded
    #     200-value space to 24 ASCII bytes via `printf` before base64. The
    #     format string is backtick-quoted because ghz parses the -d JSON
    #     before templating — a double-quoted "%024d" would break that parse.
    - name: add_singular
      call: graph.v1.LanternService/AddEdge
      rps: 100
      data_template: |
        {"edge":{"tail":"node-{{mod .RequestNumber 5}}","head":"node-{{mod (add .RequestNumber 1) 5}}","weight":1.0},"contribId":"{{ printf `%024d` (mod .RequestNumber 200) | b64enc }}"}
    # [1] plural AddEdges fan-out: a 3-edge batch with index-aligned
    #     contrib_ids (request-level repeated bytes) — exercises the batch
    #     dedup path. The same bounded, 24-byte-padded ContribID is reused
    #     across retries so each (tail,head) records it at most once.
    - name: add_plural
      call: graph.v1.LanternService/AddEdges
      rps: 100
      data_template: |
        {"edges":[{"tail":"node-0","head":"node-1","weight":1.0},{"tail":"node-1","head":"node-2","weight":1.0},{"tail":"node-2","head":"node-3","weight":1.0}],"contribIds":["{{ printf `%024d` (mod .RequestNumber 40) | b64enc }}","{{ printf `%024d` (mod .RequestNumber 40) | b64enc }}","{{ printf `%024d` (mod .RequestNumber 40) | b64enc }}"]}
    # [2] targeted singular removal. Use the same hot pairs and bounded,
    # nonzero 24-byte IDs as [0]; an accepted absent Delete still retains
    # its D4 fence, so monotonic/unbounded IDs would falsely look like a leak.
    - name: delete_singular
      call: graph.v1.LanternService/DeleteEdgeContribution
      rps: 100
      data_template: |
        {"tail":"node-{{mod .RequestNumber 5}}","head":"node-{{mod (add .RequestNumber 1) 5}}","contribId":"{{ printf `%024d` (mod .RequestNumber 200) | b64enc }}"}
    # [3] plural removal over the same three hot pairs and bounded IDs as [1].
    - name: delete_plural
      call: graph.v1.LanternService/DeleteEdgeContributions
      rps: 100
      data_template: |
        {"contributions":[{"tail":"node-0","head":"node-1","contribId":"{{ printf `%024d` (mod .RequestNumber 40) | b64enc }}"},{"tail":"node-1","head":"node-2","contribId":"{{ printf `%024d` (mod .RequestNumber 40) | b64enc }}"},{"tail":"node-2","head":"node-3","contribId":"{{ printf `%024d` (mod .RequestNumber 40) | b64enc }}"}]}
leak_gate:
  goroutine_max_delta: 20
  heap_alloc_max_delta_mb: 24
# Provisional floors with >2x throughput headroom over the isolated local
# three-replica 400-RPS run (all four producers ~100 RPS, p99 <8 ms, one
# non-OK among ~48k calls). On-demand full-sweep evidence on a pinned release
# image is still needed before tightening the runner-specific ceilings.
perf_gate:
  min_steady_rps_total: 150
  max_p99_ms: 500
  max_non_ok_ratio: 0.02
  producers:
    add_singular: { min_steady_rps: 35, max_p99_ms: 500, max_non_ok_ratio: 0.02 }
    add_plural: { min_steady_rps: 35, max_p99_ms: 500, max_non_ok_ratio: 0.02 }
    delete_singular: { min_steady_rps: 35, max_p99_ms: 500, max_non_ok_ratio: 0.02 }
    delete_plural: { min_steady_rps: 35, max_p99_ms: 500, max_non_ok_ratio: 0.02 }
