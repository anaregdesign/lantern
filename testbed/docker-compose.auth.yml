# Native OIDC testbed profile. Provision complete config/secret files first.
# For deterministic CI use server/cmd/authfixture and native_receipt_fixture.sh.
services:
  lantern:
    env_file: ["${LANTERN_OIDC_CONFIG_DIR:?native OIDC configuration required}/server.env"]
    environment:
      LANTERN_AUTH_MODE: oidc
      LANTERN_SECURITY_PROFILE: legacy-v1
      LANTERN_METRICS_ADDR: 127.0.0.1:9090
    volumes:
      - ${LANTERN_OIDC_CONFIG_DIR:?native OIDC configuration required}/files:/run/lantern-config:ro
      - lantern-oidc-state:/state
    ports: !override ["127.0.0.1:6380:6380"]
  prometheus:
    profiles: [operator-diagnostics]
volumes:
  lantern-oidc-state:
